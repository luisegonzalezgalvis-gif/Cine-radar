          sizes: "192x192 512x512",
          type: "image/svg+xml"
        }
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
    document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(manifestBlob));

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
          self.addEventListener('notificationclick', (e) => {
            e.notification.close();
            e.waitUntil(clients.openWindow('./index.html'));
          });
        `;
        const swBlob = new Blob([swCode], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
      });
    }

    const playChime = () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880.00, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    };

        }
      };

        if (!('Notification' in window)) {
          showBanner('⚠️ Este navegador no soporta alertas web directas.');
          return;
        }
        try {
          const perm = await Notification.requestPermission();
          setNotificationPermission(perm);
          if (perm === 'granted') {
            showBanner('🔔 ¡Notificaciones activadas! Te avisaremos de nuevos capítulos.');

              icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🎬</text></svg>'
            });
          } else {
            showBanner('⚠️ Permiso no otorgado. Puedes activarlo en la configuración del navegador.');
          }
        } catch (e) {

                            src={series.poster}
                            alt={series.title}
                            className="w-full h-full object-cover object-top"
                            loading="lazy"
                          />
                          <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent"></div>

                          <div className="absolute top-3 right-3 bg-amber-400 text-slate-950 font-black text-xs px-2.5 py-1 rounded-xl shadow-md">
                            ★ {series.rating}
                          </div>

                          <div className="absolute top-3 left-3">
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-slate-950/80 backdrop-blur text-white border border-white/10">
                              {series.platform}
                            </span>
                          </div>

                          <div className="absolute bottom-2 left-3 right-3">
                            <h3 className="font-display font-extrabold text-sm text-white">{series.title}</h3>
                          </div>
                        </div>

                        <div className="p-3.5 space-y-2 text-xs">
                          <div className="flex flex-wrap gap-1">
                            {series.genres.map((g, i) => (
                              <span key={i} className="text-[9px] bg-slate-900 text-slate-400 px-2 py-0.5 rounded-md border border-slate-800">
                                {g}
                              </span>
                            ))}
                          </div>

                          <p className="text-[11px] text-slate-300 line-clamp-2">
                            {series.releaseSchedule}
                          </p>
                        </div>
                      </div>

                      <div className="p-3.5 pt-0">
                        <button
                          onClick={() => toggleTracking(series.id)}
                          className={`w-full py-2 px-3 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${
                            series.userTracking 
                              ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' 
                              : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-md'
                          }`}
                        >
                          <span>{series.userTracking ? '✓ En Seguimiento' : '➕ Seguir Serie'}</span>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* Modal para Añadir Nueva Serie Personalizada */}
          {showNewSeriesModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="glass-panel bg-slate-900 border border-slate-700 rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="font-display font-extrabold text-base text-white flex items-center gap-2">
                    ➕ Seguir Serie Personalizada
                  </h3>
                  <button
                    onClick={() => setShowNewSeriesModal(false)}
                    className="text-slate-400 hover:text-white text-xs font-bold"
                  >
                    ✕ Cerrar
                  </button>
                </div>

                <form onSubmit={handleAddCustomSeries} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-300 font-bold block mb-1">Nombre de la Serie *</label>
                    <input
                      type="text"
                      required
                      placeholder="Ej: Euphoria, Peaky Blinders, Succession..."
                      value={formTitle}
                      onChange={(e) => setFormTitle(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-300 font-bold block mb-1">Plataforma *</label>
                      <select
                        value={formPlatform}
                        onChange={(e) => setFormPlatform(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500"
                      >
                        <option value="Max (HBO)">Max (HBO)</option>
                        <option value="Netflix">Netflix</option>
                        <option value="Prime Video">Prime Video</option>
                        <option value="Disney+ / Star+">Disney+ / Star+</option>
                        <option value="Apple TV+">Apple TV+</option>
                        <option value="Paramount+">Paramount+</option>
                      </select>
                    </div>

                    <div>
                      <label className="text-slate-300 font-bold block mb-1">Tipo de Emisión *</label>
                      <select
                        value={formStatus}
                        onChange={(e) => setFormStatus(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500"
                      >
                        <option value="airing_weekly">Capítulo Semanal</option>
                        <option value="waiting_season">Esperando Temporada</option>
                      </select>
                    </div>
                  </div>

                  {formStatus === 'airing_weekly' ? (
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-slate-300 font-bold block mb-1">Día de Estreno</label>
                        <select
                          value={formAirDay}
                          onChange={(e) => setFormAirDay(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500"
                        >
                          <option value="Lunes">Lunes</option>
                          <option value="Martes">Martes</option>
                          <option value="Miércoles">Miércoles</option>
                          <option value="Jueves">Jueves</option>
                          <option value="Viernes">Viernes</option>
                          <option value="Sábados">Sábados</option>
                          <option value="Domingos">Domingos</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-slate-300 font-bold block mb-1">Hora (COT)</label>
                        <input
                          type="text"
                          value={formAirTime}
                          onChange={(e) => setFormAirTime(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white"
                        />
                      </div>
                    </div>
                  ) : (
                    <div>
                      <label className="text-slate-300 font-bold block mb-1">Fecha Próxima Temporada</label>
                      <input
                        type="date"
                        value={formNextDate}
                        onChange={(e) => setFormNextDate(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white"
                      />
                    </div>
                  )}

                  <div>
                    <label className="text-slate-300 font-bold block mb-1">URL Imagen Poster (Opcional)</label>
                    <input
                      type="url"
                      placeholder="https://..."
                      value={formPoster}
                      onChange={(e) => setFormPoster(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-white"
                    />
                  </div>

                  <div className="pt-2 flex gap-2">
                    <button
                      type="button"
                      onClick={() => setShowNewSeriesModal(false)}
                      className="w-1/2 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="w-1/2 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold shadow-lg shadow-indigo-600/30"
                    >
                      Guardar y Seguir
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-900 bg-slate-950/80 text-center py-4 text-xs text-slate-500">
            CineRadar Pro &copy; {new Date().getFullYear()} — Tracker PWA de Series, Alertas de Capítulos y Estrenos de Cine.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
