    const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
    document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(manifestBlob));

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
          self.addEventListener('notificationclick', (e) => {
            e.notification.close();
            e.waitUntil(clients.openWindow('./index.html'));
          });
        `;
        const swBlob = new Blob([swCode], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
      });
    }
  </script>

    const playChime = () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880.00, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    };

        if (!('Notification' in window)) {

          return;
        }
        try {
          const perm = await Notification.requestPermission();

          }

      // Alternar Estado: En Emisión <-> Esperando Temporada

        setSeriesList(prev => prev.map(s => {

          }
          return s;

            const nextEp = Math.max(1, current + delta);
            showBanner(`📺 ${s.title}: Capítulo ${nextEp}`);

            const nextSn = Math.max(1, current + delta);
            showBanner(`🎬 ${s.title}: Temporada ${nextSn}`);

        setIsSearchingApi(true);

        const show = item.show;
        if (!show) return;

        const cleanSummary = show.summary ? show.summary.replace(/<[^>]*>?/gm, '') : '';
        const titleKey = show.name.trim().toLowerCase();
        
        // Verificamos si existe en la base de conocimiento correlacionada
        const kbMatch = SERIES_KNOWLEDGE_BASE[titleKey];

        const platformName = kbMatch 
          ? kbMatch.platform 
          : (show.webChannel ? show.webChannel.name : (show.network ? show.network.name : 'Streaming'));
        
        const airDay = kbMatch 
          ? kbMatch.airDay 
          : (show.schedule && show.schedule.days && show.schedule.days.length > 0 ? show.schedule.days[0] : 'Viernes');
        
        const airTime = kbMatch 
          ? kbMatch.airTime 
          : (show.schedule && show.schedule.time ? `${show.schedule.time} COT` : '02:00 AM COT');

        // Determinación inteligente de estado:
        // Si no tiene episodio en emisión activa inmediata o coincide con base de conocimiento -> waiting_season
        let computedStatus = 'waiting_season';
        let nextSeasonNum = 2;
        let nextReleaseDateStr = '2024-11-15';
        let releaseDesc = 'Temporada finalizada. Próxima entrega en espera.';

        if (kbMatch) {
          computedStatus = kbMatch.status;
          nextSeasonNum = kbMatch.nextSeasonNumber;
          nextReleaseDateStr = kbMatch.nextReleaseDate;
          releaseDesc = kbMatch.releaseSchedule;
        } else {
          // Si TVMaze dice que terminó completamente
          if (show.status === 'Ended') {
            computedStatus = 'waiting_season';
            releaseDesc = 'Serie concluida oficialmente.';
          } else {
            // Serie en curso pero entre temporadas
            computedStatus = 'waiting_season';
            releaseDesc = `Esperando confirmación de próxima temporada por ${platformName}.`;
          }
        }

        const posterUrl = show.image 
          ? (show.image.original || show.image.medium) 
          : DEFAULT_FALLBACK_POSTER;

        const newSeries = {
          id: 'tvmaze-' + show.id + '-' + Date.now(),
          title: show.name,
          platform: platformName,
          platformBg: platformName.toLowerCase().includes('apple') ? 'bg-zinc-800 text-zinc-200 border-zinc-500/40' :
                      platformName.toLowerCase().includes('max') || platformName.toLowerCase().includes('hbo') ? 'bg-purple-900/60 text-purple-200 border-purple-500/40' :
                      platformName.toLowerCase().includes('netflix') ? 'bg-red-900/60 text-red-200 border-red-500/40' :
                      platformName.toLowerCase().includes('prime') ? 'bg-sky-900/60 text-sky-200 border-sky-500/40' :
                      'bg-slate-800 text-slate-200 border-slate-700',
          rating: show.rating && show.rating.average ? show.rating.average : 8.2,
          genres: show.genres && show.genres.length > 0 ? show.genres : ['Drama'],
          status: computedStatus,
          currentSeason: computedStatus === 'waiting_season' ? Math.max(1, nextSeasonNum - 1) : 1,
          currentEpisode: 1,
          totalEpisodesSeason: 10,
          nextSeasonNumber: nextSeasonNum,
          nextReleaseDate: nextReleaseDateStr,
          releaseSchedule: releaseDesc,
          airDay: airDay,
          airTime: airTime,
          poster: posterUrl,
          userTracking: true,
          userProgressSeason: computedStatus === 'waiting_season' ? Math.max(1, nextSeasonNum - 1) : 1,
          userProgressEpisode: 1,
          notes: cleanSummary.slice(0, 140) + (cleanSummary.length > 140 ? '...' : '')
        };

        setSeriesList(prev => [newSeries, ...prev]);
        setShowNewSeriesModal(false);
        setApiSearchQuery('');
        setApiSearchResults([]);
        showBanner(`🎉 ¡"${show.name}" agregada correctamente como: ${computedStatus === 'waiting_season' ? '⏳ Próximas Temporadas' : '⚡ Emisión Semanal'}!`);
      };

      const handleAddCustomSeries = (e) => {
        e.preventDefault();
        if (!formTitle.trim()) return;

        const newSeries = {
          id: 'custom-' + Date.now(),
          title: formTitle.trim(),
          platform: formPlatform,
          platformBg: formPlatform.includes('Apple') ? 'bg-zinc-800 text-zinc-200 border-zinc-500/40' :
                      formPlatform.includes('Max') ? 'bg-purple-900/60 text-purple-200 border-purple-500/40' :
                      formPlatform.includes('Netflix') ? 'bg-red-900/60 text-red-200 border-red-500/40' :
                      'bg-sky-900/60 text-sky-200 border-sky-500/40',
          rating: parseFloat(formRating) || 8.0,
          genres: ['Drama', 'Serie'],
          status: formStatus,
          currentSeason: 1,
          currentEpisode: 1,
          totalEpisodesSeason: 8,
          nextSeasonNumber: parseInt(formNextSeason) || 2,
          nextReleaseDate: formNextDate || '2024-11-15',
          releaseSchedule: formStatus === 'airing_weekly' ? `Nuevo episodio todos los ${formAirDay} a las ${formAirTime}` : `Nueva Temporada ${formNextSeason} programada para el ${formNextDate}`,
          airDay: formAirDay,
          airTime: formAirTime,
          poster: formPoster.trim() || DEFAULT_FALLBACK_POSTER,
          userTracking: true,
          userProgressSeason: 1,
          userProgressEpisode: 1,
          notes: 'Añadida manualmente.'

        setSeriesList([newSeries, ...seriesList]);
        setShowNewSeriesModal(false);
        setFormTitle('');
        setFormPoster('');
        showBanner(`🎉 ¡"${newSeries.title}" añadida con éxito!`);

      const myTrackedSeries = useMemo(() => seriesList.filter(s => s.userTracking), [seriesList]);
      const weeklyAiringSeries = useMemo(() => seriesList.filter(s => s.status === 'airing_weekly'), [seriesList]);
      const waitingSeasonsList = useMemo(() => seriesList.filter(s => s.status === 'waiting_season'), [seriesList]);

      const filteredExplore = useMemo(() => {
        return seriesList.filter(s => {
          const matchP = selectedPlatform === 'all' || s.platform.toLowerCase().includes(selectedPlatform.toLowerCase());
          const matchQ = s.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                         s.genres.some(g => g.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchP && matchQ;
        }).sort((a, b) => b.rating - a.rating);

      return (

          {/* Header Superior */}
          <header className="sticky top-0 z-40 glass-panel border-b border-slate-800/80 px-4 sm:px-8 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center text-xl shadow-lg shadow-indigo-600/30">
                🎬
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="font-display font-black text-lg tracking-tight text-white">CineRadar</h1>
                  <span className="text-[10px] font-mono font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 px-2 py-0.5 rounded-full">PWA PRO</span>
                </div>
                <p className="text-[11px] text-slate-400">Rastreador de Capítulos Semanales & Estrenos de Temporadas</p>

            <div className="flex items-center gap-2">

                title="Instalar en Android / PC"

                📲 <span>Instalar App</span>
              </button>

              </button>

              <button

                className="flex items-center gap-1.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all shadow-lg shadow-indigo-600/30"
              >
                🔍 <span>Buscar y Seguir Serie</span>
              </button>
            </div>
          </header>

          {/* Banner Toast Flotante */}
          {bannerMessage && (
            <div className="fixed top-16 left-1/2 transform -translate-x-1/2 z-50 bg-gradient-to-r from-indigo-600 to-purple-600 text-white text-xs font-bold px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-2 border border-indigo-400 animate-bounce">
              <span>✨</span>
              <span>{bannerMessage}</span>
            </div>

          {/* Barra de Navegación por Pestañas */}
          <div className="max-w-7xl mx-auto w-full px-4 sm:px-8 pt-4">
            <div className="grid grid-cols-5 gap-1 sm:gap-2 p-1 bg-slate-900/90 rounded-2xl border border-slate-800 text-xs font-bold">
              {[
                { id: 'tracking', label: 'Mis Series', icon: '📺', count: myTrackedSeries.length },
                { id: 'today', label: 'Capítulos Hoy', icon: '⚡', count: weeklyAiringSeries.length },
                { id: 'seasons', label: 'Próx. Temporadas', icon: '⏳', count: waitingSeasonsList.length },
                { id: 'movies', label: 'Cine & Trailers', icon: '🍿', count: moviesList.length },
                { id: 'explore', label: 'Top Calificadas', icon: '⭐', count: filteredExplore.length }

                return (

                        {tab.count}

                  </button>

                    <h3 className="font-display font-bold text-white text-base">No tienes series en seguimiento actualmente</h3>
                    <p className="text-xs text-slate-400 max-w-sm mx-auto">Busca tus series favoritas o explora el catálogo para añadirlas.</p>
                    <button
                      onClick={() => setShowNewSeriesModal(true)}
                      className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition-all shadow-lg"
                    >
                      🔍 Buscar y Seguir Serie
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {myTrackedSeries.map(series => (
                      <div key={series.id} className="glass-panel card-hover rounded-3xl overflow-hidden flex flex-col justify-between border border-slate-800">
                        <div>
                          {/* Poster */}
                          <div className="relative h-60 w-full overflow-hidden bg-slate-900">
                            <img
                              src={series.poster}
                              alt={series.title}
                              className="w-full h-full object-cover object-top opacity-90 hover:opacity-100 transition-opacity"
                              loading="lazy"
                              onError={(e) => {
                                e.target.onerror = null;
                                e.target.src = DEFAULT_FALLBACK_POSTER;
                              }}
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
                            
                            <div className="absolute top-3 left-3">
                              <span className="text-[10px] font-black px-2.5 py-1 rounded-xl bg-slate-950/80 backdrop-blur border border-white/10 text-white shadow-md">
                                📺 {series.platform}
                              </span>
                            </div>

                            <div className="absolute top-3 right-3 flex items-center gap-1 bg-amber-500 text-slate-950 font-black text-xs px-2 py-0.5 rounded-lg shadow-md">
                              ★ {series.rating}
                            </div>

                            <div className="absolute bottom-3 left-3 right-3">
                              <span className="text-[10px] font-mono uppercase tracking-wider text-indigo-400 font-bold block">
                                {series.genres.join(' • ')}
                              </span>
                              <h3 className="font-display font-extrabold text-base sm:text-lg text-white leading-tight">
                                {series.title}
                              </h3>
                            </div>
                          </div>

                          <div className="p-4 space-y-3">
                            {/* Switch de Estado Interactivo */}
                            {series.status === 'airing_weekly' ? (
                              <div className="bg-emerald-950/50 border border-emerald-500/40 p-3 rounded-2xl space-y-1.5 glow-emerald">
                                <div className="flex items-center justify-between text-[11px]">
                                  <span className="font-bold text-emerald-400 flex items-center gap-1.5">
                                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                                    EN EMISIÓN SEMANAL

                                  <button
                                    onClick={() => toggleSeriesStatus(series.id)}
                                    className="text-[10px] bg-emerald-900/60 hover:bg-emerald-800 text-emerald-200 border border-emerald-400/40 px-2 py-0.5 rounded-lg font-bold"
                                    title="Cambiar a Esperando Temporada"
                                  >
                                    🔄 Cambiar estado
                                  </button>
                                </div>
                                <p className="text-xs text-slate-200 font-medium">{series.releaseSchedule}</p>
                                <div className="flex items-center justify-between text-[10px] font-mono text-emerald-300 pt-0.5">
                                  <span>Día: {series.airDay}</span>
                                  <span>Hora: {series.airTime}</span>
                                </div>
                              </div>
                            ) : (
                              <div className="bg-purple-950/50 border border-purple-500/40 p-3 rounded-2xl space-y-1.5 glow-purple">
                                <div className="flex items-center justify-between text-[11px]">

                                    ⏳ ESPERANDO TEMPORADA {series.nextSeasonNumber}

                                  <button

            )}

            {/* VISTA 3: PRÓXIMAS TEMPORADAS */}
            {activeTab === 'seasons' && (
              <div className="space-y-4">
                <div className="bg-gradient-to-r from-purple-950/60 via-slate-900 to-slate-900 border border-purple-500/30 p-5 rounded-3xl space-y-1">
                  <h2 className="font-display font-extrabold text-base sm:text-lg text-white flex items-center gap-2">
                    ⏳ Radar de Próximas Temporadas ({waitingSeasonsList.length})
                  </h2>
                  <p className="text-xs text-slate-300">
                    Series cuyas temporadas anteriores finalizaron y están esperando su fecha oficial de estreno.
                  </p>
                </div>

                {waitingSeasonsList.length === 0 ? (
                  <div className="text-center py-16 glass-panel rounded-3xl border border-slate-800 space-y-2">
                    <p className="text-xs text-slate-400">No hay series en espera de temporada actualmente.</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {waitingSeasonsList.map(series => (
                      <div key={series.id} className="glass-panel card-hover rounded-3xl p-5 border border-purple-500/20 space-y-4 flex flex-col justify-between">
                        <div className="space-y-3">
                          <div className="flex gap-3">
                            <img
                              src={series.poster}
                              alt={series.title}
                              className="w-20 h-28 rounded-2xl object-cover shadow-md border border-slate-700 shrink-0"
                              onError={(e) => { e.target.src = DEFAULT_FALLBACK_POSTER; }}
                            />
                            <div>
                              <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/40">
                                {series.platform}
                              </span>
                              <h3 className="font-display font-extrabold text-base text-white pt-1">{series.title}</h3>
                              <span className="text-xs text-slate-400 block pt-0.5">Finalizada: Temporada {series.currentSeason}</span>
                              
                              <button
                                onClick={() => toggleSeriesStatus(series.id)}
                                className="text-[10px] bg-slate-900 hover:bg-slate-800 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-lg font-bold transition-all mt-1"
                              >
                                ⚡ Mover a Emisión Semanal
                              </button>
                            </div>
                          </div>

                          <div className="bg-purple-950/40 p-3.5 rounded-2xl border border-purple-500/30 space-y-1.5">
                            <span className="text-[10px] font-bold text-purple-300 uppercase tracking-wider block">
                              🎯 Próxima Temporada {series.nextSeasonNumber}:
                            </span>
                            <span className="text-base font-mono font-black text-amber-300 block">
                              📅 {series.nextReleaseDate}
                            </span>
                            <p className="text-xs text-slate-300">
                              {series.releaseSchedule}
                            </p>
                          </div>
                        </div>

                        <div className="grid grid-cols-2 gap-2">
                          <button
                            onClick={() => deleteSeriesCompletely(series.id, series.title)}
                            className="bg-rose-950/40 hover:bg-rose-900/80 text-rose-300 border border-rose-800/40 text-[11px] font-bold py-2 rounded-xl transition-all flex items-center justify-center gap-1"
                          >
                            🗑️ <span>Eliminar</span>
                          </button>
                          <button
                            onClick={() => showBanner(`🔔 Alerta programada para la Temporada ${series.nextSeasonNumber} de ${series.title}`)}
                            className="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-[11px] font-bold py-2 rounded-xl transition-all shadow-md flex items-center justify-center gap-1"
                          >
                            🔔 <span>Alerta T{series.nextSeasonNumber}</span>
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* VISTA 4: ESTRENOS DE CINE */}
            {activeTab === 'movies' && (
              <div className="space-y-4">
                <div className="bg-gradient-to-r from-red-950/60 via-slate-900 to-slate-900 border border-red-500/30 p-5 rounded-3xl space-y-1">
                  <h2 className="font-display font-extrabold text-base sm:text-lg text-white flex items-center gap-2">
                    🍿 Radar de Estrenos de Cine & Trailers Oficiales ({moviesList.length})
                  </h2>
                  <p className="text-xs text-slate-300">
                    Películas más esperadas con fecha de estreno y acceso directo al trailer oficial en YouTube.
                  </p>
                </div>

                {moviesList.length === 0 ? (
                  <div className="text-center py-16 glass-panel rounded-3xl border border-slate-800 space-y-2">
                    <p className="text-xs text-slate-400">Has descartado todos los estrenos de cine.</p>
                    <button
                      onClick={restoreDefaults}
                      className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition-all shadow-md"
                    >
                      🔄 Restaurar Estrenos
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {moviesList.map(movie => (
                      <div key={movie.id} className="glass-panel card-hover rounded-3xl overflow-hidden border border-slate-800 flex flex-col justify-between">
                        <div>
                          <div className="relative h-64 w-full bg-slate-900">
                            <img
                              src={movie.poster}
                              alt={movie.title}
                              className="w-full h-full object-cover object-top"
                              loading="lazy"
                              onError={(e) => { e.target.src = movie.fallbackPoster || DEFAULT_FALLBACK_POSTER; }}
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
                            
                            <div className="absolute top-3 left-3 bg-red-600 text-white font-black text-[10px] px-2.5 py-1 rounded-full uppercase tracking-wider shadow-md">
                              Estreno Cine
                            </div>

                            <button
                              onClick={() => deleteMovieCompletely(movie.id, movie.title)}
                              className="absolute top-3 right-3 bg-slate-950/80 hover:bg-rose-900 text-rose-300 p-1.5 rounded-xl border border-rose-500/30 text-xs shadow-md transition-all"
                              title="Eliminar estreno"
                            >
                              🗑️
                            </button>

                            <div className="absolute bottom-3 left-3 right-3">
                              <span className="text-[10px] text-red-400 font-mono font-bold block">{movie.genre}</span>
                              <h3 className="font-display font-extrabold text-base sm:text-lg text-white">{movie.title}</h3>
                            </div>
                          </div>

                          <div className="p-4 space-y-3">
                            <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 space-y-1">
                              <span className="text-[10px] text-slate-400 font-bold block uppercase">Fecha de Estreno en Salas:</span>
                              <span className="text-sm font-mono font-extrabold text-amber-300 block">
                                📅 {movie.releaseDate}
                              </span>
                            </div>

                            <p className="text-xs text-slate-300 leading-relaxed">
                              {movie.synopsis}
                            </p>

                            <div className="text-[11px] text-slate-400 space-y-0.5">
                              <div><strong className="text-slate-300">Director:</strong> {movie.director}</div>
                              <div><strong className="text-slate-300">Reparto:</strong> {movie.cast}</div>
                            </div>
                          </div>
                        </div>

                        <div className="p-4 pt-0 grid grid-cols-4 gap-2">
                          <a
                            href={movie.youtubeUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="col-span-3 bg-gradient-to-r from-red-600 to-rose-700 hover:from-red-500 hover:to-rose-600 text-white font-bold py-2.5 px-3 rounded-xl text-xs transition-all shadow-lg flex items-center justify-center gap-1.5 active:scale-95"
                          >
                            ▶ <span>Ver Trailer en YouTube</span> ↗
                          </a>
                          <button
                            onClick={() => deleteMovieCompletely(movie.id, movie.title)}
                            className="col-span-1 bg-rose-950/40 hover:bg-rose-900/80 text-rose-300 border border-rose-800/40 rounded-xl text-xs font-bold flex items-center justify-center"
                            title="Eliminar película"
                          >
                            🗑️
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* VISTA 5: TOP CALIFICADAS */}
            {activeTab === 'explore' && (
              <div className="space-y-5">
                <div className="glass-panel p-4 rounded-3xl border border-slate-800 space-y-3">
                  <div className="flex flex-col sm:flex-row items-center justify-between gap-3">
                    <div className="relative w-full sm:w-80">
                      <input
                        type="text"
                        placeholder="Buscar en catálogo por título o género..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                      />
                      <div className="absolute left-3 top-2.5 text-slate-400">🔍</div>
                    </div>

                    <div className="flex flex-wrap gap-1.5 w-full sm:w-auto justify-start sm:justify-end">
                      {PLATFORMS.map(p => (
                        <button
                          key={p.id}
                          onClick={() => setSelectedPlatform(p.id)}
                          className={`text-xs px-3 py-1.5 rounded-xl font-bold border transition-all ${
                            selectedPlatform === p.id 
                              ? 'bg-indigo-600 text-white border-indigo-400 shadow-md' 
                              : 'bg-slate-950/80 text-slate-400 border-slate-800 hover:text-white'
                          }`}
                        >
                          {p.name}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                  {filteredExplore.map(series => (
                    <div key={series.id} className="glass-panel card-hover rounded-3xl overflow-hidden border border-slate-800 flex flex-col justify-between">
                      <div>
                        <div className="relative h-64 w-full bg-slate-900">
                          <img
                            src={series.poster}
                            alt={series.title}
                            className="w-full h-full object-cover object-top"
                            loading="lazy"
                            onError={(e) => { e.target.src = DEFAULT_FALLBACK_POSTER; }}
                          />
                          <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent"></div>

                          <div className="absolute top-3 right-3 bg-amber-400 text-slate-950 font-black text-xs px-2.5 py-1 rounded-xl shadow-md">
                            ★ {series.rating}
                          </div>

                          <div className="absolute top-3 left-3">
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-slate-950/80 backdrop-blur text-white border border-white/10">
                              {series.platform}
                            </span>
                          </div>

                          <div className="absolute bottom-2 left-3 right-3">
                            <h3 className="font-display font-extrabold text-sm text-white">{series.title}</h3>
                          </div>
                        </div>

                        <div className="p-3.5 space-y-2 text-xs">
                          <div className="flex flex-wrap gap-1">
                            {series.genres.map((g, i) => (
                              <span key={i} className="text-[9px] bg-slate-900 text-slate-400 px-2 py-0.5 rounded-md border border-slate-800">
                                {g}
                              </span>
                            ))}
                          </div>

                          <p className="text-[11px] text-slate-300 line-clamp-2">
                            {series.releaseSchedule}
                          </p>
                        </div>
                      </div>

                      <div className="p-3.5 pt-0 grid grid-cols-3 gap-1.5">
                        <button
                          onClick={() => toggleTracking(series.id)}
                          className={`col-span-2 py-2 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1 ${
                            series.userTracking 
                              ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' 
                              : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-md'
                          }`}
                        >
                          <span>{series.userTracking ? '✓ Siguiendo' : '➕ Seguir'}</span>
                        </button>
                        <button
                          onClick={() => deleteSeriesCompletely(series.id, series.title)}
                          className="col-span-1 py-2 rounded-xl text-xs font-bold bg-rose-950/40 hover:bg-rose-900/80 text-rose-300 border border-rose-800/40 flex items-center justify-center"
                          title="Eliminar de la lista"
                        >
                          🗑️
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* Modal de Búsqueda Online Multi-Fuente */}
          {showNewSeriesModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div className="glass-panel bg-slate-900 border border-slate-700 rounded-3xl p-5 sm:p-6 max-w-lg w-full space-y-4 shadow-2xl my-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🔍</span>
                    <h3 className="font-display font-extrabold text-base text-white">
                      Añadir Serie al Radar
                    </h3>
                  </div>
                  <button
                    onClick={() => {
                      setShowNewSeriesModal(false);
                      setApiSearchQuery('');
                      setApiSearchResults([]);
                    }}
                    className="text-slate-400 hover:text-white text-xs font-bold p-1 bg-slate-800 rounded-lg"
                  >
                    ✕ Cerrar
                  </button>
                </div>

                {/* Pestañas del Modal */}
                <div className="grid grid-cols-2 gap-2 p-1 bg-slate-950 rounded-xl border border-slate-800 text-xs font-bold">
                  <button
                    onClick={() => setModalTab('search')}
                    className={`py-1.5 rounded-lg transition-all ${
                      modalTab === 'search' 
                        ? 'bg-indigo-600 text-white shadow-md' 
                        : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    🌐 Búsqueda Inteligente
                  </button>
                  <button
                    onClick={() => setModalTab('manual')}
                    className={`py-1.5 rounded-lg transition-all ${
                      modalTab === 'manual' 
                        ? 'bg-indigo-600 text-white shadow-md' 
                        : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    ✏️ Ingreso Manual
                  </button>
                </div>

                {/* MODO 1: BÚSQUEDA MULTI-FUENTE */}
                {modalTab === 'search' && (
                  <div className="space-y-4 text-xs">
                    <div className="space-y-1">
                      <label className="text-slate-300 font-bold block">
                        Escribe el nombre de cualquier serie:
                      </label>
                      <div className="relative">
                        <input
                          type="text"
                          placeholder="Ej: Slow Horses, Silo, Ted Lasso, The Bear, Dark..."
                          value={apiSearchQuery}
                          onChange={(e) => handleSearchMultiSource(e.target.value)}
                          className="w-full bg-slate-950 border border-indigo-500/50 rounded-xl pl-9 pr-3 py-2.5 text-white focus:outline-none focus:border-indigo-400 text-xs shadow-inner"
                          autoFocus
                        />
                        <div className="absolute left-3 top-3 text-slate-400">🔍</div>
                        {isSearchingApi && (
                          <div className="absolute right-3 top-3 text-indigo-400 animate-spin">⏳</div>
                        )}
                      </div>
                      <p className="text-[10px] text-slate-400">
                        ✨ Correlaciona automáticamente con la base de datos de estrenos y clasifica entre emisión o espera.
                      </p>
                    </div>

                    {/* Lista de Resultados */}
                    <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                      {apiSearchResults.length > 0 ? (
                        apiSearchResults.map(({ show }) => {
                          const poster = show.image ? (show.image.medium || show.image.original) : DEFAULT_FALLBACK_POSTER;
                          const platform = show.webChannel ? show.webChannel.name : (show.network ? show.network.name : 'Streaming');
                          const rating = show.rating && show.rating.average ? show.rating.average : '8.0';

                          return (
                            <div
                              key={show.id}
                              className="flex items-center justify-between p-2.5 bg-slate-950/80 hover:bg-slate-800/80 border border-slate-800 rounded-2xl transition-all gap-3"
                            >
                              <img
                                src={poster}
                                alt={show.name}
                                className="w-12 h-16 object-cover rounded-xl shrink-0 border border-slate-700"
                                onError={(e) => { e.target.src = DEFAULT_FALLBACK_POSTER; }}
                              />
                              <div className="flex-1 min-w-0">
                                <h4 className="font-display font-bold text-white text-xs truncate">{show.name}</h4>
                                <div className="flex items-center gap-1.5 text-[10px] text-slate-400 pt-0.5">
                                  <span className="text-indigo-400 font-bold">{platform}</span>
                                  <span>•</span>
                                  <span className="text-amber-400 font-mono">★ {rating}</span>
                                  <span>•</span>
                                  <span>{show.genres && show.genres.slice(0, 2).join(', ')}</span>
                                </div>
                              </div>
                              <button
                                onClick={() => handleImportFromApi({ show })}
                                className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-[11px] px-3 py-1.5 rounded-xl shrink-0 transition-all shadow-md"
                              >
                                ➕ Seguir
                              </button>
                            </div>
                          );
                        })
                      ) : apiSearchQuery.trim().length >= 2 ? (
                        <div className="text-center py-6 text-slate-500 text-xs">
                          No se encontraron series. Intenta con otro título.
                        </div>
                      ) : (
                        <div className="text-center py-6 text-slate-500 text-xs">
                          Escribe al menos 2 letras para buscar en el catálogo mundial.
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {/* MODO 2: INGRESO MANUAL */}
                {modalTab === 'manual' && (
                  <form onSubmit={handleAddCustomSeries} className="space-y-3 text-xs">
                    <div>
                      <label className="text-slate-300 font-bold block mb-1">Nombre de la Serie *</label>
                      <input
                        type="text"
                        required
                        placeholder="Ej: Severance, Silo..."
                        value={formTitle}
                        onChange={(e) => setFormTitle(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-slate-300 font-bold block mb-1">Plataforma *</label>
                        <select
                          value={formPlatform}
                          onChange={(e) => setFormPlatform(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500"
                        >
                          <option value="Apple TV+">Apple TV+</option>
                          <option value="Max (HBO)">Max (HBO)</option>
                          <option value="Netflix">Netflix</option>
                          <option value="Prime Video">Prime Video</option>
                          <option value="Disney+ / Star+">Disney+ / Star+</option>
                          <option value="Paramount+">Paramount+</option>
                        </select>
                      </div>

                      <div>
                        <label className="text-slate-300 font-bold block mb-1">Tipo de Emisión *</label>
                        <select
                          value={formStatus}
                          onChange={(e) => setFormStatus(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500"
                        >
                          <option value="waiting_season">Esperando Temporada</option>
                          <option value="airing_weekly">Capítulo Semanal</option>
                        </select>
                      </div>
                    </div>

                    {formStatus === 'airing_weekly' ? (
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-slate-300 font-bold block mb-1">Día de Estreno</label>
                          <select
                            value={formAirDay}
                            onChange={(e) => setFormAirDay(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500"
                          >
                            <option value="Lunes">Lunes</option>
                            <option value="Martes">Martes</option>
                            <option value="Miércoles">Miércoles</option>
                            <option value="Jueves">Jueves</option>
                            <option value="Viernes">Viernes</option>
                            <option value="Sábados">Sábados</option>
                            <option value="Domingos">Domingos</option>
                          </select>
                        </div>
                        <div>
                          <label className="text-slate-300 font-bold block mb-1">Hora (COT)</label>
                          <input
                            type="text"
                            value={formAirTime}
                            onChange={(e) => setFormAirTime(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white"
                          />
                        </div>
                      </div>
                    ) : (
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-slate-300 font-bold block mb-1">Próx. Temporada</label>
                          <input
                            type="number"
                            min="1"
                            value={formNextSeason}
                            onChange={(e) => setFormNextSeason(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white"
                          />
                        </div>
                        <div>
                          <label className="text-slate-300 font-bold block mb-1">Fecha Estreno</label>
                          <input
                            type="date"
                            value={formNextDate}
                            onChange={(e) => setFormNextDate(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white"
                          />
                        </div>
                      </div>
                    )}

                    <div>
                      <label className="text-slate-300 font-bold block mb-1">URL Imagen Póster (Opcional)</label>
                      <input
                        type="url"
                        placeholder="https://..."
                        value={formPoster}
                        onChange={(e) => setFormPoster(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-white"
                      />
                    </div>

                    <div className="pt-2 flex gap-2">
                      <button
                        type="button"
                        onClick={() => setShowNewSeriesModal(false)}
                        className="w-1/2 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        className="w-1/2 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold shadow-lg shadow-indigo-600/30"
                      >
                        Guardar y Seguir
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-900 bg-slate-950/80 text-center py-4 text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-center gap-2">
            <span>CineRadar Pro &copy; {new Date().getFullYear()} — Tracker PWA de Series y Estrenos.</span>
            <button onClick={restoreDefaults} className="text-indigo-400 hover:underline">Restaurar valores iniciales</button>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
