    const playChime = () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880.00, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    };

      const [topRankingType, setTopRankingType] = useState('historic');

      // Filtros de Cine: Año (2026, 2027, 'all') y Mes
      const [movieYearFilter, setMovieYearFilter] = useState('all');
      const [movieMonthFilter, setMovieMonthFilter] = useState('all');
      const [movieSearchQuery, setMovieSearchQuery] = useState('');

      // Migración automática a v12 para purgar imágenes anteriores
      const [seriesList, setSeriesList] = useState(() => {
        try {
          const saved = localStorage.getItem('cineradar_series_v12');
          if (saved) return JSON.parse(saved);
          return INITIAL_TRACKED_CATALOG;
        } catch (e) {
          return INITIAL_TRACKED_CATALOG;
        }
      });

      // Rankings en estado local para permitir edición de póster o eliminación
      const [historicList, setHistoricList] = useState(() => {
        try {
          const saved = localStorage.getItem('cineradar_top_historic_v12');
          if (saved) return JSON.parse(saved);
          return TOP_25_HISTORIC;
        } catch (e) {
          return TOP_25_HISTORIC;
        }
      });

      const [yearList, setYearList] = useState(() => {
        try {
          const saved = localStorage.getItem('cineradar_top_year_v12');
          if (saved) return JSON.parse(saved);
          return TOP_10_YEAR;
        } catch (e) {
          return TOP_10_YEAR;
        }
      });

      const [moviesList, setMoviesList] = useState(() => {
        try {
          const saved = localStorage.getItem('cineradar_movies_v12');
          if (saved) return JSON.parse(saved);
          return MASTER_MOVIES_EXPANDED;
        } catch (e) {
          return MASTER_MOVIES_EXPANDED;
        }
      });

      const [selectedPlatform, setSelectedPlatform] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [notificationPermission, setNotificationPermission] = useState('default');
      const [showNewSeriesModal, setShowNewSeriesModal] = useState(false);
      const [bannerMessage, setBannerMessage] = useState(null);
      const [deferredInstallPrompt, setDeferredInstallPrompt] = useState(null);
      const [isSyncingLive, setIsSyncingLive] = useState(false);
      const [syncStatusText, setSyncStatusText] = useState('Fechas e imágenes oficiales verificadas');

      // Modal de Cambio de Póster
      const [editingItemForPoster, setEditingItemForPoster] = useState(null);
      const [posterSearchQuery, setPosterSearchQuery] = useState('');
      const [posterSearchResults, setPosterSearchResults] = useState([]);
      const [isSearchingPosters, setIsSearchingPosters] = useState(false);
      const [customPosterUrlInput, setCustomPosterUrlInput] = useState('');

      // Modal de Búsqueda
      const [apiSearchQuery, setApiSearchQuery] = useState('');
      const [apiSearchResults, setApiSearchResults] = useState([]);
      const [isSearchingApi, setIsSearchingApi] = useState(false);

      useEffect(() => {
        try {
          localStorage.setItem('cineradar_series_v12', JSON.stringify(seriesList));
        } catch (e) {}
      }, [seriesList]);

      useEffect(() => {
        try {
          localStorage.setItem('cineradar_top_historic_v12', JSON.stringify(historicList));
        } catch (e) {}
      }, [historicList]);

      useEffect(() => {
        try {
          localStorage.setItem('cineradar_top_year_v12', JSON.stringify(yearList));
        } catch (e) {}
      }, [yearList]);

      useEffect(() => {
        try {
          localStorage.setItem('cineradar_movies_v12', JSON.stringify(moviesList));
        } catch (e) {}
      }, [moviesList]);

      useEffect(() => {
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          setDeferredInstallPrompt(e);
        });

        if ('Notification' in window) {
          setNotificationPermission(Notification.permission);
        }

        syncLiveDatesFromApis();
      }, []);

      const showBanner = (msg) => {
        setBannerMessage(msg);
        playChime();
        setTimeout(() => setBannerMessage(null), 4500);
      };

      // MOTOR DE SINCRONIZACIÓN EN VIVO
      const syncLiveDatesFromApis = async () => {
        setIsSyncingLive(true);
        setSyncStatusText('Consultando fichas e imágenes oficiales en vivo...');
        
        try {
          let updatedCount = 0;
          const updatedSeries = await Promise.all(
            seriesList.map(async (series) => {
              if (!series.title) return series;
              try {
                const searchEndpoint = series.tvmazeId 
                  ? `https://api.tvmaze.com/shows/${series.tvmazeId}?embed[]=nextepisode&embed[]=previousepisode`
                  : `https://api.tvmaze.com/singlesearch/shows?q=${encodeURIComponent(series.title)}&embed[]=nextepisode&embed[]=previousepisode`;
                
                const res = await fetch(searchEndpoint);
                if (!res.ok) return series;
                const data = await res.json();

                const nextEp = data._embedded && data._embedded.nextepisode;
                const prevEp = data._embedded && data._embedded.previousepisode;
                const officialPoster = data.image ? (data.image.original || data.image.medium) : series.poster;

                if (nextEp && isDateInFuture(nextEp.airdate)) {
                  updatedCount++;
                  const daysDiff = (new Date(nextEp.airdate) - new Date()) / (1000 * 60 * 60 * 24);
                  const isWeekly = daysDiff <= 7;
                  
                  return {
                    ...series,
                    poster: officialPoster,
                    status: isWeekly ? 'airing_weekly' : 'waiting_season',
                    hasConfirmedFutureDate: true,
                    nextReleaseDate: nextEp.airdate,
                    currentSeason: nextEp.season,
                    nextSeasonNumber: nextEp.season,
                    currentEpisode: nextEp.number,
                    airDay: data.schedule && data.schedule.days && data.schedule.days[0] ? data.schedule.days[0] : series.airDay,
                    airTime: data.schedule && data.schedule.time ? `${data.schedule.time} COT` : series.airTime,
                    releaseSchedule: isWeekly 
                      ? `Nuevo episodio T${nextEp.season}E${nextEp.number} programado para el ${nextEp.airdate} (${series.airDay || 'Semanal'}).`
                      : `Próxima Temporada ${nextEp.season} confirmada oficialmente para el ${nextEp.airdate}.`
                  };
                }

                if (prevEp) {
                  const lastSeasonNum = prevEp.season || series.currentSeason;
                  if (!isDateInFuture(series.nextReleaseDate)) {
                    return {
                      ...series,
                      poster: officialPoster,
                      status: 'waiting_season',
                      hasConfirmedFutureDate: false,
                      nextReleaseDate: null,
                      currentSeason: lastSeasonNum,
                      nextSeasonNumber: Math.max(series.nextSeasonNumber || (lastSeasonNum + 1), lastSeasonNum + 1),
                      releaseSchedule: `Temporada ${lastSeasonNum} concluida. Próxima entrega en producción; fecha oficial por anunciar.`
                    };
                  }
                }

                return { ...series, poster: officialPoster };
              } catch (err) {
                return series;
              }
            })
          );

          setSeriesList(updatedSeries);
          setSyncStatusText('✅ Fechas e imágenes oficiales sincronizadas');
          if (updatedCount > 0) {
            showBanner(`✨ ¡${updatedCount} series actualizadas con nuevas fechas oficiales!`);
          }
        } catch (e) {
          setSyncStatusText('Sincronizado');
        } finally {
          setIsSyncingLive(false);
        }
      };

      const restoreDefaults = () => {
        setSeriesList(INITIAL_TRACKED_CATALOG);
        setHistoricList(TOP_25_HISTORIC);
        setYearList(TOP_10_YEAR);
        setMoviesList(MASTER_MOVIES_EXPANDED);
        localStorage.setItem('cineradar_series_v12', JSON.stringify(INITIAL_TRACKED_CATALOG));
        localStorage.setItem('cineradar_top_historic_v12', JSON.stringify(TOP_25_HISTORIC));
        localStorage.setItem('cineradar_top_year_v12', JSON.stringify(TOP_10_YEAR));
        localStorage.setItem('cineradar_movies_v12', JSON.stringify(MASTER_MOVIES_EXPANDED));
        showBanner('🔄 ¡Catálogo completo 2026/2027 y pósters restaurados!');
      };

      const handleImportFromApi = async (item) => {
        const show = item.show;
        if (!show) return;

        let futureDate = null;
        let hasFuture = false;
        let currentSn = 1;
        let nextSn = 2;
        let isWeekly = false;

        try {
          const detailRes = await fetch(`https://api.tvmaze.com/shows/${show.id}?embed[]=nextepisode&embed[]=previousepisode`);
          if (detailRes.ok) {
            const detailData = await detailRes.json();
            const nextEp = detailData._embedded && detailData._embedded.nextepisode;
            const prevEp = detailData._embedded && detailData._embedded.previousepisode;

            if (nextEp && isDateInFuture(nextEp.airdate)) {
              futureDate = nextEp.airdate;
              hasFuture = true;
              currentSn = nextEp.season;
              nextSn = nextEp.season;
              const daysDiff = (new Date(nextEp.airdate) - new Date()) / (1000 * 60 * 60 * 24);
              isWeekly = daysDiff <= 7;
            } else if (prevEp) {
              currentSn = prevEp.season || 1;
              nextSn = currentSn + 1;
              hasFuture = false;
              futureDate = null;
            }
          }
        } catch (e) {}

        const platformName = show.webChannel ? show.webChannel.name : (show.network ? show.network.name : 'Streaming');
        const ratingVal = show.rating && show.rating.average ? show.rating.average : 8.2;
        const imdbCode = show.externals && show.externals.imdb ? show.externals.imdb : null;
        const posterUrl = show.image ? (show.image.original || show.image.medium) : DEFAULT_FALLBACK_POSTER;

        const newSeries = {
          id: 'tvmaze-' + show.id + '-' + Date.now(),
          tvmazeId: show.id,
          title: show.name,
          imdbId: imdbCode,
          imdbRating: ratingVal,
          platform: platformName,
          genres: show.genres && show.genres.length > 0 ? show.genres : ['Drama'],
          status: isWeekly ? 'airing_weekly' : 'waiting_season',
          currentSeason: currentSn,
          nextSeasonNumber: nextSn,
          nextReleaseDate: futureDate,
          hasConfirmedFutureDate: hasFuture,
          releaseSchedule: hasFuture 
            ? `Próximo estreno oficial confirmado para el ${futureDate}.`
            : `Temporada ${currentSn} concluida. En desarrollo; sin fecha oficial confirmada.`,
          airDay: show.schedule && show.schedule.days && show.schedule.days[0] ? show.schedule.days[0] : 'Viernes',
          airTime: show.schedule && show.schedule.time ? `${show.schedule.time} COT` : '02:00 AM COT',
          poster: posterUrl,
          userTracking: true,
          userProgressSeason: currentSn,
          userProgressEpisode: 1,
          notes: `Importado con póster oficial y ficha IMDb ${imdbCode || 'N/A'}.`
        };

        setSeriesList(prev => [newSeries, ...prev]);
        setShowNewSeriesModal(false);
        setApiSearchQuery('');
        setApiSearchResults([]);
        showBanner(`🎉 ¡"${show.name}" añadida con carátula oficial!`);
      };

      // MOTOR DE CAMBIO DE PÓSTER EN VIVO
      const openPosterModal = (item, type = 'series') => {
        setEditingItemForPoster({ ...item, itemType: type });
        setPosterSearchQuery(item.title);
        setCustomPosterUrlInput(item.poster || '');
        searchPostersForQuery(item.title);
      };

      const searchPostersForQuery = async (q) => {
        if (!q || q.trim().length < 2) return;
        setIsSearchingPosters(true);
        try {
          const res = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q.trim())}`);
          const data = await res.json();
          setPosterSearchResults(data || []);
        } catch (e) {
          setPosterSearchResults([]);
        } finally {
          setIsSearchingPosters(false);
        }
      };

      const applyNewPoster = (newPosterUrl) => {
        if (!editingItemForPoster || !newPosterUrl) return;
        const targetTitle = editingItemForPoster.title;

        // Actualizar en Mis Series si existe
        setSeriesList(prev => prev.map(s => s.title === targetTitle ? { ...s, poster: newPosterUrl } : s));

        // Actualizar en Top 25
        setHistoricList(prev => prev.map(s => s.title === targetTitle ? { ...s, poster: newPosterUrl } : s));

        // Actualizar en Top 10
        setYearList(prev => prev.map(s => s.title === targetTitle ? { ...s, poster: newPosterUrl } : s));

        // Actualizar en Películas
        setMoviesList(prev => prev.map(m => m.title === targetTitle ? { ...m, poster: newPosterUrl } : m));

        showBanner(`🖼️ ¡Póster de "${targetTitle}" actualizado con éxito!`);
        setEditingItemForPoster(null);
      };

      const deleteFromTopRanking = (title, rankingType) => {
        if (rankingType === 'historic') {
          setHistoricList(prev => prev.filter(s => s.title !== title));
        } else {
          setYearList(prev => prev.filter(s => s.title !== title));
        }
        showBanner(`🗑️ "${title}" eliminada de la lista de recomendadas.`);
      };

      const handleInstallApp = async () => {
        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          const { outcome } = await deferredInstallPrompt.userChoice;
          if (outcome === 'accepted') {
            showBanner('🎉 ¡CineRadar Pro instalado con éxito!');
          }
          setDeferredInstallPrompt(null);
        } else {
          showBanner('📱 En Android: Abre el menú de Chrome (⋮) y presiona "Instalar aplicación".');
        }
      };

      const handleRequestNotifications = async () => {
        if (!('Notification' in window)) {
          showBanner('⚠️ Notificaciones web no soportadas en este navegador.');
          return;
        }
        try {
          const perm = await Notification.requestPermission();
          setNotificationPermission(perm);
          if (perm === 'granted') {
            showBanner('🔔 ¡Notificaciones activadas con éxito!');
          }
        } catch (e) {}
      };

      const toggleSeriesStatus = (id) => {
        setSeriesList(prev => prev.map(s => {
          if (s.id === id) {
            const nextStatus = s.status === 'airing_weekly' ? 'waiting_season' : 'airing_weekly';
            showBanner(`🔄 "${s.title}" cambiada a: ${nextStatus === 'airing_weekly' ? '⚡ En Emisión' : '⏳ Esperando Temporada'}`);
            return {
              ...s,
              status: nextStatus,
              releaseSchedule: nextStatus === 'airing_weekly'
                ? `Nuevo episodio cada ${s.airDay || 'Viernes'} a las ${s.airTime || '02:00 AM COT'} por ${s.platform}.`
                : `Temporada concluida. Próxima Temporada ${s.nextSeasonNumber || (s.currentSeason + 1)} en espera.`
            };
          }
          return s;
        }));
      };

      const deleteSeriesCompletely = (id, title) => {
        setSeriesList(prev => prev.filter(s => s.id !== id));
        showBanner(`🗑️ "${title}" eliminada de tus listas.`);
      };

      const deleteMovieCompletely = (id, title) => {
        setMoviesList(prev => prev.filter(m => m.id !== id));
        showBanner(`🗑️ "${title}" descartada de cartelera.`);
      };

      const toggleTracking = (id) => {
        setSeriesList(prev => prev.map(s => {
          if (s.id === id) {
            const nextVal = !s.userTracking;
            showBanner(nextVal ? `✓ Siguiendo: ${s.title}` : `Ocultada: ${s.title}`);
            return { ...s, userTracking: nextVal };
          }
          return s;
        }));
      };

      const changeEpisode = (id, delta) => {
        setSeriesList(prev => prev.map(s => {
          if (s.id === id) {
            const current = s.userProgressEpisode || 1;
            const nextEp = Math.max(1, current + delta);
            showBanner(`📺 ${s.title}: Capítulo ${nextEp}`);
            return { ...s, userProgressEpisode: nextEp };
          }
          return s;
        }));
      };

      const changeSeason = (id, delta) => {
        setSeriesList(prev => prev.map(s => {
          if (s.id === id) {
            const current = s.userProgressSeason || 1;
            const nextSn = Math.max(1, current + delta);
            showBanner(`🎬 ${s.title}: Temporada ${nextSn}`);
            return { ...s, userProgressSeason: nextSn, userProgressEpisode: 1 };
          }
          return s;
        }));
      };

      const changeNextSeasonNumber = (id, delta) => {
        setSeriesList(prev => prev.map(s => {
          if (s.id === id) {
            const currentNext = s.nextSeasonNumber || (s.currentSeason + 1);
            const updatedNext = Math.max(1, currentNext + delta);
            showBanner(`🎯 ${s.title}: Esperando Temporada ${updatedNext}`);
            return {
              ...s,
              nextSeasonNumber: updatedNext,
              currentSeason: Math.max(1, updatedNext - 1)
            };
          }
          return s;
        }));
      };

      // Agregar desde los rankings Top 25 o Top 10 a "Mis Series"
      const addFromRankingsToTracking = (item) => {
        const existing = seriesList.find(s => s.title.toLowerCase() === item.title.toLowerCase() || (item.imdbId && s.imdbId === item.imdbId));
        if (existing) {
          if (!existing.userTracking) {
            setSeriesList(prev => prev.map(s => s.id === existing.id ? { ...s, userTracking: true } : s));
            showBanner(`✓ "${item.title}" reincorporada a Mis Series`);
          } else {
            showBanner(`ℹ️ "${item.title}" ya está en tu lista de seguimiento.`);
          }
          return;
        }

        const newSeries = {
          id: 'rank-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
          title: item.title,
          imdbId: item.imdbId,
          imdbRating: item.imdbRating,
          platform: item.platform,
          genres: item.genres,
          status: 'waiting_season',
          currentSeason: 1,
          nextSeasonNumber: 2,
          nextReleaseDate: null,
          hasConfirmedFutureDate: false,
          releaseSchedule: `${item.summary} (Calificación IMDb ★ ${item.imdbRating})`,
          airDay: 'Viernes',
          airTime: '02:00 AM COT',
          poster: item.poster,
          userTracking: true,
          userProgressSeason: 1,
          userProgressEpisode: 1,
          notes: `Añadida desde los rankings oficiales de IMDb.`
        };

        setSeriesList(prev => [newSeries, ...prev]);
        showBanner(`🎉 ¡"${item.title}" añadida a Mis Series!`);
      };

      // Búsqueda en Vivo con TVMaze
      const handleSearchMultiSource = async (query) => {
        setApiSearchQuery(query);
        if (!query || query.trim().length < 2) {
          setApiSearchResults([]);
          return;
        }

        setIsSearchingApi(true);
        try {
          const res = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(query.trim())}`);
          const data = await res.json();
          setApiSearchResults(data || []);
        } catch (err) {
          console.error(err);
        } finally {
          setIsSearchingApi(false);
        }
      };

      // MIS SERIES: Siempre ordenadas con las que están EN EMISIÓN SEMANAL al principio
      const myTrackedSeries = useMemo(() => {
        return seriesList
          .filter(s => s.userTracking)
          .sort((a, b) => {
            if (a.status === 'airing_weekly' && b.status !== 'airing_weekly') return -1;
            if (a.status !== 'airing_weekly' && b.status === 'airing_weekly') return 1;
            return 0;
          });
      }, [seriesList]);

      const weeklyAiringSeries = useMemo(() => seriesList.filter(s => s.status === 'airing_weekly'), [seriesList]);
      const waitingSeasonsList = useMemo(() => seriesList.filter(s => s.status === 'waiting_season'), [seriesList]);

      // Filtrado del Top 25 Histórico y Top 10 del Año
      const currentRankingSource = topRankingType === 'historic' ? historicList : yearList;
      const filteredRankings = useMemo(() => {
        return currentRankingSource.filter(item => {
          const matchP = selectedPlatform === 'all' || item.platform.toLowerCase().includes(selectedPlatform.toLowerCase());
          const matchQ = item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                         (item.genres && item.genres.some(g => g.toLowerCase().includes(searchQuery.toLowerCase())));
          return matchP && matchQ;
        });
      }, [currentRankingSource, selectedPlatform, searchQuery]);

      // Filtrado del Catálogo de Películas (Año, Mes, Buscador)
      const filteredMovies = useMemo(() => {
        return moviesList.filter(movie => {
          const matchYear = movieYearFilter === 'all' || movie.year === parseInt(movieYearFilter);
          const matchMonth = movieMonthFilter === 'all' || movie.month === parseInt(movieMonthFilter);
          const matchSearch = movieSearchQuery.trim() === '' || 
                              movie.title.toLowerCase().includes(movieSearchQuery.toLowerCase()) ||
                              movie.genre.toLowerCase().includes(movieSearchQuery.toLowerCase()) ||
                              movie.director.toLowerCase().includes(movieSearchQuery.toLowerCase()) ||
                              movie.cast.toLowerCase().includes(movieSearchQuery.toLowerCase());
          return matchYear && matchMonth && matchSearch;
        }).sort((a, b) => new Date(a.releaseDate) - new Date(b.releaseDate));
      }, [moviesList, movieYearFilter, movieMonthFilter, movieSearchQuery]);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans selection:bg-indigo-500 selection:text-white pb-24 sm:pb-10">
          
          {/* Header Superior */}
          <header className="sticky top-0 z-40 glass-panel border-b border-slate-800/80 px-4 sm:px-8 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center text-xl shadow-lg shadow-indigo-600/30">
                🎬
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="font-display font-black text-lg tracking-tight text-white">CineRadar</h1>
                  <span className="text-[10px] font-mono font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-full">IMDb • 2026/2027</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-[11px] text-slate-400">{syncStatusText}</span>
                  {isSyncingLive && <span className="w-2 h-2 rounded-full bg-indigo-400 animate-ping"></span>}
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={syncLiveDatesFromApis}
                disabled={isSyncingLive}
                className="hidden md:flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-cyan-300 border border-cyan-500/40 px-3 py-1.5 rounded-xl text-xs font-bold transition-all"
                title="Comprobar si los estudios anunciaron nuevas fechas"
              >
                🔄 <span>{isSyncingLive ? 'Comprobando...' : 'Sincronizar Fechas'}</span>
              </button>

              <button
                onClick={handleInstallApp}
                className="hidden sm:flex items-center gap-1.5 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-3 py-1.5 rounded-xl text-xs font-bold transition-all"
              >
                📲 <span>Instalar App</span>
              </button>

              <button
                onClick={handleRequestNotifications}
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all border ${
                  notificationPermission === 'granted'
                    ? 'bg-amber-500/20 text-amber-300 border-amber-500/50'
                    : 'bg-slate-900 hover:bg-slate-800 text-slate-300 border-slate-700'
                }`}
              >
                🔔 <span className="hidden sm:inline">{notificationPermission === 'granted' ? 'Alertas Activas' : 'Activar Alertas'}</span>
              </button>

              <button
                onClick={() => setShowNewSeriesModal(true)}
                className="flex items-center gap-1.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all shadow-lg shadow-indigo-600/30"
              >
                🔍 <span>Buscar Serie</span>
              </button>
            </div>
          </header>

          {/* Banner Toast Flotante */}
          {bannerMessage && (
            <div className="fixed top-16 left-1/2 transform -translate-x-1/2 z-50 bg-gradient-to-r from-indigo-600 to-purple-600 text-white text-xs font-bold px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-2 border border-indigo-400 animate-bounce">
              <span>✨</span>
              <span>{bannerMessage}</span>
            </div>
          )}

          {/* BARRA DE NAVEGACIÓN EN ORDEN EXACTO */}

                      )}
                    </div>
                  </div>

                  <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                    {apiSearchResults.length > 0 ? (
                      apiSearchResults.map(({ show }) => {
                        const poster = show.image ? (show.image.medium || show.image.original) : DEFAULT_FALLBACK_POSTER;
                        const platform = show.webChannel ? show.webChannel.name : (show.network ? show.network.name : 'Streaming');
                        const rating = show.rating && show.rating.average ? show.rating.average : '8.0';

                        return (
                          <div
                            key={show.id}
                            className="flex items-center justify-between p-2.5 bg-slate-950/80 hover:bg-slate-800/80 border border-slate-800 rounded-2xl transition-all gap-3"
                          >
                            <img
                              src={poster}
                              alt={show.name}
                              className="w-12 h-16 object-cover rounded-xl shrink-0 border border-slate-700"
                              onError={(e) => { e.target.src = DEFAULT_FALLBACK_POSTER; }}
                            />
                            <div className="flex-1 min-w-0">
                              <h4 className="font-display font-bold text-white text-xs truncate">{show.name}</h4>
                              <div className="flex items-center gap-1.5 text-[10px] text-slate-400 pt-0.5">
                                <span className="text-indigo-400 font-bold">{platform}</span>
                                <span>•</span>
                                <span className="text-amber-400 font-mono">★ {rating}</span>
                              </div>
                            </div>
                            <button
                              onClick={() => handleImportFromApi({ show })}
                              className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-[11px] px-3 py-1.5 rounded-xl shrink-0 transition-all shadow-md"
                            >
                              ➕ Seguir
                            </button>
                          </div>
                        );
                      })
                    ) : apiSearchQuery.trim().length >= 2 ? (
                      <div className="text-center py-6 text-slate-500 text-xs">
                        No se encontraron resultados para "{apiSearchQuery}".
                      </div>
                    ) : (
                      <div className="text-center py-6 text-slate-500 text-xs">
                        Escribe el título de cualquier serie para buscar en vivo.
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-900 bg-slate-950/80 text-center py-4 text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-center gap-2">
            <span>CineRadar Pro &copy; 2026/2027 — Rankings Oficiales IMDb & Calendario de Estrenos de Cine.</span>
            <button onClick={restoreDefaults} className="text-indigo-400 hover:underline">Restaurar catálogo inicial</button>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
