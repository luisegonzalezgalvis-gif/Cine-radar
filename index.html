  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'cineradar-pro';
    
    // Cloud state bridge accessible to React
    window.CineRadarCloud = {
      isReady: false,
      userId: null,
      auth: null,
      db: null,
      saveCatalog: null,
      subscribe: null
    };

    try {
      if (typeof __firebase_config !== 'undefined') {
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        window.CineRadarCloud.auth = auth;
        window.CineRadarCloud.db = db;

        const authPromise = typeof __initial_auth_token !== 'undefined' && __initial_auth_token
          ? signInWithCustomToken(auth, __initial_auth_token)
          : signInAnonymously(auth);

        authPromise.then(async (userCredential) => {
          const user = userCredential.user;
          const uid = user ? user.uid : 'default-user';
          window.CineRadarCloud.userId = uid;
          window.CineRadarCloud.isReady = true;

          // Save method with valid 4-segment document reference (artifacts/{appId}/public/data)
          window.CineRadarCloud.saveCatalog = async (data) => {
            if (!auth.currentUser) return;
            try {
              const docRef = doc(db, 'artifacts', appId, 'public', 'data');
              await setDoc(docRef, {
                series: JSON.stringify(data.series || []),
                historic: JSON.stringify(data.historic || []),
                year: JSON.stringify(data.year || []),
                movies: JSON.stringify(data.movies || []),
                updatedAt: new Date().toISOString(),
                updatedBy: uid
              }, { merge: true });
            } catch (err) {
              console.warn("Cloud save notice:", err);
            }
          };

          // Subscribe method with valid 4-segment document reference (artifacts/{appId}/public/data)
          window.CineRadarCloud.subscribe = (callback) => {
            if (!auth.currentUser) return () => {};
            try {
              const docRef = doc(db, 'artifacts', appId, 'public', 'data');
              return onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                  const cloudData = snapshot.data();
                  callback({
                    series: cloudData.series ? JSON.parse(cloudData.series) : null,
                    historic: cloudData.historic ? JSON.parse(cloudData.historic) : null,
                    year: cloudData.year ? JSON.parse(cloudData.year) : null,
                    movies: cloudData.movies ? JSON.parse(cloudData.movies) : null,
                    updatedAt: cloudData.updatedAt
                  });
                }
              }, (error) => {
                console.warn("Cloud sync snapshot notice:", error);
              });
            } catch (err) {
              console.warn("Cloud subscribe notice:", err);
              return () => {};
            }
          };

          window.dispatchEvent(new CustomEvent('cineradar-cloud-ready', { detail: { uid } }));
        }).catch(err => {
          console.warn("Cloud auth notice:", err);
        });
      }
    } catch (e) {
      console.warn("Cloud init notice:", e);
    }
  </script>

    const playChime = () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880.00, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    };

      const syncLiveDatesFromApis = async () => {
        setIsSyncingLive(true);
        setSyncStatusText('Consultando fichas e imágenes en vivo...');
        
        try {
          let updatedCount = 0;
          const updatedSeries = await Promise.all(
            seriesList.map(async (series) => {
              if (!series.title) return series;
              try {
                const searchEndpoint = series.tvmazeId 
                  ? `https://api.tvmaze.com/shows/${series.tvmazeId}?embed[]=nextepisode&embed[]=previousepisode`
                  : `https://api.tvmaze.com/singlesearch/shows?q=${encodeURIComponent(series.title)}&embed[]=nextepisode&embed[]=previousepisode`;
                
                const res = await fetch(searchEndpoint);
                if (!res.ok) return series;
                const data = await res.json();

                const nextEp = data._embedded && data._embedded.nextepisode;
                const prevEp = data._embedded && data._embedded.previousepisode;
                const officialPoster = data.image ? (data.image.original || data.image.medium) : series.poster;

                if (nextEp && isDateInFuture(nextEp.airdate)) {
                  updatedCount++;
                  const daysDiff = (new Date(nextEp.airdate) - new Date()) / (1000 * 60 * 60 * 24);
                  const isWeekly = daysDiff <= 7;
                  
                  return {
                    ...series,
                    poster: officialPoster,
                    status: isWeekly ? 'airing_weekly' : 'waiting_season',
                    hasConfirmedFutureDate: true,
                    nextReleaseDate: nextEp.airdate,
                    currentSeason: nextEp.season,
                    nextSeasonNumber: nextEp.season,
                    currentEpisode: nextEp.number,
                    airDay: data.schedule && data.schedule.days && data.schedule.days[0] ? data.schedule.days[0] : series.airDay,
                    airTime: data.schedule && data.schedule.time ? `${data.schedule.time} COT` : series.airTime,

                      : `Próxima Temporada ${nextEp.season} confirmada oficialmente para el ${nextEp.airdate}.`
                  };
                }

                if (prevEp) {
                  const lastSeasonNum = prevEp.season || series.currentSeason;
                  if (!isDateInFuture(series.nextReleaseDate)) {
                    return {
                      ...series,
                      poster: officialPoster,
                      status: 'waiting_season',
                      hasConfirmedFutureDate: false,
                      nextReleaseDate: null,
                      currentSeason: lastSeasonNum,
                      nextSeasonNumber: Math.max(series.nextSeasonNumber || (lastSeasonNum + 1), lastSeasonNum + 1),
                      releaseSchedule: `Temporada ${lastSeasonNum} concluida. Próxima entrega en producción; fecha oficial por anunciar.`
                    };
                  }
                }

                return { ...series, poster: officialPoster };
              } catch (err) {
                return series;
              }
            })
          );

          setSeriesList(updatedSeries);
          setSyncStatusText('✅ Fechas e imágenes oficiales sincronizadas');

            const nextEp = detailData._embedded && detailData._embedded.nextepisode;
            const prevEp = detailData._embedded && detailData._embedded.previousepisode;

            if (nextEp && isDateInFuture(nextEp.airdate)) {
              futureDate = nextEp.airdate;
              hasFuture = true;
              currentSn = nextEp.season;
              nextSn = nextEp.season;
              const daysDiff = (new Date(nextEp.airdate) - new Date()) / (1000 * 60 * 60 * 24);
              isWeekly = daysDiff <= 7;
            } else if (prevEp) {
              currentSn = prevEp.season || 1;
              nextSn = currentSn + 1;
              hasFuture = false;
              futureDate = null;
            }
          }
        } catch (e) {}

        const platformName = show.webChannel ? show.webChannel.name : (show.network ? show.network.name : 'Streaming');
        const ratingVal = show.rating && show.rating.average ? show.rating.average : 8.2;
        const imdbCode = show.externals && show.externals.imdb ? show.externals.imdb : null;
        const posterUrl = show.image ? (show.image.original || show.image.medium) : DEFAULT_FALLBACK_POSTER;

        const newSeries = {
          id: 'tvmaze-' + show.id + '-' + Date.now(),
          tvmazeId: show.id,
          title: show.name,
          imdbId: imdbCode,
          imdbRating: ratingVal,
          platform: platformName,
          genres: show.genres && show.genres.length > 0 ? show.genres : ['Drama'],
          status: isWeekly ? 'airing_weekly' : 'waiting_season',
          currentSeason: currentSn,
          nextSeasonNumber: nextSn,
          nextReleaseDate: futureDate,
          hasConfirmedFutureDate: hasFuture,
          releaseSchedule: hasFuture 
            ? `Próximo estreno oficial confirmado para el ${futureDate}.`
            : `Temporada ${currentSn} concluida. En desarrollo; sin fecha oficial confirmada.`,
          airDay: show.schedule && show.schedule.days && show.schedule.days[0] ? show.schedule.days[0] : 'Viernes',
          airTime: show.schedule && show.schedule.time ? `${show.schedule.time} COT` : '02:00 AM COT',
          poster: posterUrl,
          userTracking: true,
          userProgressSeason: currentSn,
          userProgressEpisode: 1,
          notes: `Importado con póster oficial y ficha IMDb ${imdbCode || 'N/A'}.`
        };

        setSeriesList(prev => [newSeries, ...prev]);
        setShowNewSeriesModal(false);
        setApiSearchQuery('');
        setApiSearchResults([]);
        showBanner(`🎉 ¡"${show.name}" añadida con carátula oficial!`);
      };

      const handleImportToTopRanking = async (item, targetType = 'historic') => {
        const show = item.show;
        if (!show) return;

        const platformName = show.webChannel ? show.webChannel.name : (show.network ? show.network.name : 'Streaming');
        const ratingVal = show.rating && show.rating.average ? show.rating.average : 8.5;
        const imdbCode = show.externals && show.externals.imdb ? show.externals.imdb : null;
        const posterUrl = show.image ? (show.image.original || show.image.medium) : DEFAULT_FALLBACK_POSTER;
        const premiereYear = show.premiered ? show.premiered.slice(0, 4) : '2024';
        const endedYear = show.ended ? show.ended.slice(0, 4) : 'Presente';
        const yearDisplay = show.ended ? `${premiereYear}-${endedYear}` : `${premiereYear}-Presente`;

        const strippedSummary = show.summary 
          ? show.summary.replace(/<[^>]*>?/gm, '').slice(0, 160) + '...'
          : 'Aclamada serie de televisión con gran recepción de la crítica y audiencia.';

        if (targetType === 'historic') {
          const newRank = historicList.length + 1;
          const newTopItem = {
            id: 'top-custom-' + Date.now(),
            rank: newRank,
            title: show.name,
            imdbRating: ratingVal,
            votes: 'Popular',
            platform: platformName,
            year: yearDisplay,
            genres: show.genres && show.genres.length > 0 ? show.genres : ['Drama'],
            imdbId: imdbCode,
            poster: posterUrl,
            summary: strippedSummary
          };
          setHistoricList(prev => [...prev, newTopItem]);
          showBanner(`🏆 ¡"${show.name}" agregada al Top 25 Histórico!`);
        } else {
          const newRank = yearList.length + 1;
          const newYearItem = {
            id: 'yr-custom-' + Date.now(),
            rank: newRank,
            title: show.name,
            imdbRating: ratingVal,
            votes: '2024-2026',
            platform: platformName,
            year: yearDisplay,
            genres: show.genres && show.genres.length > 0 ? show.genres : ['Drama'],
            imdbId: imdbCode,
            poster: posterUrl,
            summary: strippedSummary
          };
          setYearList(prev => [...prev, newYearItem]);
          showBanner(`🔥 ¡"${show.name}" agregada al Top 10 del Año!`);
        }

        setShowNewSeriesModal(false);
        setApiSearchQuery('');
        setApiSearchResults([]);
      };

      const openPosterModal = (item, type = 'series') => {
        setEditingItemForPoster({ ...item, itemType: type });
        setPosterSearchQuery(item.title);
        setCustomPosterUrlInput(item.poster || '');
        searchPostersForQuery(item.title);
      };

      const searchPostersForQuery = async (q) => {
        if (!q || q.trim().length < 2) return;
        setIsSearchingPosters(true);
        try {
          const res = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q.trim())}`);
          const data = await res.json();
          setPosterSearchResults(data || []);
        } catch (e) {
          setPosterSearchResults([]);
        } finally {
          setIsSearchingPosters(false);
        }
      };

      const applyNewPoster = (newPosterUrl) => {
        if (!editingItemForPoster || !newPosterUrl) return;
        const targetTitle = editingItemForPoster.title;

        setSeriesList(prev => prev.map(s => s.title === targetTitle ? { ...s, poster: newPosterUrl } : s));
        setHistoricList(prev => prev.map(s => s.title === targetTitle ? { ...s, poster: newPosterUrl } : s));
        setYearList(prev => prev.map(s => s.title === targetTitle ? { ...s, poster: newPosterUrl } : s));
        setMoviesList(prev => prev.map(m => m.title === targetTitle ? { ...m, poster: newPosterUrl } : m));

        showBanner(`🖼️ ¡Póster de "${targetTitle}" actualizado con éxito!`);
        setEditingItemForPoster(null);
      };

      const deleteFromTopRanking = (title, rankingType) => {
        if (rankingType === 'historic') {
          setHistoricList(prev => prev.filter(s => s.title !== title));
        } else {
          setYearList(prev => prev.filter(s => s.title !== title));
        }
        showBanner(`🗑️ "${title}" eliminada de la lista de recomendadas.`);
      };

      const handleInstallApp = async () => {
        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          const { outcome } = await deferredInstallPrompt.userChoice;
          if (outcome === 'accepted') {
            showBanner('🎉 ¡CineRadar Pro instalado con éxito!');
          }
          setDeferredInstallPrompt(null);
        } else {
          showBanner('📱 En Android: Menú de Chrome (⋮) > "Instalar aplicación".');
        }
      };

      const handleRequestNotifications = async () => {
        if (!('Notification' in window)) {
          showBanner('⚠️ Notificaciones web no soportadas en este navegador.');
          return;
        }
        try {
          const perm = await Notification.requestPermission();
          setNotificationPermission(perm);
          if (perm === 'granted') {
            showBanner('🔔 ¡Notificaciones activadas para todas tus series!');
          }
        } catch (e) {}
      };

      const toggleSeriesStatus = (id) => {
        setSeriesList(prev => prev.map(s => {
          if (s.id === id) {
            const nextStatus = s.status === 'airing_weekly' ? 'waiting_season' : 'airing_weekly';
            showBanner(`🔄 "${s.title}": ${nextStatus === 'airing_weekly' ? '⚡ En Emisión' : '⏳ Esperando Temporada'}`);
            return {
              ...s,
              status: nextStatus,
              releaseSchedule: nextStatus === 'airing_weekly'
                ? `Nuevo episodio cada ${s.airDay || 'Viernes'} a las ${s.airTime || '02:00 AM COT'} por ${s.platform}.`
                : `Temporada concluida. Próxima Temporada ${s.nextSeasonNumber || (s.currentSeason + 1)} en espera.`
            };
          }
          return s;
        }));
      };

      const deleteSeriesCompletely = (id, title) => {
        setSeriesList(prev => prev.filter(s => s.id !== id));
        showBanner(`🗑️ "${title}" eliminada de tus listas.`);
      };

      const deleteMovieCompletely = (id, title) => {
        setMoviesList(prev => prev.filter(m => m.id !== id));
        showBanner(`🗑️ "${title}" descartada de cartelera.`);
      };

      const toggleTracking = (id) => {
        setSeriesList(prev => prev.map(s => {
          if (s.id === id) {
            const nextVal = !s.userTracking;
            showBanner(nextVal ? `✓ Siguiendo: ${s.title}` : `Ocultada: ${s.title}`);
            return { ...s, userTracking: nextVal };
          }
          return s;
        }));
      };

      const changeEpisode = (id, delta) => {
        setSeriesList(prev => prev.map(s => {
          if (s.id === id) {
            const current = s.userProgressEpisode || 1;
            const nextEp = Math.max(1, current + delta);
            showBanner(`📺 ${s.title}: Capítulo ${nextEp}`);
            return { ...s, userProgressEpisode: nextEp };
          }
          return s;
        }));
      };

      const changeSeason = (id, delta) => {
        setSeriesList(prev => prev.map(s => {
          if (s.id === id) {
            const current = s.userProgressSeason || 1;
            const nextSn = Math.max(1, current + delta);
            showBanner(`🎬 ${s.title}: Temporada ${nextSn}`);
            return { ...s, userProgressSeason: nextSn, userProgressEpisode: 1 };
          }
          return s;
        }));
      };

      const changeNextSeasonNumber = (id, delta) => {
        setSeriesList(prev => prev.map(s => {
          if (s.id === id) {
            const currentNext = s.nextSeasonNumber || (s.currentSeason + 1);
            const updatedNext = Math.max(1, currentNext + delta);
            showBanner(`🎯 ${s.title}: Esperando Temporada ${updatedNext}`);
            return {
              ...s,
              nextSeasonNumber: updatedNext,
              currentSeason: Math.max(1, updatedNext - 1)
            };
          }
          return s;
        }));
      };

      const addFromRankingsToTracking = (item) => {
        const existing = seriesList.find(s => s.title.toLowerCase() === item.title.toLowerCase() || (item.imdbId && s.imdbId === item.imdbId));
        if (existing) {
          if (!existing.userTracking) {
            setSeriesList(prev => prev.map(s => s.id === existing.id ? { ...s, userTracking: true } : s));
            showBanner(`✓ "${item.title}" reincorporada a Mis Series`);
          } else {
            showBanner(`ℹ️ "${item.title}" ya está en tu radar.`);
          }
          return;
        }

        const newSeries = {
          id: 'rank-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
          title: item.title,
          imdbId: item.imdbId,
          imdbRating: item.imdbRating,
          platform: item.platform,
          genres: item.genres,
          status: 'waiting_season',
          currentSeason: 1,
          nextSeasonNumber: 2,
          nextReleaseDate: null,
          hasConfirmedFutureDate: false,
          releaseSchedule: `${item.summary} (Calificación IMDb ★ ${item.imdbRating})`,
          airDay: 'Viernes',
          airTime: '02:00 AM COT',
          poster: item.poster,
          userTracking: true,
          userProgressSeason: 1,
          userProgressEpisode: 1,
          notes: `Añadida desde los rankings oficiales de IMDb.`
        };

        setSeriesList(prev => [newSeries, ...prev]);
        showBanner(`🎉 ¡"${item.title}" añadida a Mis Series!`);
      };

      const handleSearchMultiSource = async (query) => {
        setApiSearchQuery(query);
        if (!query || query.trim().length < 2) {
          setApiSearchResults([]);
          return;
        }

        setIsSearchingApi(true);
        try {
          const res = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(query.trim())}`);
          const data = await res.json();
          setApiSearchResults(data || []);
        } catch (err) {
          console.error(err);
        } finally {
          setIsSearchingApi(false);
        }
      };

      const myTrackedSeries = useMemo(() => {
        return seriesList
          .filter(s => s.userTracking)
          .sort((a, b) => {
            if (a.status === 'airing_weekly' && b.status !== 'airing_weekly') return -1;
            if (a.status !== 'airing_weekly' && b.status === 'airing_weekly') return 1;
            return 0;
          });
      }, [seriesList]);

      const weeklyAiringSeries = useMemo(() => seriesList.filter(s => s.status === 'airing_weekly'), [seriesList]);
      const waitingSeasonsList = useMemo(() => seriesList.filter(s => s.status === 'waiting_season'), [seriesList]);

      const currentRankingSource = topRankingType === 'historic' ? historicList : yearList;
      const filteredRankings = useMemo(() => {
        return currentRankingSource.filter(item => {
          const matchP = selectedPlatform === 'all' || item.platform.toLowerCase().includes(selectedPlatform.toLowerCase());
          const matchQ = item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                         (item.genres && item.genres.some(g => g.toLowerCase().includes(searchQuery.toLowerCase())));
          return matchP && matchQ;
        });
      }, [currentRankingSource, selectedPlatform, searchQuery]);

      const filteredMovies = useMemo(() => {
        return moviesList.filter(movie => {
          const matchYear = movieYearFilter === 'all' || movie.year === parseInt(movieYearFilter);
          const matchMonth = movieMonthFilter === 'all' || movie.month === parseInt(movieMonthFilter);
          const matchSearch = movieSearchQuery.trim() === '' || 
                              movie.title.toLowerCase().includes(movieSearchQuery.toLowerCase()) ||
                              movie.genre.toLowerCase().includes(movieSearchQuery.toLowerCase()) ||
                              movie.director.toLowerCase().includes(movieSearchQuery.toLowerCase()) ||
                              movie.cast.toLowerCase().includes(movieSearchQuery.toLowerCase());
          return matchYear && matchMonth && matchSearch;
        }).sort((a, b) => new Date(a.releaseDate) - new Date(b.releaseDate));
      }, [moviesList, movieYearFilter, movieMonthFilter, movieSearchQuery]);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans selection:bg-indigo-500 selection:text-white pb-24 sm:pb-10">
          
          {/* Header Superior */}
          <header className="sticky top-0 z-40 glass-panel border-b border-slate-800/80 px-4 sm:px-8 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center text-xl shadow-lg shadow-indigo-600/30">
                🎬
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="font-display font-black text-lg tracking-tight text-white">CineRadar</h1>
                  <span className="text-[10px] font-mono font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-full">IMDb • Cloud Sync</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-[11px] text-slate-400">{syncStatusText}</span>
                  {isSyncingLive && <span className="w-2 h-2 rounded-full bg-indigo-400 animate-ping"></span>}
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => setShowBackupModal(true)}
                className="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-cyan-300 border border-cyan-500/40 px-3 py-1.5 rounded-xl text-xs font-bold transition-all"
                title="Sincronizar o respaldar datos en la nube"
              >
                ☁️ <span>Sincronizar</span>
              </button>

              <button
                onClick={handleInstallApp}
                className="hidden sm:flex items-center gap-1.5 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-3 py-1.5 rounded-xl text-xs font-bold transition-all"
              >
                📲 <span>Instalar App</span>
              </button>

              <button
                onClick={handleRequestNotifications}
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all border ${
                  notificationPermission === 'granted'
                    ? 'bg-amber-500/20 text-amber-300 border-amber-500/50'
                    : 'bg-slate-900 hover:bg-slate-800 text-slate-300 border-slate-700'
                }`}
              >
                🔔 <span className="hidden sm:inline">{notificationPermission === 'granted' ? 'Alertas Activas' : 'Activar Alertas'}</span>
              </button>

              <button
                onClick={() => setShowNewSeriesModal(true)}
                className="flex items-center gap-1.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all shadow-lg shadow-indigo-600/30"
              >
                🔍 <span>Buscar Serie</span>
              </button>
            </div>
          </header>

          {/* Banner Toast Flotante */}
          {bannerMessage && (
            <div className="fixed top-16 left-1/2 transform -translate-x-1/2 z-50 bg-gradient-to-r from-indigo-600 to-purple-600 text-white text-xs font-bold px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-2 border border-indigo-400 animate-bounce">
              <span>✨</span>
              <span>{bannerMessage}</span>
            </div>
          )}

          {/* BARRA DE NAVEGACIÓN */}
          <div className="max-w-7xl mx-auto w-full px-4 sm:px-8 pt-4">
            <div className="grid grid-cols-5 gap-1 sm:gap-2 p-1 bg-slate-900/90 rounded-2xl border border-slate-800 text-xs font-bold">
              {[
                { id: 'tracking', label: 'Mis Series', icon: '📺', count: myTrackedSeries.length },
                { id: 'today', label: 'Capítulos Hoy', icon: '⚡', count: weeklyAiringSeries.length },
                { id: 'seasons', label: 'Próx. Temporadas', icon: '⏳', count: waitingSeasonsList.length },
                { id: 'explore', label: 'Top Calificadas', icon: '⭐', count: currentRankingSource.length },
                { id: 'movies', label: 'Cine & Trailers', icon: '🍿', count: filteredMovies.length }
              ].map(tab => {
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 py-2 px-1 rounded-xl transition-all ${
                      isActive 
                        ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-md' 
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                    }`}
                  >
                    <span>{tab.icon}</span>
                    <span className="text-[11px] sm:text-xs truncate">{tab.label}</span>
                    {tab.count !== undefined && (
                      <span className={`text-[9px] px-1.5 py-0.2 rounded-full font-mono ${isActive ? 'bg-white/20 text-white' : 'bg-slate-800 text-slate-300'}`}>
                        {tab.count}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>
          </div>

          {/* Contenido Principal */}
          <main className="max-w-7xl mx-auto w-full px-4 sm:px-8 py-5 flex-1 space-y-6">

            {/* VISTA 1: MIS SERIES (PANTALLA PRINCIPAL) */}
            {activeTab === 'tracking' && (
              <div className="space-y-4">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-900/70 p-4 rounded-3xl border border-slate-800">
                  <div>
                    <h2 className="font-display font-extrabold text-base sm:text-lg text-white flex items-center gap-2">
                      📺 Mi Radar de Series en Seguimiento ({myTrackedSeries.length})
                    </h2>
                    <p className="text-xs text-slate-400">
                      Prioridad automática: series en emisión semanal primero, seguidas por series esperando nueva temporada.
                    </p>
                  </div>
                  <button
                    onClick={() => setShowNewSeriesModal(true)}
                    className="text-xs bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/40 px-3.5 py-2 rounded-xl font-bold transition-all flex items-center gap-1.5 self-start sm:self-auto"
                  >
                    🔍 Buscar y Seguir Serie
                  </button>
                </div>

                {myTrackedSeries.length === 0 ? (
                  <div className="text-center py-16 glass-panel rounded-3xl border border-slate-800 space-y-3">
                    <div className="text-4xl">📺</div>
                    <h3 className="font-display font-bold text-white text-base">No tienes series en seguimiento</h3>
                    <p className="text-xs text-slate-400 max-w-sm mx-auto">Explora el Top 25 o busca en vivo para agregar series a tu radar.</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {myTrackedSeries.map(series => {
                      const isAiring = series.status === 'airing_weekly';
                      const hasRealFutureDate = isDateInFuture(series.nextReleaseDate) && series.hasConfirmedFutureDate;

                      return (
                        <div 
                          key={series.id} 
                          className={`card-hover rounded-3xl overflow-hidden flex flex-col justify-between border transition-all ${
                            isAiring 
                              ? 'glass-panel border-emerald-500/50 shadow-xl shadow-emerald-950/40 bg-slate-900/90 ring-1 ring-emerald-500/20' 
                              : 'bg-slate-950/70 border-slate-800/80 backdrop-blur-md opacity-90 hover:opacity-100 ring-1 ring-purple-500/10'
                          }`}
                        >
                          <div>
                            <div className="relative h-64 w-full overflow-hidden bg-slate-900">
                              <img
                                src={series.poster}
                                alt={series.title}
                                className={`w-full h-full object-cover object-top transition-all duration-300 ${
                                  isAiring ? 'opacity-95 hover:scale-105' : 'opacity-70 hover:opacity-90 grayscale-[25%] hover:grayscale-0 hover:scale-105'
                                }`}
                                loading="lazy"
                                onError={(e) => { 
                                  if (series.fallbackPoster && e.target.src !== series.fallbackPoster) {
                                    e.target.src = series.fallbackPoster;
                                  } else {
                                    e.target.src = DEFAULT_FALLBACK_POSTER;
                                  }
                                }}
                              />
                              <div className={`absolute inset-0 ${
                                isAiring 
                                  ? 'bg-gradient-to-t from-slate-950 via-slate-950/30 to-transparent' 
                                  : 'bg-gradient-to-t from-slate-950 via-slate-950/60 to-slate-950/30'
                              }`}></div>
                              
                              <div className="absolute top-3 left-3 flex flex-col gap-1">
                                {isAiring ? (
                                  <span className="text-[10px] font-black px-2.5 py-1 rounded-xl bg-emerald-950/90 text-emerald-300 border border-emerald-500/50 flex items-center gap-1.5 shadow-lg backdrop-blur">
                                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                                    ⚡ EN EMISIÓN
                                  </span>
                                ) : (
                                  <span className="text-[10px] font-black px-2.5 py-1 rounded-xl bg-purple-950/90 text-purple-300 border border-purple-500/40 flex items-center gap-1 shadow-lg backdrop-blur">
                                    <span>⏳ EN ESPERA T{series.nextSeasonNumber || (series.currentSeason + 1)}</span>
                                  </span>
                                )}
                                <span className="text-[9px] font-bold px-2 py-0.5 rounded-lg bg-slate-950/80 text-slate-300 border border-white/10 w-fit backdrop-blur">
                                  📺 {series.platform}
                                </span>
                              </div>

                              <div className="absolute top-3 right-3 flex items-center gap-1.5">
                                <button
                                  onClick={() => openPosterModal(series, 'series')}
                                  title="Cambiar o buscar otra imagen oficial"
                                  className="bg-slate-950/80 hover:bg-slate-800 text-cyan-300 border border-cyan-500/30 text-[10px] font-bold px-2 py-1 rounded-xl backdrop-blur transition-all"

                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <h2 className="font-display font-extrabold text-lg text-white flex items-center gap-2">
                        🍿 Calendario de Estrenos de Cine 2026 / 2027 ({filteredMovies.length} películas)
                      </h2>
                    </div>

                    <div className="flex items-center bg-slate-950 p-1 rounded-2xl border border-slate-800">
                      {[
                        { id: 'all', label: 'Todos' },
                        { id: '2026', label: '🎬 Año 2026' },
                        { id: '2027', label: '🚀 Año 2027' }
                      ].map(yr => (
                        <button
                          key={yr.id}
                          onClick={() => setMovieYearFilter(yr.id)}
                          className={`px-3.5 py-1.5 rounded-xl text-xs font-black transition-all ${
                            movieYearFilter === yr.id
                              ? 'bg-red-600 text-white shadow-lg'
                              : 'text-slate-400 hover:text-white'
                          }`}
                        >
                          {yr.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="flex flex-col md:flex-row items-center justify-between gap-3 pt-2 border-t border-slate-800">
                    <input
                      type="text"
                      placeholder="Buscar película..."
                      value={movieSearchQuery}
                      onChange={(e) => setMovieSearchQuery(e.target.value)}
                      className="w-full md:w-80 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-red-500"
                    />

                    <div className="flex flex-wrap gap-1 w-full md:w-auto">
                      {MONTHS.map(m => (
                        <button
                          key={m.id}
                          onClick={() => setMovieMonthFilter(m.id.toString())}
                          className={`text-[11px] px-2.5 py-1 rounded-lg font-bold border transition-all ${
                            movieMonthFilter === m.id.toString()
                              ? 'bg-red-500 text-white border-red-400 shadow-md'
                              : 'bg-slate-950/80 text-slate-400 border-slate-800 hover:text-white'
                          }`}
                        >
                          {m.name}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {filteredMovies.map(movie => (
                    <div key={movie.id} className="glass-panel card-hover rounded-3xl overflow-hidden border border-slate-800 flex flex-col justify-between">
                      <div>
                        <div className="relative h-72 w-full bg-slate-900 overflow-hidden">
                          <img
                            src={movie.poster}
                            alt={movie.title}
                            className="w-full h-full object-cover object-top hover:scale-105 transition-transform duration-300"
                            loading="lazy"
                            onError={(e) => { e.target.src = DEFAULT_FALLBACK_POSTER; }}
                          />
                          <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
                          
                          <div className="absolute top-3 left-3 flex items-center gap-1.5">
                            <span className="bg-red-600 text-white font-black text-[10px] px-2.5 py-1 rounded-full uppercase tracking-wider shadow-md">
                              {movie.year} • {movie.monthName}
                            </span>
                          </div>

                          <div className="absolute top-3 right-3 flex items-center gap-1.5">
                            <button
                              onClick={() => openPosterModal(movie, 'movie')}
                              className="bg-slate-950/80 hover:bg-slate-800 text-cyan-300 border border-cyan-500/30 text-[10px] font-bold px-2 py-1 rounded-xl backdrop-blur transition-all"
                            >
                              🖼️ Póster
                            </button>
                          </div>

                          <div className="absolute bottom-3 left-3 right-3">
                            <span className="text-[10px] text-red-400 font-mono font-bold block">{movie.genre}</span>
                            <h3 className="font-display font-extrabold text-base sm:text-lg text-white leading-tight">{movie.title}</h3>
                          </div>
                        </div>

                        <div className="p-4 space-y-3">
                          <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 flex items-center justify-between">
                            <span className="text-sm font-mono font-extrabold text-amber-300">
                              📅 {movie.releaseDate}
                            </span>
                            <span className="text-[10px] font-bold bg-red-950/80 text-red-300 border border-red-500/30 px-2 py-0.5 rounded-lg">
                              {movie.monthName} {movie.year}
                            </span>
                          </div>

                          <p className="text-xs text-slate-300 leading-relaxed line-clamp-3">
                            {movie.synopsis}
                          </p>
                        </div>
                      </div>

                      <div className="p-4 pt-0">
                        <a
                          href={movie.youtubeUrl}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="w-full bg-gradient-to-r from-red-600 to-rose-700 text-white font-bold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5"
                        >
                          ▶ <span>Ver Trailer Oficial en YouTube</span> ↗
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* Modal de Sincronización en la Nube y Copia de Respaldo */}
          {showBackupModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="glass-panel bg-slate-900 border border-slate-700 rounded-3xl p-5 sm:p-6 max-w-md w-full space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">☁️</span>
                    <div>
                      <h3 className="font-display font-extrabold text-base text-white">Sincronización en la Nube</h3>
                      <p className="text-[11px] text-slate-400">Comparte tu progreso entre PC y Android.</p>
                    </div>
                  </div>
                  <button onClick={() => setShowBackupModal(false)} className="text-slate-400 hover:text-white text-xs font-bold p-1 bg-slate-800 rounded-lg">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div className="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 space-y-2">
                    <span className="font-bold text-slate-300 block">Sincronización Inmediata (Archivo .JSON):</span>
                    <p className="text-slate-400 text-[11px]">Descarga tus cambios en el PC e impórtalos en tu celular en 2 segundos.</p>
                    
                    <div className="grid grid-cols-2 gap-2 pt-1">
                      <button
                        onClick={exportBackupJSON}
                        className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-3 rounded-xl transition-all flex items-center justify-center gap-1.5 shadow-md"
                      >
                        📥 <span>Exportar Datos</span>
                      </button>

                      <label className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-3 rounded-xl transition-all flex items-center justify-center gap-1.5 shadow-md cursor-pointer text-center">
                        📤 <span>Importar Datos</span>
                        <input type="file" accept=".json" onChange={importBackupJSON} className="hidden" />
                      </label>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Modal para Cambiar Póster Oficial */}
          {editingItemForPoster && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div className="glass-panel bg-slate-900 border border-slate-700 rounded-3xl p-5 sm:p-6 max-w-lg w-full space-y-4 shadow-2xl my-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🖼️</span>
                    <div>
                      <h3 className="font-display font-extrabold text-base text-white">
                        Cambiar Póster: {editingItemForPoster.title}
                      </h3>
                      <p className="text-[11px] text-slate-400">Pega un enlace directo o busca en la web.</p>
                    </div>
                  </div>
                  <button onClick={() => setEditingItemForPoster(null)} className="text-slate-400 hover:text-white text-xs font-bold p-1 bg-slate-800 rounded-lg">✕</button>
                </div>

                <div className="space-y-1.5 bg-slate-950 p-3 rounded-2xl border border-slate-800">
                  <label className="text-[11px] font-bold text-slate-300 block">Pegar URL directa de imagen:</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      placeholder="https://... (JPG, PNG, WebP)"
                      value={customPosterUrlInput}
                      onChange={(e) => setCustomPosterUrlInput(e.target.value)}
                      className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-cyan-400"
                    />
                    <button onClick={() => applyNewPoster(customPosterUrlInput)} className="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-black px-3 py-1.5 rounded-xl text-xs">Guardar</button>
                  </div>
                </div>

                <div className="space-y-2">
                  <label className="text-[11px] font-bold text-slate-300 block">Buscar alternativas oficiales:</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={posterSearchQuery}
                      onChange={(e) => setPosterSearchQuery(e.target.value)}
                      placeholder="Buscar por nombre..."
                      className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-400"
                    />
                    <button onClick={() => searchPostersForQuery(posterSearchQuery)} className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-1.5 rounded-xl text-xs">Buscar</button>
                  </div>

                  <div className="grid grid-cols-3 gap-2 max-h-56 overflow-y-auto p-1">
                    {posterSearchResults.map(({ show }) => {
                      const imgUrl = show.image ? (show.image.original || show.image.medium) : null;
                      if (!imgUrl) return null;
                      return (
                        <div key={show.id} onClick={() => applyNewPoster(imgUrl)} className="cursor-pointer group relative rounded-xl overflow-hidden border border-slate-800 hover:border-cyan-400 aspect-[2/3] bg-slate-950">
                          <img src={imgUrl} alt={show.name} className="w-full h-full object-cover" />
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Modal de Búsqueda Online */}
          {showNewSeriesModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div className="glass-panel bg-slate-900 border border-slate-700 rounded-3xl p-5 sm:p-6 max-w-xl w-full space-y-4 shadow-2xl my-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🔍</span>
                    <h3 className="font-display font-extrabold text-base text-white">Buscador Oficial de Series</h3>
                  </div>
                  <button onClick={() => setShowNewSeriesModal(false)} className="text-slate-400 hover:text-white text-xs font-bold p-1 bg-slate-800 rounded-lg">✕</button>
                </div>

                <div className="space-y-4 text-xs">
                  <input
                    type="text"
                    placeholder="Ej: Breaking Bad, Succession, Dark..."
                    value={apiSearchQuery}
                    onChange={(e) => handleSearchMultiSource(e.target.value)}
                    className="w-full bg-slate-950 border border-indigo-500/50 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-400 text-xs shadow-inner"
                    autoFocus
                  />

                  <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
                    {apiSearchResults.map(({ show }) => {
                      const poster = show.image ? (show.image.medium || show.image.original) : DEFAULT_FALLBACK_POSTER;
                      return (
                        <div key={show.id} className="flex items-center justify-between p-3 bg-slate-950/80 border border-slate-800 rounded-2xl gap-3">
                          <div className="flex items-center gap-3 min-w-0">
                            <img src={poster} alt={show.name} className="w-12 h-16 object-cover rounded-xl shrink-0" />
                            <h4 className="font-display font-bold text-white text-xs truncate">{show.name}</h4>
                          </div>
                          <div className="flex items-center gap-1.5">
                            <button onClick={() => handleImportFromApi({ show })} className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-[10px] px-2.5 py-1.5 rounded-xl">📺 Mis Series</button>
                            <button onClick={() => handleImportToTopRanking({ show }, 'historic')} className="bg-amber-600 hover:bg-amber-500 text-slate-950 font-black text-[10px] px-2.5 py-1.5 rounded-xl">🏆 Top</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-900 bg-slate-950/80 text-center py-4 text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-center gap-2">
            <span>CineRadar Pro &copy; 2026/2027 — Sincronización en la Nube & Rankings IMDb.</span>
            <button onClick={restoreDefaults} className="text-indigo-400 hover:underline">Restaurar catálogo inicial</button>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
