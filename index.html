  <!-- Firebase Cloud Sync Bridge -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'cineradar-pro';
    
    window.CineRadarCloud = {
      isReady: false,
      auth: null,
      db: null,
      saveUserData: null,
      subscribeUserData: null
    };

    try {
      if (typeof __firebase_config !== 'undefined') {
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        window.CineRadarCloud.auth = auth;
        window.CineRadarCloud.db = db;

        const authPromise = typeof __initial_auth_token !== 'undefined' && __initial_auth_token
          ? signInWithCustomToken(auth, __initial_auth_token)
          : signInAnonymously(auth);

        authPromise.then(async () => {
          window.CineRadarCloud.isReady = true;

          window.CineRadarCloud.saveUserData = async (data, profileId) => {
            if (!auth.currentUser || !profileId) return;
            try {
              const docRef = doc(db, 'artifacts', appId, 'users', profileId, 'library', 'current');
              await setDoc(docRef, {
                series: JSON.stringify(data.series || []),
                pending: JSON.stringify(data.pending || []),
                historic: JSON.stringify(data.historic || []),
                year: JSON.stringify(data.year || []),
                movies: JSON.stringify(data.movies || []),
                emailConfig: JSON.stringify(data.emailConfig || {}),
                profileName: data.profileName || 'Mi Perfil',
                profileAvatar: data.profileAvatar || '🍿',
                profilePin: data.profilePin || '',
                updatedAt: new Date().toISOString(),
                updatedBy: profileId
              }, { merge: true });
            } catch (err) {
              console.warn("Cloud save warning:", err);
            }
          };

          window.CineRadarCloud.subscribeUserData = (profileId, callback) => {
            if (!auth.currentUser || !profileId) return () => {};
            try {
              const docRef = doc(db, 'artifacts', appId, 'users', profileId, 'library', 'current');
              return onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                  const cloudData = snapshot.data();
                  callback({
                    series: cloudData.series ? JSON.parse(cloudData.series) : null,
                    pending: cloudData.pending ? JSON.parse(cloudData.pending) : null,
                    historic: cloudData.historic ? JSON.parse(cloudData.historic) : null,
                    year: cloudData.year ? JSON.parse(cloudData.year) : null,
                    movies: cloudData.movies ? JSON.parse(cloudData.movies) : null,
                    emailConfig: cloudData.emailConfig ? JSON.parse(cloudData.emailConfig) : null,
                    profileName: cloudData.profileName,
                    profileAvatar: cloudData.profileAvatar,
                    profilePin: cloudData.profilePin,
                    updatedAt: cloudData.updatedAt
                  });
                }
              }, (error) => {
                console.warn("Snapshot notice:", error);
              });
            } catch (err) {
              console.warn("Subscribe notice:", err);
              return () => {};
            }
          };

          window.dispatchEvent(new CustomEvent('cineradar-cloud-ready'));
        }).catch(err => {
          console.warn("Auth warning:", err);
        });
      }
    } catch (e) {
      console.warn("Cloud init notice:", e);
    }
  </script>

    const getPlatformInfo = (platformName) => {
      if (!platformName) return { name: 'Streaming', icon: '📺', color: 'bg-slate-900 text-slate-300 border-slate-700' };
      const lower = platformName.toLowerCase();

    const isDateInFuture = (dateStr) => {
      if (!dateStr) return false;
      const target = new Date(dateStr);
      if (isNaN(target.getTime())) return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return target > today;
    };

    const getDaysRemainingText = (dateStr) => {
      if (!dateStr) return null;
      const target = new Date(dateStr);
      if (isNaN(target.getTime())) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const diffMs = target - today;
      const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
      if (diffDays <= 0) return '¡Estrena hoy!';
      if (diffDays === 1) return 'Estrena mañana';
      return `Faltan ${diffDays} días`;
    };

    // Función auxiliar para inspeccionar TVMaze y obtener temporadas y episodios exactos en vivo
    const inspectShowDetailsFromTvMaze = async (tvmazeId, showTitle) => {
      try {
        const endpoint = tvmazeId
          ? `https://api.tvmaze.com/shows/${tvmazeId}?embed[]=nextepisode&embed[]=previousepisode&embed[]=seasons`
          : `https://api.tvmaze.com/singlesearch/shows?q=${encodeURIComponent(showTitle)}&embed[]=nextepisode&embed[]=previousepisode&embed[]=seasons`;

        const res = await fetch(endpoint);
        if (!res.ok) return null;
        const data = await res.json();

        const nextEp = data._embedded?.nextepisode;
        const prevEp = data._embedded?.previousepisode;
        const seasons = data._embedded?.seasons || [];

        // Temporada máxima registrada en el catálogo
        let maxSeason = 1;
        if (Array.isArray(seasons) && seasons.length > 0) {
          maxSeason = Math.max(...seasons.map(s => s.number || 1));
        }
        if (prevEp?.season && prevEp.season > maxSeason) {
          maxSeason = prevEp.season;
        }
        if (nextEp?.season && nextEp.season > maxSeason) {
          maxSeason = nextEp.season;
        }

        const isRunning = data.status === 'Running';
        const hasNext = !!(nextEp && nextEp.airdate);
        
        let status = 'waiting_season';
        let currentSeason = maxSeason;
        let nextSeasonNumber = maxSeason + 1;
        let latestEpText = '';
        let nextReleaseDate = null;
        let hasConfirmedFutureDate = false;

        // Verificar si el próximo episodio tiene fecha futura
        if (hasNext && isDateInFuture(nextEp.airdate)) {
          const daysDiff = (new Date(nextEp.airdate) - new Date()) / (1000 * 60 * 60 * 24);
          if (daysDiff <= 14 && daysDiff >= -1) {
            status = 'airing_weekly';
          }
          currentSeason = nextEp.season;
          nextSeasonNumber = nextEp.season;
          nextReleaseDate = nextEp.airdate;
          hasConfirmedFutureDate = true;
          latestEpText = `Nuevo ep: T${nextEp.season}E${nextEp.number} ("${nextEp.name}")`;
        } else {
          // Si no hay nextepisode, verificar si alguna temporada futura registrada en seasons tiene premiereDate
          const upcomingSeason = seasons.find(s => s.number > (prevEp?.season || 1) && s.premiereDate && isDateInFuture(s.premiereDate));
          if (upcomingSeason) {
            hasConfirmedFutureDate = true;
            nextReleaseDate = upcomingSeason.premiereDate;
            nextSeasonNumber = upcomingSeason.number;
          }

          if (prevEp) {
            currentSeason = prevEp.season;
            nextSeasonNumber = data.status === 'Ended' ? prevEp.season : (nextSeasonNumber || prevEp.season + 1);
            latestEpText = `Último emitido: T${prevEp.season}E${prevEp.number}`;
          }
        }

        const airDay = data.schedule?.days?.[0] || 'Viernes';
        const airTime = data.schedule?.time ? `${data.schedule.time} COT` : '02:00 AM COT';
        const posterUrl = data.image ? (data.image.original || data.image.medium) : null;

        return {
          tvmazeId: data.id,
          title: data.name,
          status,
          currentSeason,
          nextSeasonNumber,
          nextReleaseDate,
          hasConfirmedFutureDate,
          airDay,
          airTime,
          poster: posterUrl,
          imdbRating: data.rating?.average || 8.3,
          imdbId: data.externals?.imdb || null,
          latestEpText,
          releaseSchedule: status === 'airing_weekly'
            ? `¡En emisión activa! Nuevo capítulo cada ${airDay} (${airTime}). ${latestEpText}`
            : data.status === 'Ended'
              ? `Serie concluida tras ${currentSeason} temporadas.`
              : hasConfirmedFutureDate
                ? `Temporada ${nextSeasonNumber} confirmada. Estreno oficial el ${nextReleaseDate}.`
                : `Temporada ${currentSeason} concluida (${latestEpText}). Próxima Temporada ${nextSeasonNumber} en producción; fecha oficial por confirmar.`
        };
      } catch (err) {
        console.warn('Error inspeccionando TVMaze:', err);
        return null;
      }
    };

    const findLegacyStoredData = (keySuffix) => {
      const candidateKeys = [
        `cineradar_series_v13`,
        `cineradar_series_v12`,
        `cineradar_series_v16`,
        `cineradar_series`
      ];

      for (const k of candidateKeys) {
        if (keySuffix === 'series') {
          const raw = localStorage.getItem(k);
          if (raw) {
            try {
              const parsed = JSON.parse(raw);
              if (Array.isArray(parsed) && parsed.length > 0) return parsed;
            } catch (e) {}
          }
        }
      }
      return null;
    };

    const playChime = () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880.00, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    };

          setPinError(true);
          playChime();
        }
      };

      const loginProfile = (profile) => {
        setActiveProfile(profile);
        localStorage.setItem('cineradar_current_session_profile_v16', JSON.stringify(profile));
        showBanner(`👋 ¡Bienvenido, ${profile.name}!`);
      };

      const handleExitProfile = () => {
        setActiveProfile(null);
        localStorage.removeItem('cineradar_current_session_profile_v16');
      };

      const handleEmergencyRestore = () => {
        const legacy = findLegacyStoredData('series');
        if (legacy && legacy.length > 0) {
          setSeriesList(legacy);
          localStorage.setItem(`cineradar_usr_${activeProfile?.id || 'luis'}_series`, JSON.stringify(legacy));
          showBanner(`🎉 ¡${legacy.length} series de tu historial previo recuperadas con éxito!`);
        } else {
          showBanner('ℹ️ Tu historial actual ya contiene todas las series registradas.');
        }
      };

      // Función para actualizar en vivo una serie específica
      const refreshSingleSeries = async (seriesId, tvmazeId, title) => {
        showBanner(`🔍 Consultando novedades en vivo de "${title}"...`);
        const liveInfo = await inspectShowDetailsFromTvMaze(tvmazeId, title);
        if (!liveInfo) {
          showBanner(`⚠️ No se pudo consultar la API para "${title}".`);
          return;
        }

        setSeriesList(prev => prev.map(s => {
          if (s.id === seriesId) {
            return {
              ...s,
              tvmazeId: liveInfo.tvmazeId || s.tvmazeId,
              currentSeason: liveInfo.currentSeason,
              nextSeasonNumber: liveInfo.nextSeasonNumber,
              status: liveInfo.status,
              nextReleaseDate: liveInfo.nextReleaseDate,
              hasConfirmedFutureDate: liveInfo.hasConfirmedFutureDate,
              releaseSchedule: liveInfo.releaseSchedule,
              airDay: liveInfo.airDay || s.airDay,
              airTime: liveInfo.airTime || s.airTime,
              poster: liveInfo.poster || s.poster,
              imdbRating: liveInfo.imdbRating || s.imdbRating
            };
          }
          return s;
        }));

        showBanner(`✅ "${title}" actualizada: T${liveInfo.currentSeason} • Próx: T${liveInfo.nextSeasonNumber}`);
      };

      // Función para actualizar en vivo TODAS las series
      const refreshAllSeriesLive = async () => {
        setIsSyncingLiveAll(true);
        showBanner('🔄 Inspeccionando capítulos y temporadas oficiales en vivo...');
        let updatedCount = 0;

        try {
          const updatedSeries = await Promise.all(
            seriesList.map(async (s) => {
              const live = await inspectShowDetailsFromTvMaze(s.tvmazeId, s.title);
              if (live) {
                updatedCount++;
                return {
                  ...s,
                  tvmazeId: live.tvmazeId || s.tvmazeId,
                  currentSeason: live.currentSeason,
                  nextSeasonNumber: live.nextSeasonNumber,
                  status: live.status,
                  nextReleaseDate: live.nextReleaseDate,
                  hasConfirmedFutureDate: live.hasConfirmedFutureDate,
                  releaseSchedule: live.releaseSchedule,
                  airDay: live.airDay || s.airDay,
                  airTime: live.airTime || s.airTime,
                  poster: live.poster || s.poster,
                  imdbRating: live.imdbRating || s.imdbRating
                };
              }
              return s;
            })
          );

          setSeriesList(updatedSeries);
          showBanner(`🎉 ¡${updatedCount} series actualizadas con su temporada y emisión real!`);
        } catch (e) {
          showBanner('⚠️ Error actualizando algunas series.');
        } finally {
          setIsSyncingLiveAll(false);
        }
      };

      // Importar serie con inspección profunda en TVMaze
      const handleImportChosen = async (item) => {
        const show = item.show;
        if (!show) return;

        setIsImportingDeep(true);
        showBanner(`🔍 Analizando temporadas y emisión de "${show.name}"...`);

        // Inspeccionar estado real, última temporada emitida y próxima entrega
        const liveInfo = await inspectShowDetailsFromTvMaze(show.id, show.name);

        const detectedNet = show.webChannel ? show.webChannel.name : (show.network ? show.network.name : '');
        let matchedPlatform = addChosenPlatform;
        if (!matchedPlatform) {
          const found = SUPPORTED_PLATFORMS.find(p => detectedNet.toLowerCase().includes(p.name.toLowerCase()));
          matchedPlatform = found ? found.name : (detectedNet || 'Netflix');
        }

        const ratingVal = liveInfo?.imdbRating || show.rating?.average || 8.2;
        const posterUrl = liveInfo?.poster || show.image?.original || show.image?.medium || DEFAULT_FALLBACK_POSTER;
        const currentSn = liveInfo?.currentSeason || 1;
        const nextSn = liveInfo?.nextSeasonNumber || (currentSn + 1);
        const seriesStatus = liveInfo?.status || 'waiting_season';

        if (addDestination === 'pending') {
          const newPending = {
            id: 'pend-' + Date.now(),
            tvmazeId: show.id,
            title: show.name,
            platform: matchedPlatform,
            priority: addPriority,
            genres: show.genres && show.genres.length > 0 ? show.genres : ['Drama'],
            imdbRating: ratingVal,
            poster: posterUrl,
            notes: liveInfo?.releaseSchedule || `Guardada en pendientes (${matchedPlatform}).`
          };
          setPendingList(prev => [newPending, ...prev]);
          showBanner(`📋 "${show.name}" guardada en Pendientes (T${currentSn})`);
        } else {
          const newSeries = {
            id: 'tvmaze-' + show.id + '-' + Date.now(),
            tvmazeId: show.id,
            title: show.name,
            imdbId: liveInfo?.imdbId || show.externals?.imdb || null,
            imdbRating: ratingVal,
            platform: matchedPlatform,
            genres: show.genres && show.genres.length > 0 ? show.genres : ['Drama'],
            status: seriesStatus,
            currentSeason: currentSn,
            nextSeasonNumber: nextSn,
            nextReleaseDate: liveInfo?.nextReleaseDate || null,
            hasConfirmedFutureDate: liveInfo?.hasConfirmedFutureDate || false,
            releaseSchedule: liveInfo?.releaseSchedule || `Disponible en ${matchedPlatform}.`,
            airDay: liveInfo?.airDay || show.schedule?.days?.[0] || 'Viernes',
            airTime: liveInfo?.airTime || (show.schedule?.time ? `${show.schedule.time} COT` : '02:00 AM COT'),
            poster: posterUrl,
            userTracking: true,
            userProgressSeason: currentSn,
            userProgressEpisode: 1,
            notes: `Ficha oficial T${currentSn} • ${matchedPlatform}.`
          };
          setSeriesList(prev => [newSeries, ...prev]);
          showBanner(`📺 "${show.name}" agregada con éxito (T${currentSn} • Próx: T${nextSn})`);
        }

        setIsImportingDeep(false);
        setShowNewSeriesModal(false);
        setApiSearchQuery('');
        setApiSearchResults([]);
      };

      const promotePendingToTracking = async (item) => {
        setPendingList(prev => prev.filter(p => p.id !== item.id));
        showBanner(`🔍 Verificando temporadas de "${item.title}"...`);
        const live = await inspectShowDetailsFromTvMaze(item.tvmazeId, item.title);

        const currentSn = live?.currentSeason || 1;
        const nextSn = live?.nextSeasonNumber || (currentSn + 1);

        const newSeries = {
          id: 'ser-' + Date.now(),
          tvmazeId: live?.tvmazeId || item.tvmazeId || null,
          title: item.title,
          platform: item.platform || 'Netflix',
          genres: item.genres || ['Drama'],
          status: live?.status || 'waiting_season',
          currentSeason: currentSn,
          nextSeasonNumber: nextSn,
          nextReleaseDate: live?.nextReleaseDate || null,
          hasConfirmedFutureDate: live?.hasConfirmedFutureDate || false,
          releaseSchedule: live?.releaseSchedule || `Iniciada desde tu lista de Pendientes.`,
          airDay: live?.airDay || 'Viernes',
          airTime: live?.airTime || '02:00 AM COT',
          poster: live?.poster || item.poster,
          userTracking: true,
          userProgressSeason: currentSn,
          userProgressEpisode: 1,
          notes: item.notes || 'Iniciada desde pendientes.'

        setSeriesList(prev => [newSeries, ...prev]);
        showBanner(`🎉 "${item.title}" en Mis Series (T${currentSn})`);
      };

      const handleSearchApi = async (query) => {
        setApiSearchQuery(query);
        if (!query || query.trim().length < 2) {
          setApiSearchResults([]);
          return;
        }
        try {
          const res = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(query.trim())}`);
          const data = await res.json();
          setApiSearchResults(data || []);
        } catch (err) {
          setApiSearchResults([]);
        }
      };

      const toggleSeriesStatus = (id) => {
        setSeriesList(prev => prev.map(s => {
          if (s.id === id) {
            const nextStatus = s.status === 'airing_weekly' ? 'waiting_season' : 'airing_weekly';
            showBanner(`🔄 "${s.title}": ${nextStatus === 'airing_weekly' ? '⚡ En Emisión' : '⏳ Esperando Temporada'}`);
            return {
              ...s,
              status: nextStatus,
              releaseSchedule: nextStatus === 'airing_weekly'
                ? `Nuevo episodio cada ${s.airDay || 'Viernes'} a las ${s.airTime || '02:00 AM COT'} por ${s.platform}.`
                : `Temporada ${s.currentSeason} concluida. Próxima Temporada ${s.nextSeasonNumber || (s.currentSeason + 1)} en espera.`
            };
          }
          return s;
        }));
      };

      const changeEpisode = (id, delta) => {
        setSeriesList(prev => prev.map(s => {
          if (s.id === id) {
            const current = s.userProgressEpisode || 1;
            const nextEp = Math.max(1, current + delta);
            return { ...s, userProgressEpisode: nextEp };
          }
          return s;
        }));
      };

      const changeSeason = (id, delta) => {
        setSeriesList(prev => prev.map(s => {
          if (s.id === id) {
            const current = s.userProgressSeason || 1;
            const nextSn = Math.max(1, current + delta);
            return { ...s, userProgressSeason: nextSn, userProgressEpisode: 1 };
          }
          return s;
        }));
      };

      const changeNextSeasonNumber = (id, delta) => {
        setSeriesList(prev => prev.map(s => {
          if (s.id === id) {
            const current = s.nextSeasonNumber || (s.currentSeason + 1);
            const nextVal = Math.max(1, current + delta);
            showBanner(`🎯 ${s.title}: Próxima Temporada ajustada a T${nextVal}`);
            return { ...s, nextSeasonNumber: nextVal };

          return s;
        }));
      };

      const openPlatformSelector = (item, isPending = false) => {
        setPlatformModalItem({ ...item, isPending });
        setCustomPlatformInput('');
      };

      const handleAssignPlatform = (selectedName) => {
        if (!platformModalItem || !selectedName) return;
        const targetId = platformModalItem.id;
        const targetTitle = platformModalItem.title;

        if (platformModalItem.isPending) {
          setPendingList(prev => prev.map(p => p.id === targetId ? { ...p, platform: selectedName } : p));
        } else {
          setSeriesList(prev => prev.map(s => s.id === targetId ? { ...s, platform: selectedName } : s));

        setPlatformModalItem(null);
        showBanner(`📺 "${targetTitle}" asignada a ${selectedName}`);

      const openMyProfileModal = () => {
        setMyProfileName(activeProfile.name);
        setMyProfileAvatar(activeProfile.avatar || '🍿');
        setMyPinOld('');
        setMyPinNew('');
        setMyPinConfirm('');
        setMyPinError('');
        setShowMyProfileModal(true);
      };

      const handleSaveMyProfile = (e) => {
        e.preventDefault();
        setMyPinError('');

        const currentPin = activeProfile.pin || '';
        if (currentPin.trim().length > 0) {
          if (myPinOld.trim() !== currentPin.trim()) {
            setMyPinError('❌ Tu PIN actual no es correcto.');
            playChime();
            return;
          }
        }

        if (myPinNew.trim().length > 0) {
          if (myPinNew.trim() !== myPinConfirm.trim()) {
            setMyPinError('❌ La confirmación del nuevo PIN no coincide.');
            playChime();
            return;
          }
        }

        const finalPin = myPinNew.trim().length > 0 ? myPinNew.trim() : (myPinOld.trim().length > 0 && myPinNew === '' ? '' : currentPin);

        const updated = {
          ...activeProfile,
          name: myProfileName.trim() || activeProfile.name,
          avatar: myProfileAvatar,
          pin: finalPin
        };

        setActiveProfile(updated);
        localStorage.setItem('cineradar_current_session_profile_v16', JSON.stringify(updated));
        setProfilesList(prev => prev.map(p => p.id === activeProfile.id ? updated : p));

        setShowMyProfileModal(false);
        showBanner(finalPin ? '🔒 PIN actualizado correctamente' : '🔓 PIN removido con éxito');
      };

      const handleCreateProfile = (e) => {
        e.preventDefault();
        if (!newProfileName.trim()) return;

        const cleanId = newProfileId.trim()
          ? newProfileId.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '')
          : 'usr-' + Date.now().toString(36);

        const newProfile = {
          id: cleanId,
          name: newProfileName.trim(),
          avatar: newProfileAvatar || '🍿',
          pin: newProfilePin.trim(),
          isAdmin: false
        };

        setProfilesList(prev => [...prev.filter(p => p.id !== cleanId), newProfile]);
        setNewProfileName('');
        setNewProfilePin('');
        setNewProfileId('');
        setShowCreateProfileModal(false);
        showBanner(`✨ Perfil "${newProfile.name}" creado`);
      };

      const handleSaveEditedProfile = (e) => {
        e.preventDefault();
        if (!editingProfileData) return;

        setProfilesList(prev => prev.map(p => {
          if (p.id === editingProfileData.id) {
            return {
              ...p,
              name: editingProfileData.name.trim(),
              avatar: editingProfileData.avatar,
              pin: editingProfileData.pin.trim()
            };
          }
          return p;
        }));

        if (activeProfile && activeProfile.id === editingProfileData.id) {
          const updatedActive = {
            ...activeProfile,
            name: editingProfileData.name.trim(),
            avatar: editingProfileData.avatar,
            pin: editingProfileData.pin.trim()
          };
          setActiveProfile(updatedActive);
          localStorage.setItem('cineradar_current_session_profile_v16', JSON.stringify(updatedActive));
        }

        setEditingProfileData(null);
        showBanner(`💾 Perfil actualizado correctamente`);
      };

      const handleDeleteProfile = (profileId, profileName) => {
        if (confirm(`¿Estás seguro de que deseas eliminar el perfil de "${profileName}"?`)) {
          setProfilesList(prev => prev.filter(p => p.id !== profileId));
          showBanner(`🗑️ Perfil "${profileName}" eliminado`);
        }
      };

      // ORDENAMIENTO PRIORITARIO: Siempre primero las series en emisión activa ('airing_weekly'), seguidas por las en espera
      const myTrackedSeries = useMemo(() => {
        return [...seriesList]
          .filter(s => s.userTracking)
          .sort((a, b) => {
            const aIsAiring = a.status === 'airing_weekly' ? 1 : 0;
            const bIsAiring = b.status === 'airing_weekly' ? 1 : 0;
            if (aIsAiring !== bIsAiring) {
              return bIsAiring - aIsAiring; // 1 (en emisión) va antes que 0 (en espera)
            }
            return (a.title || '').localeCompare(b.title || '');
          });
      }, [seriesList]);

      const filteredPendingList = useMemo(() => {
        return pendingList.filter(p => pendingPriorityFilter === 'all' || p.priority === pendingPriorityFilter);
      }, [pendingList, pendingPriorityFilter]);

      const weeklyAiringSeries = useMemo(() => seriesList.filter(s => s.status === 'airing_weekly'), [seriesList]);
      const waitingSeasonsList = useMemo(() => seriesList.filter(s => s.status === 'waiting_season'), [seriesList]);

      const currentRankingSource = topRankingType === 'historic' ? historicList : yearList;
      const filteredRankings = useMemo(() => {
        return currentRankingSource.filter(item => {
          const matchP = selectedPlatform === 'all' || item.platform.toLowerCase().includes(selectedPlatform.toLowerCase());
          const matchQ = item.title.toLowerCase().includes(searchQuery.toLowerCase());
          return matchP && matchQ;
        });
      }, [currentRankingSource, selectedPlatform, searchQuery]);

      // ========================================================
      // 1. PANTALLA DE PERFILES («¿QUIÉN ESTÁ VIENDO?»)
      // ========================================================
      if (!activeProfile) {
        return (
          <div className="min-h-screen bg-[#060a13] text-white flex flex-col items-center justify-center p-6 select-none font-sans relative overflow-hidden">
            <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

            <div className="max-w-2xl w-full space-y-9 text-center relative z-10">
              <div className="space-y-3">
                <div className="w-16 h-16 rounded-3xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center text-3xl mx-auto shadow-2xl shadow-indigo-500/30">
                  🎬
                </div>
                <h1 className="font-display font-black text-3xl sm:text-4xl tracking-tight text-white">
                  CineRadar Pro
                </h1>
                <p className="text-slate-400 text-sm max-w-md mx-auto">
                  ¿Quién está viendo hoy? Selecciona tu perfil para ingresar a tu espacio sincronizado.
                </p>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 pt-1 max-w-xl mx-auto">
                {profilesList.map(p => {
                  const hasPin = p.pin && p.pin.trim().length > 0;
                  return (
                    <div
                      key={p.id}
                      onClick={() => handleProfileClick(p)}
                      className="group cursor-pointer bg-slate-900/80 hover:bg-slate-800 border border-slate-800 hover:border-indigo-500/60 rounded-3xl p-5 flex flex-col items-center space-y-3 transition-all duration-200 hover:scale-105 shadow-xl relative"
                    >
                      {hasPin && (
                        <span className="absolute top-3 right-3 text-xs bg-slate-950/80 border border-slate-700 px-1.5 py-0.5 rounded-md text-amber-300 font-mono" title="Protegido con PIN">
                          🔒
                        </span>
                      )}

                      <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-slate-800 to-slate-700 flex items-center justify-center text-3xl shadow-inner border border-white/10 group-hover:border-indigo-400 transition-colors">
                        {p.avatar || '🍿'}
                      </div>
                      
                      <div className="space-y-0.5 text-center">
                        <span className="font-display font-bold text-sm text-white block group-hover:text-indigo-300">
                          {p.name}
                        </span>
                        <span className="text-[10px] font-mono text-slate-500 block truncate max-w-[100px]">
                          ID: {p.id}
                        </span>
                      </div>
                    </div>
                  );
                })}

                <div
                  onClick={() => setShowCreateProfileModal(true)}
                  className="cursor-pointer border-2 border-dashed border-slate-800 hover:border-amber-400/60 bg-slate-950/40 hover:bg-slate-900/60 rounded-3xl p-5 flex flex-col items-center justify-center space-y-2 transition-all hover:scale-105 text-slate-400 hover:text-amber-300 shadow-lg"
                >
                  <div className="w-16 h-16 rounded-2xl border border-slate-700 flex items-center justify-center text-2xl font-bold">
                    ➕
                  </div>
                  <span className="font-bold text-xs">Crear Perfil</span>
                </div>
              </div>
            </div>

            {pinModalTarget && (
              <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">

                  <div className="w-14 h-14 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-2xl mx-auto shadow-inner">
                    {pinModalTarget.avatar || '🔒'}
                  </div>
                  
                  <div>

                      maxLength="8"
                      autoFocus
                      required

                      className={`w-full bg-slate-950 border text-center text-lg tracking-widest font-mono rounded-xl py-2 px-3 text-white focus:outline-none ${
                        pinError ? 'border-rose-500 ring-2 ring-rose-500/30' : 'border-slate-700 focus:border-indigo-400'
                      }`}
                    />

                      </span>

                    <div className="grid grid-cols-2 gap-2 pt-1">
                      <button

                        onClick={() => { setPinModalTarget(null); setPinEntered(''); setPinError(false); }}

                      >

                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {showCreateProfileModal && (

                      <input

                        required
                        placeholder="Ej: Sofía, Carlos, Papá..."

                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-400 text-xs"
                      />

                      <input

                          value={myPinConfirm}
                          onChange={(e) => setMyPinConfirm(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono text-xs focus:outline-none focus:border-indigo-400"
                        />
                      </div>
                    )}
                  </div>

                  {myPinError && (
                    <div className="text-[11px] text-rose-400 font-bold bg-rose-950/30 p-2 rounded-xl border border-rose-800/40">
                      {myPinError}
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowMyProfileModal(false)}
                      className="py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="py-2.5 bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 hover:to-indigo-500 text-white font-bold rounded-xl text-xs shadow-md"
                    >
                      Guardar Clave
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL DE ADMINISTRACIÓN DE PERFILES */}
          {showManageProfilesModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div className="glass-panel bg-slate-900 border border-slate-700 rounded-3xl p-5 sm:p-6 max-w-lg w-full space-y-5 shadow-2xl my-auto">
                
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">⚙️</span>
                    <div>
                      <h3 className="font-display font-extrabold text-base text-white">Panel de Administración General</h3>
                      <p className="text-[11px] text-slate-400">Control maestro de perfiles, PINs y accesos para Luis.</p>
                    </div>
                  </div>
                  <button onClick={() => setShowManageProfilesModal(false)} className="text-slate-400 hover:text-white text-xs font-bold p-1">✕</button>
                </div>

                {editingProfileData ? (
                  <form onSubmit={handleSaveEditedProfile} className="bg-slate-950 p-4 rounded-2xl border border-indigo-500/40 space-y-3 text-xs">
                    <div className="flex items-center justify-between">
                      <span className="font-bold text-indigo-300">Editando perfil: {editingProfileData.name}</span>
                      <button 
                        type="button" 
                        onClick={() => setEditingProfileData(null)}
                        className="text-[10px] text-slate-400 hover:text-white underline"
                      >
                        Cancelar
                      </button>
                    </div>

                    <div>
                      <label className="text-slate-300 font-bold block mb-1">Nombre visible:</label>
                      <input
                        type="text"
                        required
                        value={editingProfileData.name}
                        onChange={(e) => setEditingProfileData({ ...editingProfileData, name: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-white"
                      />
                    </div>

                    <div>
                      <label className="text-slate-300 font-bold block mb-1">Avatar:</label>
                      <div className="flex gap-1.5 overflow-x-auto py-1">
                        {AVAILABLE_AVATARS.map(av => (
                          <button
                            type="button"
                            key={av}
                            onClick={() => setEditingProfileData({ ...editingProfileData, avatar: av })}
                            className={`w-8 h-8 rounded-lg text-base flex items-center justify-center border transition-all ${
                              editingProfileData.avatar === av ? 'bg-indigo-600 border-indigo-300' : 'bg-slate-900 border-slate-800'
                            }`}
                          >
                            {av}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-slate-300 font-bold block mb-1">PIN / Contraseña de acceso:</label>
                      <input
                        type="text"
                        placeholder="Sin contraseña (dejar vacío)"
                        value={editingProfileData.pin || ''}
                        onChange={(e) => setEditingProfileData({ ...editingProfileData, pin: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-white font-mono"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2 pt-1">
                      <button
                        type="button"
                        onClick={() => setEditingProfileData(null)}
                        className="py-2 bg-slate-800 text-slate-300 rounded-xl font-bold"
                      >
                        Descartar
                      </button>
                      <button
                        type="submit"
                        className="py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold shadow-md"
                      >
                        Guardar Cambios
                      </button>
                    </div>
                  </form>
                ) : (
                  <div className="space-y-2.5 max-h-72 overflow-y-auto pr-1">
                    {profilesList.map(p => {
                      const isMainLuis = p.id === 'luis';
                      return (
                        <div key={p.id} className="bg-slate-950 p-3 rounded-2xl border border-slate-800 flex items-center justify-between gap-3 text-xs">
                          <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-slate-900 border border-slate-700 flex items-center justify-center text-xl">
                              {p.avatar || '🍿'}
                            </div>
                            <div>
                              <div className="flex items-center gap-1.5">
                                <span className="font-bold text-white">{p.name}</span>
                                {isMainLuis && (
                                  <span className="text-[9px] bg-amber-500/20 text-amber-300 px-1.5 py-0.2 rounded border border-amber-500/40">
                                    Principal
                                  </span>
                                )}
                              </div>
                              <span className="text-[10px] text-slate-400 font-mono block">
                                ID: {p.id} • {p.pin ? `🔒 PIN: ${p.pin}` : '🔓 Sin PIN'}
                              </span>
                            </div>
                          </div>

                          <div className="flex items-center gap-1.5 shrink-0">
                            <button
                              onClick={() => setEditingProfileData(p)}
                              className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-300 font-bold text-[11px]"
                            >
                              ✏️ Editar
                            </button>

                            {!isMainLuis && (
                              <button
                                onClick={() => handleDeleteProfile(p.id, p.name)}
                                className="px-2.5 py-1 rounded-lg bg-rose-950/40 hover:bg-rose-900/80 text-rose-300 border border-rose-800/40 font-bold text-[11px]"
                              >
                                🗑️
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                <div className="pt-2 border-t border-slate-800 flex justify-between items-center">
                  <button
                    onClick={() => { setShowManageProfilesModal(false); setShowCreateProfileModal(true); }}
                    className="text-xs bg-indigo-900/40 hover:bg-indigo-900/70 text-indigo-300 border border-indigo-500/30 px-3 py-1.5 rounded-xl font-bold"
                  >
                    ➕ Añadir Otro Perfil
                  </button>
                  <button
                    onClick={() => setShowManageProfilesModal(false)}
                    className="text-xs bg-slate-800 hover:bg-slate-700 text-white px-4 py-1.5 rounded-xl font-bold"
                  >
                    Cerrar
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* Modal Buscar Serie */}
          {showNewSeriesModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div className="glass-panel bg-slate-900 border border-slate-700 rounded-3xl p-5 sm:p-6 max-w-xl w-full space-y-4 shadow-2xl my-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-display font-extrabold text-base text-white">🔍 Buscar y Seguir Serie</h3>
                  <button onClick={() => setShowNewSeriesModal(false)} className="text-slate-400 hover:text-white text-xs font-bold p-1">✕</button>
                </div>

                <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 space-y-3 text-xs">
                  <div className="flex items-center justify-between">
                    <span className="text-slate-300 font-bold">Destino:</span>
                    <div className="flex bg-slate-900 p-1 rounded-xl">
                      <button
                        onClick={() => setAddDestination('tracking')}
                        className={`px-3 py-1 rounded-lg font-bold ${addDestination === 'tracking' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
                      >
                        📺 Mis Series
                      </button>
                      <button
                        onClick={() => setAddDestination('pending')}
                        className={`px-3 py-1 rounded-lg font-bold ${addDestination === 'pending' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}
                      >
                        📋 Pendientes
                      </button>
                    </div>
                  </div>

                  <div>
                    <span className="text-slate-400 font-bold block mb-1">Plataforma por defecto al añadir:</span>
                    <div className="grid grid-cols-4 gap-1.5">
                      {SUPPORTED_PLATFORMS.map(plat => (
                        <button
                          key={plat.id}
                          type="button"
                          onClick={() => setAddChosenPlatform(plat.name)}
                          className={`py-1.5 px-2 rounded-xl text-[10px] font-bold border transition-all flex items-center justify-center gap-1 ${
                            addChosenPlatform === plat.name
                              ? 'bg-indigo-600 border-indigo-300 text-white shadow'
                              : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-white'
                          }`}
                        >
                          <span>{plat.icon}</span>
                          <span className="truncate">{plat.name}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  {addDestination === 'pending' && (
                    <div className="flex items-center justify-between pt-2 border-t border-slate-900">
                      <span className="text-slate-400 font-bold">Prioridad:</span>
                      <div className="flex gap-1.5">
                        {['high', 'medium', 'low'].map(pr => (
                          <button
                            key={pr}
                            onClick={() => setAddPriority(pr)}
                            className={`px-2.5 py-0.5 rounded-lg font-bold border text-[11px] ${
                              addPriority === pr ? 'bg-slate-800 text-white border-amber-400' : 'bg-slate-900 text-slate-400 border-slate-800'
                            }`}
                          >
                            {pr === 'high' ? '🔴 Alta' : pr === 'medium' ? '🟡 Media' : '🟢 Baja'}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                <input
                  type="text"
                  placeholder="Ej: Ted Lasso, Severance, House of the Dragon..."
                  value={apiSearchQuery}
                  onChange={(e) => handleSearchApi(e.target.value)}
                  className="w-full bg-slate-950 border border-indigo-500/50 rounded-xl px-3 py-2.5 text-white text-xs shadow-inner"
                  autoFocus
                />

                <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                  {apiSearchResults.map(({ show }) => {
                    const poster = show.image?.medium || show.image?.original || DEFAULT_FALLBACK_POSTER;
                    const autoNetwork = show.webChannel?.name || show.network?.name || 'Streaming';
                    return (
                      <div key={show.id} className="flex items-center justify-between p-3 bg-slate-950/80 border border-slate-800 rounded-2xl gap-3">
                        <div className="flex items-center gap-3 min-w-0">
                          <img src={poster} alt={show.name} className="w-12 h-16 object-cover rounded-xl shrink-0" />
                          <div>
                            <h4 className="font-display font-bold text-white text-xs truncate">{show.name}</h4>
                            <span className="text-[10px] text-slate-400">
                              {show.premiered?.slice(0, 4) || 'Estreno'} • Detectada: <b className="text-cyan-300">{autoNetwork}</b>
                            </span>
                          </div>
                        </div>
                        <button 
                          disabled={isImportingDeep}
                          onClick={() => handleImportChosen({ show })} 
                          className={`font-bold text-[11px] px-3.5 py-2 rounded-xl transition-all shadow-md shrink-0 disabled:opacity-50 ${
                            addDestination === 'pending'
                              ? 'bg-amber-500 hover:bg-amber-400 text-slate-950 font-black'
                              : 'bg-indigo-600 hover:bg-indigo-500 text-white'
                          }`}
                        >
                          {isImportingDeep ? 'Inspeccionando...' : (addDestination === 'pending' ? '📋 A Pendientes' : '📺 Seguir Serie')}
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* Modal Alertas Correo */}
          {showEmailModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="glass-panel bg-slate-900 border border-slate-700 rounded-3xl p-5 sm:p-6 max-w-md w-full space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">✉️</span>
                    <h3 className="font-display font-extrabold text-base text-white">Alertas por Correo</h3>
                  </div>
                  <button onClick={() => setShowEmailModal(false)} className="text-slate-400 hover:text-white text-xs font-bold p-1">✕</button>
                </div>

                <div className="space-y-4 text-xs">
                  <div>
                    <label className="text-slate-300 font-bold block mb-1">Tu Correo Electrónico:</label>
                    <input
                      type="email"
                      placeholder="tu@correo.com"
                      value={emailConfig.email}
                      onChange={(e) => setEmailConfig(prev => ({ ...prev, email: e.target.value }))}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-400 text-xs"
                    />
                  </div>

                  <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 space-y-2">
                    <label className="flex items-center gap-2 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={emailConfig.alertNewEpisodes}
                        onChange={(e) => setEmailConfig(prev => ({ ...prev, alertNewEpisodes: e.target.checked }))}
                        className="w-4 h-4 rounded text-amber-500 bg-slate-900"
                      />
                      <span className="text-white">Avisar con nuevo capítulo en emisión</span>
                    </label>
                    <label className="flex items-center gap-2 cursor-pointer pt-1">
                      <input
                        type="checkbox"
                        checked={emailConfig.weeklyDigest}
                        onChange={(e) => setEmailConfig(prev => ({ ...prev, weeklyDigest: e.target.checked }))}
                        className="w-4 h-4 rounded text-amber-500 bg-slate-900"
                      />
                      <span className="text-white">Resumen semanal de novedades</span>
                    </label>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={() => { showBanner(`📧 Prueba configurada para ${emailConfig.email || 'tu correo'}`); }} className="bg-slate-800 hover:bg-slate-700 text-cyan-300 font-bold py-2 rounded-xl">
                      📨 Probar Envío
                    </button>
                    <button onClick={() => { showBanner('💾 Guardado'); setShowEmailModal(false); }} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2 rounded-xl">
                      ✓ Guardar
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-900 bg-slate-950/80 text-center py-4 text-xs text-slate-500 flex items-center justify-center gap-2">
            <span>CineRadar Pro &copy; 2026/2027 — Perfil activo: <b>{activeProfile.name}</b></span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
