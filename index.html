      today.setHours(0, 0, 0, 0);
      return target > today;

    const playChime = () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880.00, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    };

      const [syncStatusText, setSyncStatusText] = useState('Sincronizado con IMDb & TVMaze');

      // Modal de Búsqueda
      const [apiSearchQuery, setApiSearchQuery] = useState('');
      const [apiSearchResults, setApiSearchResults] = useState([]);
      const [isSearchingApi, setIsSearchingApi] = useState(false);
      const [modalTab, setModalTab] = useState('search');

      // Formulario Manual

      const [formImdbId, setFormImdbId] = useState('');
      const [formPlatform, setFormPlatform] = useState('Max (HBO)');

      const [formAirDay, setFormAirDay] = useState('Domingos');
      const [formAirTime, setFormAirTime] = useState('08:00 PM COT');
      const [formNextDate, setFormNextDate] = useState('');
      const [formCurrentSeason, setFormCurrentSeason] = useState('2');
      const [formNextSeason, setFormNextSeason] = useState('3');
      const [formPoster, setFormPoster] = useState('');
      const [formRating, setFormRating] = useState('8.5');

      useEffect(() => {

      useEffect(() => {

        } catch (e) {}
      }, [moviesList]);

      useEffect(() => {
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          setDeferredInstallPrompt(e);
        });

        if ('Notification' in window) {
          setNotificationPermission(Notification.permission);
        }

        // Sincronización automática de fechas oficiales al cargar la app
        syncLiveDatesFromApis();
      }, []);

      const showBanner = (msg) => {
        setBannerMessage(msg);
        playChime();
        setTimeout(() => setBannerMessage(null), 4500);
      };

      // MOTOR DE SINCRONIZACIÓN EN VIVO: Verifica si ya hay una fecha futura oficial
      const syncLiveDatesFromApis = async () => {
        setIsSyncingLive(true);
        setSyncStatusText('Consultando fechas oficiales en vivo...');
        
        try {
          let updatedCount = 0;
          const updatedSeries = await Promise.all(
            seriesList.map(async (series) => {
              if (!series.title) return series;
              try {
                const res = await fetch(`https://api.tvmaze.com/singlesearch/shows?q=${encodeURIComponent(series.title)}&embed[]=nextepisode&embed[]=previousepisode`);
                if (!res.ok) return series;
                const data = await res.json();

                const nextEp = data._embedded && data._embedded.nextepisode;
                const prevEp = data._embedded && data._embedded.previousepisode;

                // Si hay un próximo episodio fechado en el futuro
                if (nextEp && isDateInFuture(nextEp.airdate)) {
                  updatedCount++;
                  const daysDiff = (new Date(nextEp.airdate) - new Date()) / (1000 * 60 * 60 * 24);
                  const isWeekly = daysDiff <= 7;
                  
                  return {
                    ...series,
                    status: isWeekly ? 'airing_weekly' : 'waiting_season',
                    hasConfirmedFutureDate: true,
                    nextReleaseDate: nextEp.airdate,
                    currentSeason: nextEp.season,
                    nextSeasonNumber: nextEp.season,
                    currentEpisode: nextEp.number,
                    airDay: data.schedule && data.schedule.days && data.schedule.days[0] ? data.schedule.days[0] : series.airDay,
                    airTime: data.schedule && data.schedule.time ? `${data.schedule.time} COT` : series.airTime,
                    releaseSchedule: isWeekly 
                      ? `Nuevo episodio T${nextEp.season}E${nextEp.number} programado para el ${nextEp.airdate} (${series.airDay || 'Semanal'}).`
                      : `Próxima Temporada ${nextEp.season} confirmada oficialmente para el ${nextEp.airdate}.`
                  };
                }

                // Si NO hay próximo episodio fechado pero ya hubo episodios pasados
                if (prevEp) {
                  const lastSeasonNum = prevEp.season || series.currentSeason;
                  // Si no tiene fecha futura explícita guardada que sea válida
                  if (!isDateInFuture(series.nextReleaseDate)) {
                    return {
                      ...series,
                      status: 'waiting_season',
                      hasConfirmedFutureDate: false,
                      nextReleaseDate: null,
                      currentSeason: lastSeasonNum,
                      nextSeasonNumber: Math.max(series.nextSeasonNumber || (lastSeasonNum + 1), lastSeasonNum + 1),
                      releaseSchedule: `Temporada ${lastSeasonNum} concluida. Próxima entrega en producción; fecha oficial por anunciar.`
                    };
                  }
                }

                return series;
              } catch (err) {
                return series;
              }
            })
          );

          setSeriesList(updatedSeries);
          setSyncStatusText('✅ Fechas validadas con APIs oficiales');
          if (updatedCount > 0) {
            showBanner(`✨ ¡${updatedCount} series actualizadas con nuevas fechas oficiales!`);
          }
        } catch (e) {
          setSyncStatusText('Sincronizado');
        } finally {
          setIsSyncingLive(false);
        }
      };

      const handleInstallApp = async () => {

          }
          return s;

      const changeEpisode = (id, delta) => {

            const current = s.userProgressEpisode || 1;
            const nextEp = Math.max(1, current + delta);
            showBanner(`📺 ${s.title}: Capítulo ${nextEp}`);
            return { ...s, userProgressEpisode: nextEp };

      const changeSeason = (id, delta) => {

            const current = s.userProgressSeason || 1;

            return { ...s, userProgressSeason: nextSn, userProgressEpisode: 1 };

          return s;
        }));
      };

      const changeNextSeasonNumber = (id, delta) => {
        setSeriesList(prev => prev.map(s => {
          if (s.id === id) {
            const currentNext = s.nextSeasonNumber || (s.currentSeason + 1);
            const updatedNext = Math.max(1, currentNext + delta);
            showBanner(`🎯 ${s.title}: Esperando Temporada ${updatedNext}`);
            return {
              ...s,
              nextSeasonNumber: updatedNext,
              currentSeason: Math.max(1, updatedNext - 1)
            };
          }
          return s;
        }));
      };

      // Búsqueda en Vivo
      const handleSearchMultiSource = async (query) => {
        setApiSearchQuery(query);

        setIsSearchingApi(true);
        try {
          const res = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(query.trim())}`);

          setApiSearchResults(data || []);

      // Importar desde API con validación estricta de fechas
      const handleImportFromApi = async (item) => {
        const show = item.show;
        if (!show) return;

        let futureDate = null;
        let hasFuture = false;
        let currentSn = 1;
        let nextSn = 2;
        let isWeekly = false;

        try {
          const detailRes = await fetch(`https://api.tvmaze.com/shows/${show.id}?embed[]=nextepisode&embed[]=previousepisode`);
          if (detailRes.ok) {
            const detailData = await detailRes.json();
            const nextEp = detailData._embedded && detailData._embedded.nextepisode;
            const prevEp = detailData._embedded && detailData._embedded.previousepisode;

            if (nextEp && isDateInFuture(nextEp.airdate)) {
              futureDate = nextEp.airdate;
              hasFuture = true;
              currentSn = nextEp.season;
              nextSn = nextEp.season;
              const daysDiff = (new Date(nextEp.airdate) - new Date()) / (1000 * 60 * 60 * 24);
              isWeekly = daysDiff <= 7;
            } else if (prevEp) {
              currentSn = prevEp.season || 1;
              nextSn = currentSn + 1;
              hasFuture = false;
              futureDate = null;
            }
          }
        } catch (e) {}

        const platformName = show.webChannel ? show.webChannel.name : (show.network ? show.network.name : 'Streaming');
        const ratingVal = show.rating && show.rating.average ? show.rating.average : 8.2;
        const imdbCode = show.externals && show.externals.imdb ? show.externals.imdb : null;
        const posterUrl = show.image ? (show.image.original || show.image.medium) : DEFAULT_FALLBACK_POSTER;

        const newSeries = {
          id: 'tvmaze-' + show.id + '-' + Date.now(),
          tvmazeId: show.id,
          title: show.name,
          imdbId: imdbCode,
          imdbRating: ratingVal,
          platform: platformName,
          genres: show.genres && show.genres.length > 0 ? show.genres : ['Drama'],
          status: isWeekly ? 'airing_weekly' : 'waiting_season',
          currentSeason: currentSn,
          nextSeasonNumber: nextSn,
          nextReleaseDate: futureDate,
          hasConfirmedFutureDate: hasFuture,
          releaseSchedule: hasFuture 
            ? `Próximo estreno oficial confirmado para el ${futureDate}.`
            : `Temporada ${currentSn} concluida. En desarrollo; sin fecha oficial confirmada.`,
          airDay: show.schedule && show.schedule.days && show.schedule.days[0] ? show.schedule.days[0] : 'Viernes',
          airTime: show.schedule && show.schedule.time ? `${show.schedule.time} COT` : '02:00 AM COT',
          poster: posterUrl,
          userTracking: true,
          userProgressSeason: currentSn,
          userProgressEpisode: 1,
          notes: `Importado con ficha IMDb ${imdbCode || 'N/A'}.`
        };

        setSeriesList(prev => [newSeries, ...prev]);
        setShowNewSeriesModal(false);
        setApiSearchQuery('');
        setApiSearchResults([]);
        showBanner(`🎉 ¡"${show.name}" añadida a tu radar!`);
      };

      const myTrackedSeries = useMemo(() => seriesList.filter(s => s.userTracking), [seriesList]);
      const weeklyAiringSeries = useMemo(() => seriesList.filter(s => s.status === 'airing_weekly'), [seriesList]);
      const waitingSeasonsList = useMemo(() => seriesList.filter(s => s.status === 'waiting_season'), [seriesList]);

      const filteredExplore = useMemo(() => {
        return seriesList.filter(s => {
          const matchP = selectedPlatform === 'all' || s.platform.toLowerCase().includes(selectedPlatform.toLowerCase());
          const matchQ = s.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                         s.genres.some(g => g.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchP && matchQ;
        }).sort((a, b) => (b.imdbRating || b.rating || 0) - (a.imdbRating || a.rating || 0));
      }, [seriesList, selectedPlatform, searchQuery]);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans selection:bg-indigo-500 selection:text-white pb-24 sm:pb-10">

          <header className="sticky top-0 z-40 glass-panel border-b border-slate-800/80 px-4 sm:px-8 py-3 flex items-center justify-between">

                🎬
              </div>
              <div>
                <div className="flex items-center gap-2">

                <div className="flex items-center gap-2">
                  <span className="text-[11px] text-slate-400">{syncStatusText}</span>

                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all border ${
                  notificationPermission === 'granted'
                    ? 'bg-amber-500/20 text-amber-300 border-amber-500/50'
                    : 'bg-slate-900 hover:bg-slate-800 text-slate-300 border-slate-700'

              >
                🔔 <span className="hidden sm:inline">{notificationPermission === 'granted' ? 'Alertas Activas' : 'Activar Alertas'}</span>
              </button>

              <button
                onClick={() => setShowNewSeriesModal(true)}
                className="flex items-center gap-1.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all shadow-lg shadow-indigo-600/30"
              >
                🔍 <span>Buscar Serie</span>
              </button>
            </div>
          </header>

          {/* Banner Toast Flotante */}
          {bannerMessage && (
            <div className="fixed top-16 left-1/2 transform -translate-x-1/2 z-50 bg-gradient-to-r from-indigo-600 to-purple-600 text-white text-xs font-bold px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-2 border border-indigo-400 animate-bounce">
              <span>✨</span>
              <span>{bannerMessage}</span>

          {/* Barra de Navegación por Pestañas */}

                { id: 'today', label: 'Capítulos Hoy', icon: '⚡', count: weeklyAiringSeries.length },
                { id: 'tracking', label: 'Mis Series', icon: '📺', count: myTrackedSeries.length },

                    {tab.count !== undefined && (

                        {tab.count}
                      </span>

          </div>

          {/* Contenido Principal */}

            {/* VISTA 1: PRÓXIMAS TEMPORADAS (Con Validación Real de Fechas) */}
            {activeTab === 'seasons' && (
              <div className="space-y-4">
                <div className="bg-gradient-to-r from-purple-950/60 via-slate-900 to-slate-900 border border-purple-500/30 p-5 rounded-3xl space-y-1 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <h2 className="font-display font-extrabold text-base sm:text-lg text-white flex items-center gap-2">
                      ⏳ Radar de Próximas Temporadas ({waitingSeasonsList.length})

                    <p className="text-xs text-slate-300">
                      Temporadas anteriores finalizadas. Si el estudio no ha confirmado el día exacto de estreno, se marca automáticamente como pendiente.
                    </p>
                  </div>
                  <button

                                  {series.imdbId && (

                                    className="text-[10px] bg-slate-900 hover:bg-slate-800 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-lg font-bold transition-all"
                                  >
                                    ⚡ A Emisión
                                  </button>
                                  <div className="flex items-center bg-purple-950 border border-purple-500/40 rounded-lg px-1 py-0.5 text-[10px]">
                                    <span className="text-slate-400 pr-1">Próx:</span>
                                    <button onClick={() => changeNextSeasonNumber(series.id, -1)} className="px-1 font-bold text-purple-200 hover:text-white">-</button>
                                    <span className="font-mono px-1 text-amber-300 font-bold">T{series.nextSeasonNumber}</span>
                                    <button onClick={() => changeNextSeasonNumber(series.id, 1)} className="px-1 font-bold text-purple-200 hover:text-white">+</button>
                                  </div>
                                </div>
                              </div>
                            </div>

                            {/* Tarjeta de Fecha con Validación */}
                            <div className="bg-purple-950/40 p-3.5 rounded-2xl border border-purple-500/30 space-y-1.5">
                              <span className="text-[10px] font-bold text-purple-300 uppercase tracking-wider block">
                                🎯 Próxima Temporada {series.nextSeasonNumber}:
                              </span>

                              {hasRealFutureDate ? (
                                <div className="space-y-1">
                                  <div className="flex items-center gap-2">
                                    <span className="text-sm font-mono font-black text-amber-300 bg-amber-500/10 border border-amber-500/30 px-2.5 py-0.5 rounded-lg">
                                      📅 {series.nextReleaseDate}
                                    </span>
                                    <span className="text-[9px] font-bold text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded-md border border-emerald-500/30">
                                      Fecha Oficial
                                    </span>
                                  </div>
                                  <p className="text-xs text-slate-300">{series.releaseSchedule}</p>
                                </div>
                              ) : (
                                <div className="space-y-1">
                                  <div className="flex items-center gap-1.5">
                                    <span className="text-xs font-mono font-bold text-amber-200/80 bg-slate-900 border border-slate-700 px-2.5 py-1 rounded-lg flex items-center gap-1.5">
                                      ⏳ Sin fecha oficial confirmada
                                    </span>
                                  </div>
                                  <p className="text-xs text-slate-400 italic">
                                    {series.releaseSchedule}
                                  </p>
                                </div>
                              )}
                            </div>
                          </div>

                          <div className="grid grid-cols-2 gap-2">
                            <button
                              onClick={() => deleteSeriesCompletely(series.id, series.title)}
                              className="bg-rose-950/40 hover:bg-rose-900/80 text-rose-300 border border-rose-800/40 text-[11px] font-bold py-2 rounded-xl transition-all flex items-center justify-center gap-1"
                            >

                            </button>
                            <button
                              onClick={() => showBanner(`🔔 Alerta configurada para la Temporada ${series.nextSeasonNumber} de ${series.title}`)}
                              className="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-[11px] font-bold py-2 rounded-xl transition-all shadow-md flex items-center justify-center gap-1"
                            >
                              🔔 <span>Alerta T{series.nextSeasonNumber}</span>
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

            {/* VISTA 2: CAPÍTULOS HOY (Emisión Semanal) */}
            {activeTab === 'today' && (
              <div className="space-y-4">
                <div className="bg-gradient-to-r from-emerald-950/60 via-slate-900 to-slate-900 border border-emerald-500/30 p-5 rounded-3xl space-y-1">
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                    <h2 className="font-display font-extrabold text-base sm:text-lg text-white">
                      ⚡ Calendario de Emisión Semanal ({weeklyAiringSeries.length})
                    </h2>
                  </div>
                  <p className="text-xs text-slate-300">
                    Capítulos transmitidos semana a semana con día, hora exacta en Colombia (COT) y plataforma.

                {weeklyAiringSeries.length === 0 ? (

                              </div>
                              
                              <div className="grid grid-cols-2 gap-2">
                                <div className="flex items-center justify-between bg-slate-900 border border-slate-800 rounded-xl px-2 py-1">
                                  <span className="text-[10px] text-slate-400 font-bold">Temp:</span>
                                  <div className="flex items-center gap-1">
                                    <button onClick={() => changeSeason(series.id, -1)} className="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold">-</button>
                                    <span className="text-xs font-mono font-bold px-1">{series.userProgressSeason || 1}</span>
                                    <button onClick={() => changeSeason(series.id, 1)} className="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold">+</button>
                                  </div>
                                </div>

                                <div className="flex items-center justify-between bg-slate-900 border border-slate-800 rounded-xl px-2 py-1">
                                  <span className="text-[10px] text-slate-400 font-bold">Cap:</span>
                                  <div className="flex items-center gap-1">
                                    <button onClick={() => changeEpisode(series.id, -1)} className="w-6 h-6 rounded bg-indigo-900/60 hover:bg-indigo-800 text-indigo-200 text-xs font-bold">-</button>
                                    <span className="text-xs font-mono font-bold px-1">{series.userProgressEpisode || 1}</span>
                                    <button onClick={() => changeEpisode(series.id, 1)} className="w-6 h-6 rounded bg-indigo-900/60 hover:bg-indigo-800 text-indigo-200 text-xs font-bold">+</button>
                                  </div>
                                </div>
                              </div>
                            </div>

                            <p className="text-xs text-slate-300">{series.releaseSchedule}</p>
                          </div>
                        </div>

                        <div className="p-4 pt-0 grid grid-cols-2 gap-2">
                          <button
                            onClick={() => toggleTracking(series.id)}
                            className="flex items-center justify-center gap-1 py-2 px-2 rounded-xl text-[11px] font-bold bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 transition-all"
                          >
                            👁️ <span>Ocultar</span>
                          </button>
                          <button
                            onClick={() => deleteSeriesCompletely(series.id, series.title)}
                            className="flex items-center justify-center gap-1 py-2 px-2 rounded-xl text-[11px] font-bold bg-rose-950/40 hover:bg-rose-900/80 text-rose-300 border border-rose-800/50 transition-all"
                          >
                            🗑️ <span>Eliminar</span>
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* VISTA 4: ESTRENOS DE CINE */}
            {activeTab === 'movies' && (
              <div className="space-y-4">
                <div className="bg-gradient-to-r from-red-950/60 via-slate-900 to-slate-900 border border-red-500/30 p-5 rounded-3xl space-y-1">
                  <h2 className="font-display font-extrabold text-base sm:text-lg text-white flex items-center gap-2">
                    🍿 Radar de Estrenos de Cine & Trailers Oficiales ({moviesList.length})
                  </h2>
                  <p className="text-xs text-slate-300">
                    Películas más esperadas con fecha de estreno y acceso directo al trailer oficial en YouTube.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {moviesList.map(movie => (
                    <div key={movie.id} className="glass-panel card-hover rounded-3xl overflow-hidden border border-slate-800 flex flex-col justify-between">
                      <div>
                        <div className="relative h-64 w-full bg-slate-900">
                          <img
                            src={movie.poster}
                            alt={movie.title}
                            className="w-full h-full object-cover object-top"
                            loading="lazy"
                            onError={(e) => { e.target.src = movie.fallbackPoster || DEFAULT_FALLBACK_POSTER; }}
                          />
                          <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
                          
                          <div className="absolute top-3 left-3 bg-red-600 text-white font-black text-[10px] px-2.5 py-1 rounded-full uppercase tracking-wider shadow-md">
                            Estreno Cine
                          </div>

                          <button
                            onClick={() => deleteMovieCompletely(movie.id, movie.title)}
                            className="absolute top-3 right-3 bg-slate-950/80 hover:bg-rose-900 text-rose-300 p-1.5 rounded-xl border border-rose-500/30 text-xs shadow-md transition-all"
                          >
                            🗑️
                          </button>

                          <div className="absolute bottom-3 left-3 right-3">
                            <span className="text-[10px] text-red-400 font-mono font-bold block">{movie.genre}</span>
                            <h3 className="font-display font-extrabold text-base sm:text-lg text-white">{movie.title}</h3>
                          </div>
                        </div>

                        <div className="p-4 space-y-3">
                          <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 space-y-1">
                            <span className="text-[10px] text-slate-400 font-bold block uppercase">Fecha de Estreno en Salas:</span>
                            <span className="text-sm font-mono font-extrabold text-amber-300 block">
                              📅 {movie.releaseDate}
                            </span>
                          </div>

                          <p className="text-xs text-slate-300 leading-relaxed">
                            {movie.synopsis}
                          </p>
                        </div>
                      </div>

                      <div className="p-4 pt-0">
                        <a
                          href={movie.youtubeUrl}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="w-full bg-gradient-to-r from-red-600 to-rose-700 hover:from-red-500 hover:to-rose-600 text-white font-bold py-2.5 px-3 rounded-xl text-xs transition-all shadow-lg flex items-center justify-center gap-1.5 active:scale-95"
                        >
                          ▶ <span>Ver Trailer en YouTube</span> ↗
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VISTA 5: TOP CALIFICADAS */}
            {activeTab === 'explore' && (
              <div className="space-y-5">
                <div className="glass-panel p-4 rounded-3xl border border-slate-800 space-y-3">
                  <div className="flex flex-col sm:flex-row items-center justify-between gap-3">
                    <div className="relative w-full sm:w-80">
                      <input
                        type="text"
                        placeholder="Buscar en catálogo..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                      />
                      <div className="absolute left-3 top-2.5 text-slate-400">🔍</div>
                    </div>

                    <div className="flex flex-wrap gap-1.5 w-full sm:w-auto">
                      {PLATFORMS.map(p => (
                        <button
                          key={p.id}
                          onClick={() => setSelectedPlatform(p.id)}
                          className={`text-xs px-3 py-1.5 rounded-xl font-bold border transition-all ${
                            selectedPlatform === p.id 
                              ? 'bg-indigo-600 text-white border-indigo-400 shadow-md' 
                              : 'bg-slate-950/80 text-slate-400 border-slate-800 hover:text-white'
                          }`}
                        >
                          {p.name}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                  {filteredExplore.map(series => (
                    <div key={series.id} className="glass-panel card-hover rounded-3xl overflow-hidden border border-slate-800 flex flex-col justify-between">
                      <div>
                        <div className="relative h-64 w-full bg-slate-900">
                          <img
                            src={series.poster}
                            alt={series.title}
                            className="w-full h-full object-cover object-top"
                            loading="lazy"
                            onError={(e) => { e.target.src = DEFAULT_FALLBACK_POSTER; }}
                          />
                          <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent"></div>

                          <div className="absolute top-3 right-3 bg-amber-400 text-slate-950 font-black text-xs px-2.5 py-1 rounded-xl shadow-md">
                            ★ {series.imdbRating || 8.0}
                          </div>

                          <div className="absolute top-3 left-3">
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-slate-950/80 backdrop-blur text-white border border-white/10">
                              {series.platform}
                            </span>
                          </div>

                          <div className="absolute bottom-2 left-3 right-3">
                            <h3 className="font-display font-extrabold text-sm text-white">{series.title}</h3>
                          </div>
                        </div>

                        <div className="p-3.5 space-y-2 text-xs">
                          <p className="text-[11px] text-slate-300 line-clamp-2">
                            {series.releaseSchedule}
                          </p>
                        </div>
                      </div>

                      <div className="p-3.5 pt-0 grid grid-cols-3 gap-1.5">
                        <button
                          onClick={() => toggleTracking(series.id)}
                          className={`col-span-2 py-2 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1 ${
                            series.userTracking 
                              ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' 
                              : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-md'
                          }`}
                        >
                          <span>{series.userTracking ? '✓ Siguiendo' : '➕ Seguir'}</span>
                        </button>
                        <button
                          onClick={() => deleteSeriesCompletely(series.id, series.title)}
                          className="col-span-1 py-2 rounded-xl text-xs font-bold bg-rose-950/40 hover:bg-rose-900/80 text-rose-300 border border-rose-800/40 flex items-center justify-center"
                        >
                          🗑️
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* Modal de Búsqueda Online */}
          {showNewSeriesModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div className="glass-panel bg-slate-900 border border-slate-700 rounded-3xl p-5 sm:p-6 max-w-lg w-full space-y-4 shadow-2xl my-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🔍</span>
                    <h3 className="font-display font-extrabold text-base text-white">
                      Buscador de Series (IMDb + TVMaze)
                    </h3>
                  </div>
                  <button
                    onClick={() => {
                      setShowNewSeriesModal(false);
                      setApiSearchQuery('');
                      setApiSearchResults([]);
                    }}
                    className="text-slate-400 hover:text-white text-xs font-bold p-1 bg-slate-800 rounded-lg"
                  >
                    ✕ Cerrar
                  </button>
                </div>

                <div className="space-y-4 text-xs">
                  <div className="space-y-1">
                    <label className="text-slate-300 font-bold block">
                      Escribe el nombre de la serie:
                    </label>
                    <div className="relative">
                      <input
                        type="text"
                        placeholder="Ej: House of the Dragon, The Last of Us, Slow Horses..."
                        value={apiSearchQuery}
                        onChange={(e) => handleSearchMultiSource(e.target.value)}
                        className="w-full bg-slate-950 border border-indigo-500/50 rounded-xl pl-9 pr-3 py-2.5 text-white focus:outline-none focus:border-indigo-400 text-xs shadow-inner"
                        autoFocus
                      />
                      <div className="absolute left-3 top-3 text-slate-400">🔍</div>
                      {isSearchingApi && (
                        <div className="absolute right-3 top-3 text-indigo-400 animate-spin">⏳</div>
                      )}
                    </div>
                  </div>

                  <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                    {apiSearchResults.length > 0 ? (
                      apiSearchResults.map(({ show }) => {
                        const poster = show.image ? (show.image.medium || show.image.original) : DEFAULT_FALLBACK_POSTER;
                        const platform = show.webChannel ? show.webChannel.name : (show.network ? show.network.name : 'Streaming');
                        const rating = show.rating && show.rating.average ? show.rating.average : '8.0';

                        return (
                          <div
                            key={show.id}
                            className="flex items-center justify-between p-2.5 bg-slate-950/80 hover:bg-slate-800/80 border border-slate-800 rounded-2xl transition-all gap-3"
                          >
                            <img
                              src={poster}
                              alt={show.name}
                              className="w-12 h-16 object-cover rounded-xl shrink-0 border border-slate-700"
                              onError={(e) => { e.target.src = DEFAULT_FALLBACK_POSTER; }}
                            />
                            <div className="flex-1 min-w-0">
                              <h4 className="font-display font-bold text-white text-xs truncate">{show.name}</h4>
                              <div className="flex items-center gap-1.5 text-[10px] text-slate-400 pt-0.5">
                                <span className="text-indigo-400 font-bold">{platform}</span>
                                <span>•</span>
                                <span className="text-amber-400 font-mono">★ {rating}</span>
                              </div>
                            </div>
                            <button
                              onClick={() => handleImportFromApi({ show })}
                              className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-[11px] px-3 py-1.5 rounded-xl shrink-0 transition-all shadow-md"
                            >
                              ➕ Seguir
                            </button>
                          </div>
                        );
                      })
                    ) : apiSearchQuery.trim().length >= 2 ? (
                      <div className="text-center py-6 text-slate-500 text-xs">
                        No se encontraron resultados para "{apiSearchQuery}".
                      </div>
                    ) : (
                      <div className="text-center py-6 text-slate-500 text-xs">
                        Escribe el título de cualquier serie para buscar en vivo.
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-900 bg-slate-950/80 text-center py-4 text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-center gap-2">
            <span>CineRadar Pro &copy; {new Date().getFullYear()} — Correlación IMDb & TVMaze.</span>
            <button onClick={restoreDefaults} className="text-indigo-400 hover:underline">Restaurar catálogo inicial</button>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
