  <!-- Firebase Cloud Sync Bridge -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'cineradar-pro';
    
    window.CineRadarCloud = {
      isReady: false,
      auth: null,
      db: null,
      saveUserData: null,
      subscribeUserData: null
    };

    try {
      if (typeof __firebase_config !== 'undefined') {
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        window.CineRadarCloud.auth = auth;
        window.CineRadarCloud.db = db;

        const authPromise = typeof __initial_auth_token !== 'undefined' && __initial_auth_token
          ? signInWithCustomToken(auth, __initial_auth_token)
          : signInAnonymously(auth);

        authPromise.then(async () => {
          window.CineRadarCloud.isReady = true;

          // Guardado en Firestore bajo la ruta del usuario específico
          window.CineRadarCloud.saveUserData = async (data, profileId) => {
            if (!auth.currentUser || !profileId) return;
            try {
              const docRef = doc(db, 'artifacts', appId, 'users', profileId, 'library', 'current');
              await setDoc(docRef, {
                series: JSON.stringify(data.series || []),
                pending: JSON.stringify(data.pending || []),
                historic: JSON.stringify(data.historic || []),
                year: JSON.stringify(data.year || []),
                movies: JSON.stringify(data.movies || []),
                emailConfig: JSON.stringify(data.emailConfig || {}),
                profileName: data.profileName || 'Mi Perfil',
                profileAvatar: data.profileAvatar || '🍿',
                updatedAt: new Date().toISOString(),
                updatedBy: profileId
              }, { merge: true });
            } catch (err) {
              console.warn("Cloud save warning:", err);
            }
          };

          // Escucha en tiempo real de cambios en la nube
          window.CineRadarCloud.subscribeUserData = (profileId, callback) => {
            if (!auth.currentUser || !profileId) return () => {};
            try {
              const docRef = doc(db, 'artifacts', appId, 'users', profileId, 'library', 'current');
              return onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                  const cloudData = snapshot.data();
                  callback({
                    series: cloudData.series ? JSON.parse(cloudData.series) : null,
                    pending: cloudData.pending ? JSON.parse(cloudData.pending) : null,
                    historic: cloudData.historic ? JSON.parse(cloudData.historic) : null,
                    year: cloudData.year ? JSON.parse(cloudData.year) : null,
                    movies: cloudData.movies ? JSON.parse(cloudData.movies) : null,
                    emailConfig: cloudData.emailConfig ? JSON.parse(cloudData.emailConfig) : null,
                    profileName: cloudData.profileName,
                    profileAvatar: cloudData.profileAvatar,
                    updatedAt: cloudData.updatedAt
                  });
                }
              }, (error) => {
                console.warn("Snapshot notice:", error);
              });
            } catch (err) {
              console.warn("Subscribe notice:", err);
              return () => {};
            }
          };

          window.dispatchEvent(new CustomEvent('cineradar-cloud-ready'));
        }).catch(err => {
          console.warn("Auth warning:", err);
        });
      }
    } catch (e) {
      console.warn("Cloud init notice:", e);
    }
  </script>

    const playChime = () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880.00, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    };

      // Guardar perfiles en localStorage
      useEffect(() => {
        try {
          localStorage.setItem('cineradar_registered_profiles_v15', JSON.stringify(profilesList));
        } catch (e) {}
      }, [profilesList]);

      const showBanner = (msg) => {
        setBannerMessage(msg);
        playChime();
        setTimeout(() => setBannerMessage(null), 4000);
      };

      // Cargar datos locales cuando se activa un perfil
      const loadProfileData = (profile) => {
        if (!profile) return;
        try {
          const prefix = `cineradar_usr_${profile.id}_`;
          const savedSeries = localStorage.getItem(prefix + 'series');
          const savedPending = localStorage.getItem(prefix + 'pending');
          const savedEmail = localStorage.getItem(prefix + 'email');
          
          if (savedSeries) setSeriesList(JSON.parse(savedSeries));
          else setSeriesList(INITIAL_TRACKED_CATALOG);

          if (savedPending) setPendingList(JSON.parse(savedPending));
          else setPendingList(INITIAL_PENDING_CATALOG);

          if (savedEmail) setEmailConfig(JSON.parse(savedEmail));
        } catch (e) {}
      };

      // Suscribir el perfil activo a Firestore en la nube
      useEffect(() => {
        if (!activeProfile) return;

        loadProfileData(activeProfile);

        if (cloudUnsubRef.current) {
          cloudUnsubRef.current();
        }

        if (window.CineRadarCloud && window.CineRadarCloud.subscribeUserData) {
          cloudUnsubRef.current = window.CineRadarCloud.subscribeUserData(activeProfile.id, (cloudData) => {
            if (cloudData) {
              isRemoteUpdateRef.current = true;
              if (cloudData.series) setSeriesList(cloudData.series);
              if (cloudData.pending) setPendingList(cloudData.pending);
              if (cloudData.emailConfig) setEmailConfig(cloudData.emailConfig);
              setSyncStatusText(`☁️ Sincronizado (${activeProfile.name})`);
              setTimeout(() => { isRemoteUpdateRef.current = false; }, 400);
            }
          });
        }

        return () => {
          if (cloudUnsubRef.current) cloudUnsubRef.current();
        };
      }, [activeProfile?.id]);

      // Guardar cambios tanto localmente como en la nube
      useEffect(() => {
        if (!activeProfile) return;

        const prefix = `cineradar_usr_${activeProfile.id}_`;
        try {
          localStorage.setItem(prefix + 'series', JSON.stringify(seriesList));
          localStorage.setItem(prefix + 'pending', JSON.stringify(pendingList));
          localStorage.setItem(prefix + 'email', JSON.stringify(emailConfig));

          if (!isRemoteUpdateRef.current && window.CineRadarCloud && window.CineRadarCloud.saveUserData) {
            window.CineRadarCloud.saveUserData({
              series: seriesList,
              pending: pendingList,
              historic: historicList,
              year: yearList,
              movies: moviesList,
              emailConfig: emailConfig,
              profileName: activeProfile.name,
              profileAvatar: activeProfile.avatar
            }, activeProfile.id);
          }
        } catch (e) {}
      }, [seriesList, pendingList, emailConfig, activeProfile]);

      // Búsqueda de nuevos trailers al iniciar
      const fetchFreshMovieTrailers = async () => {
        try {
          const queries = ['Star Wars', 'Marvel', 'Denis Villeneuve', 'Christopher Nolan', 'Avatar'];
          const randomQuery = queries[Math.floor(Math.random() * queries.length)];
          const res = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(randomQuery)}`);
          if (!res.ok) return;
          const data = await res.json();

          if (Array.isArray(data) && data.length > 0) {
            const newlyDiscovered = [];
            data.slice(0, 2).forEach(({ show }) => {
              if (!show || !show.name) return;
              const exists = moviesList.some(m => m.title.toLowerCase() === show.name.toLowerCase());
              if (!exists) {
                newlyDiscovered.push({
                  id: 'auto-mov-' + show.id + '-' + Date.now(),
                  title: show.name + ' (Nuevo Estreno)',
                  year: 2026,
                  month: 11,
                  monthName: 'Noviembre',
                  releaseDate: '2026-11-20',
                  genre: (show.genres && show.genres.join(' / ')) || 'Cine / Aventura',
                  poster: show.image ? (show.image.original || show.image.medium) : DEFAULT_FALLBACK_POSTER,
                  youtubeUrl: `https://www.youtube.com/results?search_query=${encodeURIComponent(show.name + ' official trailer')}`,
                  synopsis: show.summary ? show.summary.replace(/<[^>]*>?/gm, '').slice(0, 140) + '...' : 'Nuevo estreno cinemático programado.'
                });
              }
            });

            if (newlyDiscovered.length > 0) {
              setMoviesList(prev => [...newlyDiscovered, ...prev]);
            }
          }
        } catch (err) {}
      };

      useEffect(() => {
        fetchFreshMovieTrailers();
      }, []);

      // Manejador para seleccionar perfil desde la pantalla inicial
      const handleSelectProfile = (profile) => {
        setActiveProfile(profile);
        localStorage.setItem('cineradar_current_session_profile', JSON.stringify(profile));
        showBanner(`👋 ¡Bienvenido, ${profile.name}!`);
      };

      // Manejador para salir del perfil y volver a "¿Quién está viendo?"
      const handleExitProfile = () => {
        setActiveProfile(null);
        localStorage.removeItem('cineradar_current_session_profile');
      };

      // Crear nuevo perfil
      const handleCreateProfile = (e) => {
        e.preventDefault();
        if (!newProfileName.trim()) return;

        // Si el usuario especifica un código (ej. "luis2026"), se usa ese ID para que en el celular ponga el mismo
        const cleanId = newProfileCode.trim() 
          ? 'sync-' + newProfileCode.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '')
          : 'perfil-' + Date.now().toString(36);

        const newProfile = {
          id: cleanId,
          name: newProfileName.trim(),
          avatar: newProfileAvatar || '🍿',
          pin: newProfileCode.trim() || 'General'
        };

        setProfilesList(prev => {
          const filtered = prev.filter(p => p.id !== cleanId);
          return [...filtered, newProfile];
        });

        setNewProfileName('');
        setNewProfileCode('');
        setShowCreateProfileModal(false);
        handleSelectProfile(newProfile);
      };

      const handleSendTestEmail = () => {
        if (!emailConfig.email || !emailConfig.email.includes('@')) {
          showBanner('⚠️ Ingresa un correo electrónico válido');
          return;
        }

        const airingShows = seriesList.filter(s => s.status === 'airing_weekly').map(s => `• ${s.title} (${s.airDay || 'Semanal'} - ${s.platform})`).join('\n');
        const mailSubject = encodeURIComponent(`CineRadar Pro: Novedades semanales para ${activeProfile?.name}`);
        const mailBody = encodeURIComponent(
          `¡Hola ${activeProfile?.name}!\n\nAquí tienes tus alertas activas de CineRadar:\n\nSeries en Emisión Semanal:\n${airingShows || 'Ninguna actualmente'}\n\nTienes ${pendingList.length} series en tu lista de Pendientes.\n\nSincronizado entre tu celular y tu PC.`
        );
        window.open(`mailto:${emailConfig.email}?subject=${mailSubject}&body=${mailBody}`, '_blank');
        showBanner(`📧 Correo de prueba preparado para ${emailConfig.email}`);
      };

      const handleImportChosen = (item) => {
        const show = item.show;
        if (!show) return;

        const platformName = show.webChannel ? show.webChannel.name : (show.network ? show.network.name : 'Streaming');
        const ratingVal = show.rating && show.rating.average ? show.rating.average : 8.2;
        const posterUrl = show.image ? (show.image.original || show.image.medium) : DEFAULT_FALLBACK_POSTER;

        if (addDestination === 'pending') {
          const newPending = {
            id: 'pend-' + Date.now(),
            title: show.name,
            platform: platformName,
            priority: addPriority,
            genres: show.genres && show.genres.length > 0 ? show.genres : ['Drama'],
            imdbRating: ratingVal,
            poster: posterUrl,
            notes: 'Guardada en pendientes.'
          };
          setPendingList(prev => [newPending, ...prev]);
          showBanner(`📋 "${show.name}" añadida a Pendientes (${addPriority.toUpperCase()})`);
        } else {
          const newSeries = {
            id: 'tvmaze-' + show.id + '-' + Date.now(),
            tvmazeId: show.id,
            title: show.name,
            imdbId: show.externals?.imdb || null,
            imdbRating: ratingVal,
            platform: platformName,
            genres: show.genres && show.genres.length > 0 ? show.genres : ['Drama'],
            status: 'waiting_season',
            currentSeason: 1,
            nextSeasonNumber: 2,
            nextReleaseDate: null,
            hasConfirmedFutureDate: false,
            releaseSchedule: 'Agregada a tu radar de seguimiento.',
            airDay: show.schedule?.days?.[0] || 'Viernes',
            airTime: show.schedule?.time ? `${show.schedule.time} COT` : '02:00 AM COT',
            poster: posterUrl,
            userTracking: true,
            userProgressSeason: 1,
            userProgressEpisode: 1,
            notes: `Ficha IMDb ${show.externals?.imdb || 'N/A'}.`
          };
          setSeriesList(prev => [newSeries, ...prev]);
          showBanner(`📺 "${show.name}" agregada a Mis Series`);
        }

        setShowNewSeriesModal(false);
        setApiSearchQuery('');
        setApiSearchResults([]);
      };

      const promotePendingToTracking = (item) => {
        setPendingList(prev => prev.filter(p => p.id !== item.id));
        const newSeries = {
          id: 'ser-' + Date.now(),
          title: item.title,
          platform: item.platform || 'Streaming',
          genres: item.genres || ['Drama'],
          status: 'waiting_season',
          currentSeason: 1,
          nextSeasonNumber: 2,
          nextReleaseDate: null,
          hasConfirmedFutureDate: false,
          releaseSchedule: 'Añadida desde tu lista de Pendientes.',
          airDay: 'Viernes',
          airTime: '02:00 AM COT',
          poster: item.poster,
          userTracking: true,
          userProgressSeason: 1,
          userProgressEpisode: 1,
          notes: item.notes || 'Iniciada desde pendientes.'
        };
        setSeriesList(prev => [newSeries, ...prev]);
        showBanner(`🎉 "${item.title}" movida a Mis Series`);
      };

      const handleSearchApi = async (query) => {
        setApiSearchQuery(query);
        if (!query || query.trim().length < 2) {
          setApiSearchResults([]);
          return;
        }
        setIsSearchingApi(true);
        try {
          const res = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(query.trim())}`);
          const data = await res.json();
          setApiSearchResults(data || []);
        } catch (err) {
          setApiSearchResults([]);
        } finally {
          setIsSearchingApi(false);
        }
      };

      const toggleSeriesStatus = (id) => {
        setSeriesList(prev => prev.map(s => {
          if (s.id === id) {
            const nextStatus = s.status === 'airing_weekly' ? 'waiting_season' : 'airing_weekly';
            showBanner(`🔄 "${s.title}": ${nextStatus === 'airing_weekly' ? '⚡ En Emisión' : '⏳ Esperando Temporada'}`);
            return {
              ...s,
              status: nextStatus,
              releaseSchedule: nextStatus === 'airing_weekly'
                ? `Nuevo episodio cada ${s.airDay || 'Viernes'} a las ${s.airTime || '02:00 AM COT'} por ${s.platform}.`
                : `Temporada concluida. Próxima Temporada ${s.nextSeasonNumber || (s.currentSeason + 1)} en espera.`
            };
          }
          return s;
        }));
      };

      const changeEpisode = (id, delta) => {
        setSeriesList(prev => prev.map(s => {
          if (s.id === id) {
            const current = s.userProgressEpisode || 1;
            const nextEp = Math.max(1, current + delta);
            return { ...s, userProgressEpisode: nextEp };
          }
          return s;
        }));
      };

      const changeSeason = (id, delta) => {
        setSeriesList(prev => prev.map(s => {
          if (s.id === id) {
            const current = s.userProgressSeason || 1;
            const nextSn = Math.max(1, current + delta);
            return { ...s, userProgressSeason: nextSn, userProgressEpisode: 1 };
          }
          return s;
        }));
      };

      const myTrackedSeries = useMemo(() => {
        return seriesList.filter(s => s.userTracking);
      }, [seriesList]);

      const filteredPendingList = useMemo(() => {
        return pendingList.filter(p => {
          if (pendingPriorityFilter === 'all') return true;
          return p.priority === pendingPriorityFilter;
        });
      }, [pendingList, pendingPriorityFilter]);

      const weeklyAiringSeries = useMemo(() => seriesList.filter(s => s.status === 'airing_weekly'), [seriesList]);
      const waitingSeasonsList = useMemo(() => seriesList.filter(s => s.status === 'waiting_season'), [seriesList]);

      const currentRankingSource = topRankingType === 'historic' ? historicList : yearList;
      const filteredRankings = useMemo(() => {
        return currentRankingSource.filter(item => {
          const matchP = selectedPlatform === 'all' || item.platform.toLowerCase().includes(selectedPlatform.toLowerCase());
          const matchQ = item.title.toLowerCase().includes(searchQuery.toLowerCase());
          return matchP && matchQ;
        });
      }, [currentRankingSource, selectedPlatform, searchQuery]);

      // ==========================================
      // 1. PANTALLA PREVIA: ¿QUIÉN ESTÁ VIENDO?
      // ==========================================
      if (!activeProfile) {
        return (
          <div className="min-h-screen bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 text-white flex flex-col items-center justify-center p-6 select-none font-sans">
            <div className="max-w-xl w-full space-y-8 text-center">
              
              <div className="space-y-2">
                <div className="w-16 h-16 rounded-3xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center text-3xl mx-auto shadow-2xl shadow-indigo-500/30">
                  🎬
                </div>
                <h1 className="font-display font-black text-3xl sm:text-4xl tracking-tight text-white">
                  CineRadar Pro
                </h1>
                <p className="text-slate-400 text-sm">
                  ¿Quién está viendo hoy? Selecciona tu perfil o ingresa tu código de sincronización.
                </p>
              </div>

              {/* Tarjetas de Perfiles */}
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 pt-2">
                {profilesList.map(p => (
                  <div
                    key={p.id}
                    onClick={() => handleSelectProfile(p)}
                    className="group cursor-pointer bg-slate-900/80 hover:bg-slate-800 border border-slate-800 hover:border-indigo-500/60 rounded-3xl p-5 flex flex-col items-center space-y-3 transition-all duration-200 hover:scale-105 shadow-lg"
                  >
                    <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-slate-800 to-slate-700 flex items-center justify-center text-3xl shadow-inner border border-white/10 group-hover:border-indigo-400 transition-colors">
                      {p.avatar || '🍿'}
                    </div>
                    <div className="space-y-0.5">
                      <span className="font-display font-bold text-sm text-white block group-hover:text-indigo-300">
                        {p.name}
                      </span>
                      <span className="text-[10px] font-mono text-slate-500 block truncate max-w-[120px]">
                        ID: {p.id.replace('sync-', '').replace('perfil-', '')}
                      </span>
                    </div>
                  </div>
                ))}

                {/* Botón Añadir Perfil */}
                <div
                  onClick={() => setShowCreateProfileModal(true)}
                  className="cursor-pointer border-2 border-dashed border-slate-800 hover:border-amber-400/60 bg-slate-950/40 hover:bg-slate-900/60 rounded-3xl p-5 flex flex-col items-center justify-center space-y-2 transition-all hover:scale-105 text-slate-400 hover:text-amber-300"
                >
                  <div className="w-16 h-16 rounded-2xl border border-slate-700 flex items-center justify-center text-2xl font-bold">
                    ➕
                  </div>
                  <span className="font-bold text-xs">Crear Perfil</span>
                </div>
              </div>

              {/* Explicación rápida de cómo sincronizar PC y Celular */}
              <div className="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 text-xs text-slate-400 text-left space-y-2">
                <div className="flex items-center justify-between">
                  <span className="font-bold text-cyan-300 flex items-center gap-1.5">
                    <span>☁️</span> ¿Cómo sincronizar entre tu PC y tu Celular?
                  </span>
                  <button
                    onClick={() => setShowCloudInfoModal(true)}
                    className="text-amber-400 hover:underline text-[11px] font-bold"
                  >
                    Ver detalles ↗
                  </button>
                </div>
                <p className="text-[11px] leading-relaxed">
                  Para que tu celular y tu PC compartan la misma lista de series, crea o vincula tu perfil con el <b>mismo Código/PIN</b> en ambos dispositivos. Todo lo que marques en uno se reflejará automáticamente en el otro.
                </p>
              </div>

            </div>

            {/* Modal Crear Perfil */}
            {showCreateProfileModal && (
              <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
                <div className="bg-slate-900 border border-slate-700 rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                    <h3 className="font-bold text-white text-base">Crear Nuevo Perfil</h3>
                    <button onClick={() => setShowCreateProfileModal(false)} className="text-slate-400 hover:text-white font-bold text-xs p-1">✕</button>
                  </div>

                  <form onSubmit={handleCreateProfile} className="space-y-3.5 text-xs">
                    <div>
                      <label className="text-slate-300 font-bold block mb-1">Nombre (tuyo, hermano o amigo):</label>
                      <input
                        type="text"
                        required
                        placeholder="Ej: Carlos, Sofía, Andrés..."
                        value={newProfileName}
                        onChange={(e) => setNewProfileName(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-400 text-xs"
                      />
                    </div>

                    <div>
                      <label className="text-slate-300 font-bold block mb-1">Elige un Avatar:</label>
                      <div className="flex gap-2 overflow-x-auto py-1">
                        {AVAILABLE_AVATARS.map(av => (
                          <button
                            type="button"
                            key={av}
                            onClick={() => setNewProfileAvatar(av)}
                            className={`w-9 h-9 rounded-xl text-lg flex items-center justify-center border transition-all ${
                              newProfileAvatar === av ? 'bg-indigo-600 border-indigo-300 scale-110' : 'bg-slate-950 border-slate-800'
                            }`}
                          >
                            {av}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-slate-300 font-bold block mb-1">Código o PIN para sincronizar (Opcional):</label>
                      <input
                        type="text"
                        placeholder="Ej: familia2026 (úsalo igual en PC y celular)"
                        value={newProfileCode}
                        onChange={(e) => setNewProfileCode(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono focus:outline-none focus:border-amber-400 text-xs"
                      />
                      <span className="text-[10px] text-slate-500 block pt-1">
                        Si pones el mismo código en tu teléfono, se cargarán las mismas series.
                      </span>
                    </div>

                    <button
                      type="submit"
                      className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-2.5 rounded-xl transition-all shadow-md mt-2"
                    >
                      Guardar & Empezar
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* Modal Explicativo de la Nube */}
            {showCloudInfoModal && (
              <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
                <div className="bg-slate-900 border border-slate-700 rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl text-xs">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                    <h3 className="font-bold text-white text-base flex items-center gap-2">
                      <span>☁️</span> Arquitectura de Sincronización
                    </h3>
                    <button onClick={() => setShowCloudInfoModal(false)} className="text-slate-400 hover:text-white font-bold text-xs p-1">✕</button>
                  </div>

                  <div className="space-y-2.5 text-slate-300 leading-relaxed">
                    <div className="p-3 bg-slate-950 rounded-2xl border border-slate-800 space-y-1">
                      <span className="font-bold text-white block">¿En dónde se guarda?</span>
                      <p className="text-[11px] text-slate-400">
                        En la base de datos distribuida <b>Google Cloud Firestore</b> en la colección segura:
                        <br />
                        <code className="text-indigo-300 font-mono text-[10px]">/artifacts/cineradar-pro/users/&#123;tu-codigo-perfil&#125;/library/current</code>
                      </p>
                    </div>

                    <div className="p-3 bg-slate-950 rounded-2xl border border-slate-800 space-y-1">
                      <span className="font-bold text-white block">¿Cómo funciona la sincronización?</span>
                      <p className="text-[11px] text-slate-400">
                        Cada vez que marcas un capítulo o añades una serie, se guarda automáticamente en la nube. Mediante un listener en vivo (<code className="text-cyan-300 font-mono text-[10px]">onSnapshot</code>), cualquier otro dispositivo que tenga abierto ese mismo perfil se actualiza en tiempo real sin recargar la página.
                      </p>
                    </div>
                  </div>

                  <button
                    onClick={() => setShowCloudInfoModal(false)}
                    className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-2 rounded-xl"
                  >
                    Entendido
                  </button>
                </div>
              </div>
            )}

          </div>
        );
      }

      // ==========================================
      // 2. APLICACIÓN PRINCIPAL (UNA VEZ LOGUEADO)
      // ==========================================
      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans selection:bg-indigo-500 selection:text-white pb-24 sm:pb-10">
          
          {/* Header Superior */}
          <header className="sticky top-0 z-40 glass-panel border-b border-slate-800/80 px-4 sm:px-8 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center text-xl shadow-lg shadow-indigo-600/30">
                {activeProfile.avatar || '🎬'}
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="font-display font-black text-lg tracking-tight text-white">CineRadar Pro</h1>
                  <span className="text-[10px] font-mono font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-full">
                    ☁️ Sincronizado
                  </span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-xs font-bold text-cyan-300 flex items-center gap-1">
                    👤 {activeProfile.name}
                  </span>
                  <span className="text-[10px] text-slate-500">•</span>
                  <button
                    onClick={handleExitProfile}
                    className="text-[10px] text-amber-400 hover:underline font-bold"
                  >
                    Cambiar Perfil
                  </button>
                  <span className="text-[10px] text-slate-500">•</span>
                  <span className="text-[10px] text-slate-400">{syncStatusText}</span>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => setShowEmailModal(true)}
                className="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-amber-300 border border-amber-500/40 px-3 py-1.5 rounded-xl text-xs font-bold transition-all"
                title="Configurar Alertas por Correo"
              >
                ✉️ <span className="hidden sm:inline">Alertas Correo</span>
              </button>

                      placeholder="tu@correo.com"
                      value={emailConfig.email}
                      onChange={(e) => setEmailConfig(prev => ({ ...prev, email: e.target.value }))}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-400 text-xs"
                    />
                  </div>

                  <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 space-y-2">
                    <label className="flex items-center gap-2 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={emailConfig.alertNewEpisodes}
                        onChange={(e) => setEmailConfig(prev => ({ ...prev, alertNewEpisodes: e.target.checked }))}
                        className="w-4 h-4 rounded text-amber-500 bg-slate-900"
                      />
                      <span className="text-white">Avisar con nuevo capítulo en emisión</span>
                    </label>
                    <label className="flex items-center gap-2 cursor-pointer pt-1">
                      <input
                        type="checkbox"
                        checked={emailConfig.weeklyDigest}
                        onChange={(e) => setEmailConfig(prev => ({ ...prev, weeklyDigest: e.target.checked }))}
                        className="w-4 h-4 rounded text-amber-500 bg-slate-900"
                      />
                      <span className="text-white">Resumen semanal de novedades</span>
                    </label>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={handleSendTestEmail} className="bg-slate-800 hover:bg-slate-700 text-cyan-300 font-bold py-2 rounded-xl">
                      📨 Probar Envío
                    </button>
                    <button onClick={() => { showBanner('💾 Guardado'); setShowEmailModal(false); }} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2 rounded-xl">
                      ✓ Guardar
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Modal Buscar Serie */}
          {showNewSeriesModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div className="glass-panel bg-slate-900 border border-slate-700 rounded-3xl p-5 sm:p-6 max-w-xl w-full space-y-4 shadow-2xl my-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-display font-extrabold text-base text-white">🔍 Buscar y Seguir Serie</h3>
                  <button onClick={() => setShowNewSeriesModal(false)} className="text-slate-400 hover:text-white text-xs font-bold p-1">✕</button>
                </div>

                <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 space-y-2 text-xs">
                  <div className="flex items-center justify-between">
                    <span className="text-slate-300 font-bold">Destino:</span>
                    <div className="flex bg-slate-900 p-1 rounded-xl">
                      <button
                        onClick={() => setAddDestination('tracking')}
                        className={`px-3 py-1 rounded-lg font-bold ${addDestination === 'tracking' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
                      >
                        📺 Mis Series
                      </button>
                      <button
                        onClick={() => setAddDestination('pending')}
                        className={`px-3 py-1 rounded-lg font-bold ${addDestination === 'pending' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}
                      >
                        📋 Pendientes
                      </button>
                    </div>
                  </div>

                  {addDestination === 'pending' && (
                    <div className="flex items-center justify-between pt-2 border-t border-slate-900">
                      <span className="text-slate-400 font-bold">Prioridad:</span>
                      <div className="flex gap-1.5">
                        {['high', 'medium', 'low'].map(pr => (
                          <button
                            key={pr}
                            onClick={() => setAddPriority(pr)}
                            className={`px-2.5 py-0.5 rounded-lg font-bold border text-[11px] ${
                              addPriority === pr ? 'bg-slate-800 text-white border-amber-400' : 'bg-slate-900 text-slate-400 border-slate-800'
                            }`}
                          >
                            {pr === 'high' ? '🔴 Alta' : pr === 'medium' ? '🟡 Media' : '🟢 Baja'}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                <input
                  type="text"
                  placeholder="Ej: Severance, Breaking Bad, The Bear..."
                  value={apiSearchQuery}
                  onChange={(e) => handleSearchApi(e.target.value)}
                  className="w-full bg-slate-950 border border-indigo-500/50 rounded-xl px-3 py-2.5 text-white text-xs shadow-inner"
                  autoFocus
                />

                <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                  {apiSearchResults.map(({ show }) => {
                    const poster = show.image?.medium || show.image?.original || DEFAULT_FALLBACK_POSTER;
                    return (
                      <div key={show.id} className="flex items-center justify-between p-3 bg-slate-950/80 border border-slate-800 rounded-2xl gap-3">
                        <div className="flex items-center gap-3 min-w-0">
                          <img src={poster} alt={show.name} className="w-12 h-16 object-cover rounded-xl shrink-0" />
                          <div>
                            <h4 className="font-display font-bold text-white text-xs truncate">{show.name}</h4>
                            <span className="text-[10px] text-slate-400">{show.premiered?.slice(0, 4) || 'Estreno'} • {show.genres?.join(', ') || 'Serie'}</span>
                          </div>
                        </div>
                        <button 
                          onClick={() => handleImportChosen({ show })} 
                          className={`font-bold text-[11px] px-3.5 py-2 rounded-xl transition-all shadow-md shrink-0 ${
                            addDestination === 'pending'
                              ? 'bg-amber-500 hover:bg-amber-400 text-slate-950 font-black'
                              : 'bg-indigo-600 hover:bg-indigo-500 text-white'
                          }`}
                        >
                          {addDestination === 'pending' ? '📋 A Pendientes' : '📺 Seguir Serie'}
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-900 bg-slate-950/80 text-center py-4 text-xs text-slate-500 flex items-center justify-center gap-2">
            <span>CineRadar Pro &copy; 2026/2027 — Perfil activo: <b>{activeProfile.name}</b></span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
