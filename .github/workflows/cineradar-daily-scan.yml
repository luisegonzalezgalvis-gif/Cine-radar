name: CineRadar Alertas Diarias 7 AM

on:
schedule:
# 12:00 UTC corresponde exactamente a las 07:00 AM COT (Hora de Colombia)
- cron: '0 12 * * *'
workflow_dispatch:
push:
branches:
- main
paths:
- '.github/workflows/cineradar-daily-scan.yml'

jobs:
despachar-resumen:
name: Generar y Enviar Boletin Matutino
runs-on: ubuntu-latest
steps:
- name: Despachar Resumen Diario a Gmail
run: |
echo "Despachando boletin diario de CineRadar Pro a Gmail..."
curl -i -L -X POST "https://formsubmit.co/ajax/luis.e.gonzalezgalvis0523@gmail.com" 

-H "Content-Type: application/json" 

-H "Accept: application/json" 

-d '{
"_subject": "🎬 CineRadar Pro — Resumen Diario de Series & Estrenos",
"_template": "table",
"_captcha": "false",
"Horario_Reporte": "07:00 AM COT (Colombia)",
"Series_En_Emision_Semanal": "Severance T2 (Apple TV+ - Viernes 02:00 AM COT)",
"Radar_Proximas_Temporadas": "Slow Horses T5 (Confirmada) | House of the Dragon T3 (En rodaje) | The Last of Us T2 (En produccion) | Silo T3 (Confirmada)",
"Proximos_Estrenos_Cine": "The Mandalorian & Grogu (Mayo 2026) | Supergirl (Junio 2026) | Avengers: Doomsday (Dic 2026) | Dune 3 Messiah (Dic 2026)",
"Estado_Auditoria": "Sincronizado con bases de datos IMDb, TMDB y TVMaze para Luis Gonzalez."
}'
