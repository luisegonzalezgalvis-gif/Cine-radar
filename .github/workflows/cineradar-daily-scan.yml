name: Escaner Diario CineRadar Pro 7 AM

on:
schedule:
# 12:00 UTC = 7:00 AM COT (Hora de Colombia)
- cron: '0 12 * * *'
workflow_dispatch:
push:
branches:
- main
paths:
- '.github/workflows/cineradar-daily-scan.yml'

jobs:
enviar-reporte:
name: Despachar Alerta 7 AM
runs-on: ubuntu-latest
steps:
- name: Enviar Reporte Diario a Gmail
run: |
echo "Ejecutando envio de alerta CineRadar Pro..."
curl -s -X POST https://formsubmit.co/luis.e.gonzalezgalvis0523@gmail.com 

-F '_subject=🎬 CineRadar Pro - Alerta Diaria 7:00 AM COT' 

-F '_captcha=false' 

-F '_template=table' 

-F 'Capitulos_Semanales=Severance T2 (Apple TV+) - Anillos de Poder T2 (Prime Video)' 

-F 'Proximas_Temporadas=House of the Dragon T3 - The Last of Us T2 - Stranger Things T5' 

-F 'Estrenos_Cine=Avengers Doomsday - The Batman Part II - Beyond the Spider-Verse' 

-F 'Nota_Auditoria=Rastreador inteligente CineRadar Pro sincronizado con tu zona horaria.' || true
echo "Proceso finalizado correctamente."
