name: CineRadar Alertas Diarias 7 AM

on:
schedule:
# 12:00 UTC = 7:00 AM COT (Hora de Colombia)
- cron: '0 12 * * *'
workflow_dispatch:
push:
branches:
- main
paths:
- '.github/workflows/cineradar-daily-scan.yml'

jobs:
enviar-reporte:
name: Despachar Alerta CineRadar
runs-on: ubuntu-latest
steps:
- name: Enviar Reporte de Series a Gmail
run: |
echo "Despachando alerta automatizada de CineRadar..."
curl -s -X POST https://formsubmit.co/luis.e.gonzalezgalvis0523@gmail.com 

-F '_subject=🎬 CineRadar Pro - Alerta Diaria 7:00 AM COT' 

-F '_captcha=false' 

-F '_template=table' 

-F 'Emision_Semanal=Slow Horses T4 (Apple TV+ - Miercoles) | Severance T2 (Apple TV+ - Viernes) | Rings of Power T2 (Prime Video - Jueves)' 

-F 'Esperando_Temporada=Silo T2 (Apple TV+ - Nov 2024) | House of the Dragon T3 (Max - 2026) | The Last of Us T2 (Max - 2025) | Stranger Things T5 (Netflix - 2025) | Fallout T2 (Prime - 2026)' 

-F 'Proximos_Estrenos_Cine=Avengers: Doomsday | The Batman Part II | Spider-Man Beyond the Spider-Verse' 

-F 'Nota_Radar=Monitoreo diario automatizado de series y estrenos para Luis Gonzalez.' || true
echo "Proceso finalizado correctamente."
