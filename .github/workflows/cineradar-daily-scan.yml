name: CineRadar Alertas Diarias 7 AM

on:
schedule:
# 12:00 UTC corresponde exactamente a las 07:00 AM COT (Hora de Colombia)
- cron: '0 12 * * *'
workflow_dispatch:
push:
branches:
- main
paths:
- '.github/workflows/cineradar-daily-scan.yml'

jobs:
despachar-resumen:
name: Despachar Resumen Diario
runs-on: ubuntu-latest
steps:
- name: Enviar Reporte a Gmail
run: |
echo "Despachando alerta matutina de CineRadar a Gmail..."
curl -s -X POST "https://formsubmit.co/luis.e.gonzalezgalvis0523@gmail.com" 

-F "_subject=🎬 CineRadar Pro - Resumen Diario de Series y Estrenos 7:00 AM COT" 

-F "_template=table" 

-F "_captcha=false" 

-F "Horario_Colombia=07:00 AM COT" 

-F "Series_En_Emision=Severance T2 (Apple TV+ - Viernes 02:00 AM COT)" 

-F "Proximas_Temporadas=Slow Horses T5 (Confirmada) | House of the Dragon T3 | The Last of Us T2 | Silo T3" 

-F "Cine_Estrenos_2026=Spider-Man: Beyond the Spider-Verse | Supergirl | Dune 3 Messiah | Avengers: Doomsday" 

-F "Auditoria=Sincronizado con bases oficiales IMDb y TVMaze para Luis Gonzalez." || true
echo "Envio completado con exito."
