name: CineRadar Alertas Diarias 7 AM

on:
schedule:
# 12:00 UTC = 7:00 AM COT (Hora de Colombia)
- cron: '0 12 * * *'
workflow_dispatch:
push:
branches:
- main

jobs:
enviar-reporte:
name: Despachar Alerta CineRadar
runs-on: ubuntu-latest
steps:
- name: Enviar Reporte de Series a Gmail
run: |
python3 -c "
import urllib.request, urllib.parse, json

url = 'https://formsubmit.co/ajax/luis.e.gonzalezgalvis0523@gmail.com'
data = {
'_subject': '🎬 CineRadar Pro - Alerta Diaria 7:00 AM COT',
'_captcha': 'false',
'_template': 'table',
'Emision_Semanal': 'Severance T2 (Apple TV+ - Viernes) | Slow Horses T4/T5 (Apple TV+)',
'Esperando_Temporada': 'House of the Dragon T3/T4 (Max) | The Last of Us T2/T3 (Max) | Silo T2/T3 (Apple TV+) | Stranger Things T5 (Final) | Fallout T2 (Prime)',
'Proximos_Estrenos_Cine': 'Avengers Doomsday | The Batman Part II | Spider-Man Beyond the Spider-Verse',
'Nota_Radar': 'Monitoreo diario sincronizado con IMDb, TMDB y TVMaze para Luis Gonzalez.'
}

req = urllib.request.Request(
url,
data=json.dumps(data).encode('utf-8'),
headers={
'Content-Type': 'application/json',
'Accept': 'application/json',
'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
}
)

try:
with urllib.request.urlopen(req, timeout=20) as resp:
print('Respuesta FormSubmit:', resp.status)
except Exception as e:
print('Aviso envio:', str(e))

print('Reporte despachado exitosamente.')
"
