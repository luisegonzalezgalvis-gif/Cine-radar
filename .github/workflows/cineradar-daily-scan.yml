name: CineRadar Daily Scan & Email Alertson:
schedule:
# Se ejecuta todos los días a las 12:00 UTC (07:00 AM Colombia / COT)
- cron: '0 12 * * *'
workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras probarjobs:
scan-and-notify:
runs-on: ubuntu-lateststeps:
  - name: Checkout del repositorio
    uses: actions/checkout@v4

  - name: Configurar Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: Instalar dependencias de envío
    run: |
      npm init -y
      npm install nodemailer node-fetch@2

  - name: Ejecutar escaneo de series y enviar alertas
    env:
      EMAIL_USER: ${{ secrets.NOTIFICATION_EMAIL }}
      EMAIL_PASS: ${{ secrets.NOTIFICATION_APP_PASSWORD }}
      RECIPIENT_EMAIL: ${{ secrets.USER_EMAIL }}
    run: |
      node scripts/scan_and_send.js
