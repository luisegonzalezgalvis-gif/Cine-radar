name: CineRadar Alertas Diarias 7 AM

on:
schedule:
# 12:00 UTC = 7:00 AM COT (Hora de Colombia)
- cron: '0 12 * * *'
workflow_dispatch:
push:
branches:
- main
paths:
- '.github/workflows/cineradar-daily-scan.yml'

jobs:
enviar-reporte:
name: Despachar Alerta CineRadar
runs-on: ubuntu-latest
steps:
- name: Enviar Reporte de Series a Gmail
run: |
echo "Despachando alerta diaria a Gmail..."
curl -s -L -X POST https://formsubmit.co/luis.e.gonzalezgalvis0523@gmail.com 

-F '_subject=🎬 CineRadar Pro - Alerta Diaria 7:00 AM COT' 

-F '_captcha=false' 

-F '_template=table' 

-F 'Emision_Semanal=Severance T2 (Apple TV+ - Viernes 02:00 AM COT)' 

-F 'Esperando_Temporada=Slow Horses T5 (En emision/rodaje) | House of the Dragon T4 (Sin fecha confirmada) | The Last of Us T3 (Sin fecha confirmada) | Silo T3 (En rodaje)' 

-F 'Proximos_Estrenos_Cine=Avengers Doomsday | The Batman Part II | Spider-Man Beyond the Spider-Verse' 

-F 'Nota_Auditoria=Sincronizado con IMDb, TMDB y TVMaze para Luis Gonzalez.' || true
echo "Proceso finalizado correctamente."
