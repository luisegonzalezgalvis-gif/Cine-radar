    updates = []
      for show in watchlist:
          url = f"https://api.tvmaze.com/shows/{show['tvmaze_id']}?embed[]=nextepisode&embed[]=previousepisode"
          try:
              res = requests.get(url, timeout=10)
              if res.status_code == 200:
                  data = res.json()
                  next_ep = data.get('_embedded', {}).get('nextepisode')
                  if next_ep and next_ep.get('airdate'):
                      updates.append(f"• {data['name']}: Próximo estreno el {next_ep['airdate']} (T{next_ep.get('season')}E{next_ep.get('number')} - {next_ep.get('name')})")
                  else:
                      updates.append(f"• {data['name']}: Estado actual: {data.get('status', 'En espera')}")
          except Exception as e:
              print(f"Error consultando {show['name']}: {e}")

      summary_text = "\n".join(updates)
      print("Resumen obtenido:\n", summary_text)

      # Despacho mediante el servicio FormSubmit
      endpoint = f"https://formsubmit.co/ajax/{target_email}"
      payload = {
          "_subject": f"🎬 [CineRadar Pro] Resumen Semanal de Series ({datetime.now().strftime('%d/%m/%Y')})",
          "_template": "box",
          "_captcha": "false",
          "email": target_email,
          "fecha": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
          "reporte_novedades": summary_text
      }

      try:
          resp = requests.post(endpoint, json=payload, timeout=15)
          print(f"Respuesta del despacho: {resp.status_code} - {resp.text}")
      except Exception as e:
          print(f"Fallo al despachar correo: {e}")

      EOF
