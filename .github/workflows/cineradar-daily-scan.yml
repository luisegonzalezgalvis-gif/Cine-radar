name: CineRadar Alertas Diarias 7 AM

on:
schedule:
- cron: "0 12 * * *"
workflow_dispatch:
push:
branches:
- main

jobs:
enviar-reporte:
name: Despachar Alerta CineRadar
runs-on: ubuntu-latest
steps:
- name: Enviar Reporte de Series a Gmail
run: |
curl -X POST https://formsubmit.co/luis.e.gonzalezgalvis0523@gmail.com 

-F "_subject=CineRadar Pro - Alerta Diaria 7:00 AM COT" 

-F "_captcha=false" 

-F "_template=table" 

-F "Emision_Semanal=Severance T2 (Apple TV+ - Viernes)" 

-F "Esperando_Temporada=House of the Dragon T4 (Max) - The Last of Us T3 (Max) - Slow Horses T5 (Apple TV+) - Silo T3 (Apple TV+) - Stranger Things T5" 

-F "Proximos_Estrenos_Cine=Avengers Doomsday - The Batman Part II - Spider-Man Beyond the Spider-Verse" 

-F "Nota_Radar=Monitoreo diario sincronizado con IMDb, TMDB y TVMaze para Luis Gonzalez."
