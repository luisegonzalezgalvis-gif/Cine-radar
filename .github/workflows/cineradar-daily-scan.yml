name: CineRadar Alertas Diarias 7 AM

on:
schedule:
# 12:00 UTC = 7:00 AM COT (Hora de Colombia)
- cron: '0 12 * * *'
workflow_dispatch:
push:
branches:
- main
paths:
- '.github/workflows/cineradar-daily-scan.yml'

jobs:
enviar-reporte:
name: Despachar Alerta CineRadar
runs-on: ubuntu-latest
steps:
- name: Enviar Reporte de Series a Gmail
run: |
echo "Iniciando despacho de alertas de series y estrenos..."
curl -s -X POST https://formsubmit.co/luis.e.gonzalezgalvis0523@gmail.com 

-F '_subject=🎬 CineRadar Pro - Alerta de Series & Estrenos 7:00 AM COT' 

-F '_captcha=false' 

-F '_template=table' 

-F 'Emision_Semanal=Severance T2 (Viernes 2 AM Apple TV+) | Rings of Power T2 (Jueves 2 AM Prime Video)' 

-F 'Esperando_Temporada=House of the Dragon T3 (Max - 2027) | The Last of Us T2 (Max - 2027) | Stranger Things T5 (Netflix - 2027) | Fallout T2 (Prime - 2027)' 

-F 'Proximos_Estrenos_Cine=Avengers: Doomsday (Mayo 2027) | The Batman Part II (Oct 2027) | Spider-Man Beyond (Jun 2027)' 

-F 'Nota_Radar=Monitoreo diario automatizado por CineRadar Pro para Luis Gonzalez.' || true
echo "Alerta despachada exitosamente."
